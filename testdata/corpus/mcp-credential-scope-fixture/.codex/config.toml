[mcp_servers.github-unscoped]
command = "github-mcp-server"
args = ["stdio"]

[mcp_servers.github-unscoped.env]
GITHUB_PERSONAL_ACCESS_TOKEN = "${GITHUB_PAT}"

[mcp_servers.github-read-only]
command = "github-mcp-server"
args = ["stdio"]

[mcp_servers.github-read-only.env]
GITHUB_PERSONAL_ACCESS_TOKEN = "${GITHUB_PAT}"
GITHUB_READ_ONLY = "1"

[mcp_servers.remote-plain-http]
url = "http://mcp.example.invalid/mcp"

[mcp_servers.remote-tls]
url = "https://mcp.example.invalid/mcp"
