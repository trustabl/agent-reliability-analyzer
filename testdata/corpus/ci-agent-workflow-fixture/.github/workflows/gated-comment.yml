# Synthetic fixture: the actor gate is present, so CI-001 and CI-002 stay silent;
# CI-003, CI-004 and CI-005 still fire because the comment text is untrusted input.
name: gated-comment
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  ask:
    if: contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: "Answer the comment."
          settings: |-
            {"tools": {"core": ["run_shell_command"]}}
