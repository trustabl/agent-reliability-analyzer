policy:
  id: vercel_ai_ssrf
  name: Vercel AI SDK server-side request forgery
  category: vercel_ai
  description: >
    Flags Vercel AI SDK tools whose execute() body fetches a URL the model
    controls. A model-chosen request target is a server-side request forgery
    vector into internal services and the cloud metadata endpoint.

rules:
  - id: VAI-003
    title: Vercel AI tool execute() fetches a model-controlled URL
    severity: high
    confidence: 0.75
    language: typescript
    applies_to:
      - vercel_ai_tool
    scope: tool
    match:
      all:
        - has_dynamic_url_call: true
        - not:
            any:
              - all:
                  - has_body_text:
                      - ".hostname"
                      - ".host"
                  - has_body_text:
                      - ".includes("
                      - ".has("
              - has_body_text:
                  - "allowedHosts"
                  - "allowedDomains"
                  - "ALLOWED_HOSTS"
                  - "ALLOWED_DOMAINS"
                  - "hostAllowlist"
    explanation: >
      This Vercel AI SDK tool's execute() handler issues an outbound HTTP call
      (fetch / axios / got / undici) whose URL is not a constant — it comes from
      the tool's arguments, a template string, or a concatenation, all of which
      the model controls at call time. A prompt injection can point the request
      at internal services or the cloud metadata endpoint (169.254.169.254) to
      exfiltrate credentials, and the fetched body then re-enters the
      conversation as untrusted text, opening a second-order prompt-injection
      channel.
    fix: >
      Do not let the model choose the request target. Validate the URL against an
      allow-list of permitted hosts, reject private and link-local IP ranges
      (and redirects into them), and forbid raw model-supplied URLs. Treat any
      retrieved content as untrusted — keep it out of the system prompt and do
      not let it expand the agent's permissions. Credit is given when the body checks new URL(x).hostname/host against an allow-list; also require https: and use redirect: "manual" or cap redirects.

  - id: VAI-021
    title: TypeScript Vercel AI SDK tool fetches an allow-listed host without pinning https://
    severity: medium
    confidence: 0.6
    language: typescript
    applies_to:
      - vercel_ai_tool
    scope: tool
    match:
      all:
        - has_unpinned_scheme_url_call: true
        - any:
            - all:
                - has_body_text:
                    - ".hostname"
                    - ".host"
                - has_body_text:
                    - ".includes("
                    - ".has("
            - has_body_text:
                - "allowedHosts"
                - "allowedDomains"
                - "ALLOWED_HOSTS"
                - "ALLOWED_DOMAINS"
                - "hostAllowlist"
        - not:
            has_body_text:
              - ".protocol ==="
              - ".protocol !=="
              - ".protocol =="
              - ".protocol !="
              - 'startsWith("https://")'
              - "startsWith('https://')"
              - 'startsWith("https:")'
    explanation: >
      This TypeScript Vercel AI SDK tool checks the destination host against an
      allow-list (so VAI-003 stays silent) but passes fetch/axios/got a URL
      that does not begin with a literal https:// prefix and checks no
      URL protocol. The allow-list bounds where the request can go, not how:
      an http:// URL for an allowed host is accepted, so credentials and
      request bodies cross the network in cleartext and anyone on the path
      can read or rewrite the response, which then re-enters the model's
      context as trusted tool output. This rule fires only after VAI-003's
      allow-list credit applies, so the two never fire on the same tool.
    fix: >
      Pin the scheme: build the URL from a literal `https://` prefix, or
      reject any URL whose `new URL(x).protocol` is not "https:" before
      fetching. Use redirect: "manual" or cap redirects so a redirect cannot
      downgrade to http://.
