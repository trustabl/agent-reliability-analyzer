policy:
  id: vercel_ai_side_effect_bounds
  name: Vercel AI SDK unbounded side-effect parameters
  category: vercel_ai
  description: >
    Rules that flag a side-effecting Vercel AI SDK tool
    (send/notify/refund/charge/...) whose recipient or amount parameter is
    free-form model input with no visible bound — no allow-list constraining who
    a message can go to, no cap or enum constraining how much money moves. This
    is a different failure mode from VAI-010 (idempotency): a duplicate call
    repeats an action within a bound the caller already accepted, while an
    unbounded recipient or amount lets a single call move further than the
    caller intended.

rules:
  - id: VAI-019
    title: TypeScript side-effecting tool lets the model choose the recipient or amount with no visible bound
    severity: high
    confidence: 0.5
    language: typescript
    applies_to:
      - vercel_ai_tool
    scope: tool
    match:
      all:
        - any:
            - all:
                - name_has_prefix:
                    - send
                    - notify
                - param_name_matches:
                    contains:
                      - recipient
                    exact:
                      - to
                      - cc
                      - bcc
                      - email
                      - emailAddress
                      - toEmail
                      - toAddress
                      - phone
                      - phoneNumber
                      - toNumber
            - all:
                - name_has_prefix:
                    - refund
                    - charge
                    - payout
                    - transfer
                    - issue
                - param_name_matches:
                    contains:
                      - amount
                    exact:
                      - total
                      - price
                    suffixes:
                      - cents
        - not:
            has_body_text:
              - ".max("
              - ".lte("
              - ".lt("
              - "maximum"
              - "z.enum("
              - "nativeEnum("
              - "\"enum\""
              - "enum:"
              - "MAX_"
              - "_MAX"
              - "maxAmount"
              - "_LIMIT"
              - "Limit"
              - "ALLOWED"
              - "allowedDomains"
              - "AllowList"
              - "allowList"
              - "WHITELIST"
              - "whitelist"
              - "endsWith(\"@"
              - "endsWith('@"
        - any:
            - not:
                tool_decorator_kwarg_present:
                  - needsApproval
            - tool_decorator_kwarg_value:
                kwarg: needsApproval
                value: "false"
    explanation: >
      This Vercel AI SDK tool is bound to a name that signals a send/notify or a
      refund/charge/pay side effect, and it takes a free-form recipient or amount
      parameter with no visible bound: no allow-list constraining who the message
      reaches, no cap, max, or enum constraining how much money moves, and no
      needsApproval gate. A model steered by prompt injection, a misread task, or
      another tool's poisoned output can pass any address or any amount to this
      call. This is a distinct failure from VAI-010 (idempotency): a duplicate
      call repeats an action inside a bound the caller already accepted; this rule
      is about a single call moving further — a wider blast radius, not a repeated
      one. Passing needsApproval: true or a per-call approval function is a gate
      and silences this rule, the same option VAI-018 checks. SDK 7 deprecated
      needsApproval on tool() in favor of toolApproval on generateText,
      streamText, or ToolLoopAgent; this tool-scoped rule cannot verify that
      separate setting, so a finding in SDK 7 code requires manual review. The
      tool's name is read from its const binding (const sendEmail = tool({...}));
      a tool declared inline inside tools: { sendEmail: tool({...}) } has no
      discoverable name and is not matched.
    fix: >
      Do not let the model supply the recipient or the amount unconstrained.
      Derive the recipient from trusted context rather than a model parameter, or
      constrain it with a zod allow-list / domain check validated before the call
      executes. Cap the amount with a zod bound (z.number().max(...)) or an enum
      AND enforce the same cap server-side, since a static bound in the schema can
      be bypassed by a differently-shaped call. For anything above a low,
      pre-approved threshold, set needsApproval: true on the tool() options (or
      configure toolApproval on generateText, streamText, or ToolLoopAgent for SDK
      7+, which this rule cannot verify) and handle the resulting approval
      requests in your agent loop.
