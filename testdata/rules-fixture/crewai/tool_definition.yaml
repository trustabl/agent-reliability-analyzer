policy:
  id: crewai_tool_definition
  name: CrewAI tool definition hygiene
  category: crewai
  description: >
    Hygiene rules for CrewAI tools defined with the @tool decorator from
    crewai.tools. The docstring and the parameter type hints are what CrewAI
    turns into the tool's description and argument schema for the model.

rules:
  - id: CREW-001
    title: CrewAI tool has no description
    severity: low
    confidence: 0.9
    language: python
    applies_to:
      - crewai_tool
    scope: tool
    match:
      has_docstring: false
    explanation: >
      CrewAI exposes a @tool-decorated function to the model through its docstring:
      that string becomes the tool's description in the prompt. A tool with no
      docstring reaches the model as a bare name, so the model cannot tell what the
      tool does or when to call it — it will skip the tool or invoke it with the
      wrong arguments. This is the single highest-leverage authoring fix.
    fix: >
      Add a one-paragraph docstring to the decorated function describing what the
      tool does, the inputs it expects, and what it returns. CrewAI passes this
      string to the model verbatim, so write it for the model rather than a human
      maintainer.

  - id: CREW-002
    title: CrewAI tool parameters are not type-annotated
    severity: medium
    confidence: 0.85
    language: python
    applies_to:
      - crewai_tool
    scope: tool
    match:
      all:
        - has_params: true
        - has_typed_params: false
    explanation: >
      CrewAI builds a tool's argument schema from the decorated function's type
      hints. A tool whose parameters carry no annotations produces an
      underspecified schema: the model gets no type guidance and passes arguments
      of the wrong shape, which Pydantic then rejects at validation time — a silent
      reliability tax on every call.
    fix: >
      Annotate every parameter with a concrete type (str, int, list[str], a
      Pydantic model, etc.). CrewAI propagates these annotations into the schema the
      model sees, so the model emits correctly-shaped arguments.

  - id: CREW-010
    title: CrewAI tool description is a placeholder
    severity: low
    confidence: 0.85
    language: python
    applies_to:
      - crewai_tool
    scope: tool
    match:
      has_description_text:
        - todo
        - tbd
        - fixme
        - placeholder
        - no description
        - does stuff
    explanation: >
      The docstring passes the CREW-001 has-a-description check but carries a
      placeholder marker instead of real content. CrewAI puts the tool
      description in front of the agent as its only basis for choosing between
      the tools it holds, so a stub like "TODO: describe this tool" is
      functionally indistinguishable from no description at all. In a crew the
      consequence travels: an agent that picks the wrong tool produces a task
      output that is threaded forward as context to every task behind it, so one
      undescribed tool degrades work the agent that owns it never touches — and
      CREW-104 delegation means peers can reach this tool on the strength of the
      same placeholder.
    fix: >
      Replace the placeholder with a real description covering what the tool
      does, what it returns, and when the agent should reach for it rather than
      a neighboring tool.

  - id: CREW-011
    title: CrewAI tool description is too short to guide agent selection
    severity: low
    confidence: 0.8
    language: python
    applies_to:
      - crewai_tool
    scope: tool
    match:
      all:
        - has_docstring: true
        - description_length_lt: 40
    explanation: >
      A description under 40 characters is rarely enough to convey what a tool
      does, what it returns, and when to call it rather than a similarly named
      neighbor. CrewAI passes this text to the agent as its only selection
      signal, so a stub like "Gets data." leaves scope and preconditions to
      guesswork. Each mis-selected call also spends one of the agent's CREW-110
      max_iter steps, so an agent can hit its iteration cap and hand the next
      task a half-finished result rather than an answer.
    fix: >
      Expand the description to at least a full sentence covering inputs,
      outputs, and the situation in which this tool should be used over the
      alternatives.
