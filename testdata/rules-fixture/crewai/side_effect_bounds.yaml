policy:
  id: crewai_side_effect_bounds
  name: CrewAI unbounded side-effect parameters
  category: crewai
  description: >
    Rules that flag a side-effecting CrewAI tool (send/notify/refund/charge/...)
    whose recipient or amount parameter is free-form model input with no visible
    bound — no allow-list constraining who a message can go to, no cap or enum
    constraining how much money moves. This is a different failure mode from
    CREW-006 (idempotency): a duplicate call repeats an action within a bound
    the caller already accepted, while an unbounded recipient or amount lets a
    single call move further than the caller intended.

rules:
  - id: CREW-014
    title: Side-effecting tool lets the model choose the recipient or amount with no visible bound
    severity: high
    confidence: 0.5
    language: python
    applies_to:
      - crewai_tool
    scope: tool
    match:
      all:
        - any:
            - all:
                - name_has_prefix:
                    - send_
                    - notify_
                - param_name_matches:
                    contains:
                      - recipient
                    exact:
                      - to
                      - cc
                      - bcc
                      - email
                      - email_address
                      - phone
                      - phone_number
                      - to_email
                      - to_address
                      - to_number
            - all:
                - name_has_prefix:
                    - refund_
                    - charge_
                    - pay_
                    - payout_
                    - transfer_
                    - issue_
                - param_name_matches:
                    contains:
                      - amount
                    exact:
                      - total
                      - price
                    suffixes:
                      - cents
        - not:
            has_body_text:
              - "(le="
              - " le="
              - "(lt="
              - " lt="
              - "conint("
              - "condecimal("
              - "confloat("
              - "Literal["
              - "MAX_"
              - "_MAX"
              - "_LIMIT"
              - "_limit"
              - "ALLOWED"
              - "allowed_"
              - "ALLOWLIST"
              - "allow_list"
              - "WHITELIST"
              - "whitelist"
              - "endswith(\"@"
              - "endswith('@"
    explanation: >
      This CrewAI @tool function's name signals a send/notify or a
      refund/charge/pay side effect, and it takes a free-form recipient or amount
      parameter with no visible bound: no allow-list constraining who the message
      reaches, and no cap, range, or enum constraining how much money moves. The
      agent's tool arguments come from the model's own reasoning, which prompt
      injection, a misread task, or another agent's output in a crew can steer,
      and the tool acts on whatever it is given. CrewAI has no tool-level approval
      gate to check for: Task(human_input=True) pauses on a task's final answer,
      not before an individual tool call, and is set on the task rather than the
      tool, so this rule cannot see it and a tool that is otherwise gated by it
      still fires. This is a distinct failure from CREW-006 (idempotency): a
      duplicate call repeats an action inside a bound the caller already accepted;
      this rule is about a single call moving further — a wider blast radius, not
      a repeated one. Only @tool-decorated functions are inspected; BaseTool
      subclasses are not discovered.
    fix: >
      Do not let the model supply the recipient or the amount unconstrained.
      Derive the recipient from trusted context (a value bound to the session or
      the authenticated user) rather than a model parameter, or constrain it to an
      allow-list / domain allow-list validated before the call executes. Cap the
      amount with a range check or a typed constraint AND enforce the same cap
      server-side, since a static bound can be bypassed by a differently-shaped
      call. For anything above a low, pre-approved threshold, do not let the tool
      execute directly: return a proposed action for a human to confirm, or run
      the crew with a human-approval step before the side effect.
