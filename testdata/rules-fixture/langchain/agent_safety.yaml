policy:
  id: langchain_agent_safety
  name: LangChain agent safety
  category: langchain
  description: >
    Agent-scope safety and reliability rules for LangChain / LangGraph agents
    (create_react_agent, create_agent, AgentExecutor, and raw StateGraph graphs).

rules:
  - id: LC-101
    title: LangChain agent wires a code-execution or shell built-in tool
    severity: high
    confidence: 0.85
    language: python
    applies_to:
      - langchain_agent
      - langchain_agent_executor
      - langchain_state_graph
    scope: agent
    match:
      agent_uses_hosted_tool_class:
        - PythonREPLTool
        - PythonAstREPLTool
        - ShellTool
    explanation: >
      This agent's tools list includes a LangChain built-in that executes code or
      shell commands chosen by the model: PythonREPLTool / PythonAstREPLTool run
      arbitrary Python, and ShellTool runs arbitrary shell commands. Once such a
      tool is wired, a prompt injection or a confused model has a direct path to
      arbitrary code execution in the agent process — these built-ins were the
      vector in multiple published LangChain RCE advisories.
    fix: >
      Remove the REPL/shell built-in from production agents. If you genuinely need
      code execution, run it in an isolated sandbox (no filesystem, no network, no
      credentials, hard timeout) and gate it behind a human-in-the-loop approval
      (a LangGraph interrupt_before breakpoint or a tool-approval middleware)
      rather than letting the model invoke it unattended.

  - id: LC-102
    title: LangChain AgentExecutor has no explicit max_iterations limit
    severity: low
    confidence: 0.6
    language: python
    applies_to:
      - langchain_agent_executor
    scope: agent
    match:
      agent_kwarg_missing:
        - max_iterations
    explanation: >
      This AgentExecutor sets no explicit max_iterations, so it falls back to
      LangChain's default of 15 iterations. That default prevents a true runaway,
      but it is a generic ceiling rather than one sized to this task: a model that
      loops or oscillates still runs up to 15 tool round-trips — a cost the
      workflow may not tolerate — and the implicit cap can shift between versions.
      Relying on the default also means a malformed model step is retried up to the
      limit instead of surfaced.
    fix: >
      Pass max_iterations= (and optionally max_execution_time=) to AgentExecutor,
      sized to the task. Also set handle_parsing_errors= so a malformed model step
      is surfaced rather than retried indefinitely.

  - id: LC-111
    title: TypeScript LangChain AgentExecutor has no explicit maxIterations limit
    severity: low
    confidence: 0.6
    language: typescript
    applies_to:
      - langchain_agent_executor
    scope: agent
    match:
      agent_kwarg_missing:
        - maxIterations
    explanation: >
      This AgentExecutor sets no explicit maxIterations, so it falls back to
      LangChain's built-in default iteration cap rather than running unbounded.
      That default prevents a true runaway, but it is a generic ceiling rather than
      one sized to this task: a model that loops or oscillates still runs up to the
      default number of tool round-trips — a cost the workflow may not tolerate —
      and relying on it means a malformed model step is retried up to the limit
      instead of surfaced.
    fix: >
      Pass maxIterations to the AgentExecutor options, sized to the task, and set
      handleParsingErrors so a malformed step is surfaced rather than retried
      indefinitely.

  - id: LC-103
    title: LangChain agent wires a raw HTTP Requests built-in tool
    severity: medium
    confidence: 0.75
    language: python
    applies_to:
      - langchain_agent
      - langchain_agent_executor
      - langchain_state_graph
    scope: agent
    match:
      agent_uses_hosted_tool_class:
        - RequestsGetTool
        - RequestsPostTool
        - RequestsPutTool
        - RequestsPatchTool
        - RequestsDeleteTool
    explanation: >
      This agent's tools list includes a langchain_community Requests built-in
      (RequestsGetTool / RequestsPostTool / RequestsPutTool / RequestsPatchTool /
      RequestsDeleteTool). These tools issue an outbound HTTP request to a URL the
      model supplies; only the method is fixed by the class. Because the
      destination is model-chosen rather than pinned by the tool, a prompt
      injection in content the agent has already read can steer the request at
      whatever the agent host can reach — the cloud metadata endpoint
      (169.254.169.254), a localhost admin port, or an internal service no
      external caller could address. The write-method variants can mutate those
      services rather than only read them, and each response body returns into the
      conversation as untrusted text that may carry a further injection. LangChain
      gates this family behind allow_dangerous_requests=True precisely because it
      hands the model an unconstrained fetch.
    fix: >
      Prefer a purpose-built tool that pins the base URL and accepts only a path
      or query from the model over the generic Requests built-in. Where open HTTP
      is genuinely required, constrain the destination: allow-list the permitted
      hosts, reject private and link-local ranges, re-validate the destination
      after every redirect, and route the agent's egress through a proxy that
      refuses internal addresses. Treat each response body as untrusted input —
      keep it out of the system prompt and do not let it widen the agent's tool
      permissions.
