policy:
  id: langchain_ssrf
  name: LangChain SSRF safety
  category: langchain
  description: >
    Flags LangChain tools that issue an outbound HTTP request to a
    caller-controlled (non-literal) URL — the server-side request forgery surface.

rules:
  - id: LC-005
    title: LangChain tool fetches a caller-controlled URL (SSRF)
    severity: high
    confidence: 0.8
    language: python
    applies_to:
      - langchain_tool
    scope: tool
    match:
      all:
        - has_dynamic_url_call: true
        - not:
            has_body_text:
              - ".hostname not in"
              - ".netloc not in"
              - "ALLOWED_HOSTS"
              - "ALLOWED_DOMAINS"
              - "allowed_hosts"
              - "allowed_domains"
              - "HOST_ALLOWLIST"
              - "host_allowlist"
    explanation: >
      This LangChain tool issues an HTTP request whose URL is built from a
      parameter or interpolated value rather than a fixed literal. Because the
      tool is model-callable, the model (or a prompt injection) controls the
      destination — it can reach internal services, the cloud metadata endpoint
      (169.254.169.254), or localhost admin ports the agent host can see but an
      external caller cannot. This is a classic server-side request forgery
      primitive handed to the model.
    fix: >
      Constrain the destination: validate the URL against an allow-list of hosts,
      reject private and link-local IP ranges (and redirects into them), and
      forbid raw model-supplied URLs. If the tool only ever talks to one service,
      hard-code the base URL and accept only a path/query from the model. Credit is given when the body checks the parsed hostname against a named allow-list; also require https:// and cap or disable redirects (follow_redirects=False / allow_redirects=False).

  - id: LC-013
    title: TypeScript LangChain tool fetches a caller-controlled URL (SSRF)
    severity: high
    confidence: 0.8
    language: typescript
    applies_to:
      - langchain_tool
    scope: tool
    match:
      all:
        - has_dynamic_url_call: true
        - not:
            any:
              - all:
                  - has_body_text:
                      - ".hostname"
                      - ".host"
                  - has_body_text:
                      - ".includes("
                      - ".has("
              - has_body_text:
                  - "allowedHosts"
                  - "allowedDomains"
                  - "ALLOWED_HOSTS"
                  - "ALLOWED_DOMAINS"
                  - "hostAllowlist"
    explanation: >
      This LangChain.js tool calls fetch/axios/got with a URL built from a
      non-literal value (a parameter, template string, or concatenation). Because
      the tool is model-callable, the model or a prompt injection controls the
      destination and can reach internal services, the cloud metadata endpoint, or
      localhost admin ports visible to the Node host — a server-side request
      forgery primitive.
    fix: >
      Validate the URL against an allow-list of hosts, reject private and
      link-local ranges (and redirects into them), and never pass a raw
      model-supplied URL to fetch. If the tool talks to one service, hard-code the
      base URL and accept only a path from the model. Credit is given when the body checks new URL(x).hostname/host against an allow-list; also require https: and use redirect: "manual" or cap redirects.

  - id: LC-026
    title: LangChain tool fetches an allow-listed host without pinning https://
    severity: medium
    confidence: 0.6
    language: python
    applies_to:
      - langchain_tool
    scope: tool
    match:
      all:
        - has_unpinned_scheme_url_call: true
        - has_body_text:
            - ".hostname not in"
            - ".netloc not in"
            - "ALLOWED_HOSTS"
            - "ALLOWED_DOMAINS"
            - "allowed_hosts"
            - "allowed_domains"
            - "HOST_ALLOWLIST"
            - "host_allowlist"
        - not:
            has_body_text:
              - ".scheme =="
              - ".scheme !="
              - ".scheme in"
              - ".scheme not in"
              - 'startswith("https://")'
              - "startswith('https://')"
    explanation: >
      This LangChain tool checks the destination host against an allow-list (so
      LC-005 stays silent) but builds its outbound request URL without a literal
      https:// prefix and without checking the URL scheme. The allow-list
      bounds where the request can go, not how: a model-supplied or
      configured value such as http://allowed.example.com is accepted, so
      credentials in headers and the request body cross the network in
      cleartext, and anyone on the network path can read or rewrite the
      response. The rewritten response re-enters the model's context as
      trusted tool output, a second-order prompt-injection channel. This rule
      fires only after LC-005's allow-list credit applies, so the two never
      fire on the same tool.
    fix: >
      Pin the scheme: build the URL from a literal "https://" prefix, or
      reject any URL whose urlparse(url).scheme is not "https" before the
      request. Also cap or disable redirects (follow_redirects=False /
      allow_redirects=False) so a redirect cannot downgrade to http://.

  - id: LC-027
    title: TypeScript LangChain tool fetches an allow-listed host without pinning https://
    severity: medium
    confidence: 0.6
    language: typescript
    applies_to:
      - langchain_tool
    scope: tool
    match:
      all:
        - has_unpinned_scheme_url_call: true
        - any:
            - all:
                - has_body_text:
                    - ".hostname"
                    - ".host"
                - has_body_text:
                    - ".includes("
                    - ".has("
            - has_body_text:
                - "allowedHosts"
                - "allowedDomains"
                - "ALLOWED_HOSTS"
                - "ALLOWED_DOMAINS"
                - "hostAllowlist"
        - not:
            has_body_text:
              - ".protocol ==="
              - ".protocol !=="
              - ".protocol =="
              - ".protocol !="
              - 'startsWith("https://")'
              - "startsWith('https://')"
              - 'startsWith("https:")'
    explanation: >
      This TypeScript LangChain tool checks the destination host against an
      allow-list (so LC-013 stays silent) but passes fetch/axios/got a URL
      that does not begin with a literal https:// prefix and checks no
      URL protocol. The allow-list bounds where the request can go, not how:
      an http:// URL for an allowed host is accepted, so credentials and
      request bodies cross the network in cleartext and anyone on the path
      can read or rewrite the response, which then re-enters the model's
      context as trusted tool output. This rule fires only after LC-013's
      allow-list credit applies, so the two never fire on the same tool.
    fix: >
      Pin the scheme: build the URL from a literal `https://` prefix, or
      reject any URL whose `new URL(x).protocol` is not "https:" before
      fetching. Use redirect: "manual" or cap redirects so a redirect cannot
      downgrade to http://.
