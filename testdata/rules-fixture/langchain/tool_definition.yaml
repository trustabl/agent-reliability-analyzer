policy:
  id: langchain_tool_definition
  name: LangChain tool definition hygiene
  category: langchain
  description: >
    Hygiene rules for LangChain / LangGraph tools — the @tool decorator and
    StructuredTool / Tool factories (Python), and the tool() factory /
    DynamicStructuredTool / DynamicTool (TypeScript). These surfaces drive
    whether the model can reason about a tool and call it correctly.

rules:
  - id: LC-001
    title: LangChain tool has no description
    severity: low
    confidence: 0.8
    language: python
    applies_to:
      - langchain_tool
    scope: tool
    match:
      has_docstring: false
    explanation: >
      LangChain exposes a tool to the model through its description: for an
      @tool-decorated function or a StructuredTool, the description defaults to
      the wrapped function's docstring. A tool with no docstring (and no explicit
      description=) reaches the model as a bare name, so the model cannot tell
      what the tool does or when to call it — it will skip the tool or invoke it
      with the wrong arguments. This is the single highest-leverage authoring fix.
    fix: >
      Add a one-paragraph docstring to the wrapped function describing what the
      tool does, the inputs it expects, and what it returns — or pass an explicit
      description= to StructuredTool/Tool. The model reads this string verbatim.

  - id: LC-002
    title: LangChain tool parameters are not type-annotated
    severity: medium
    confidence: 0.85
    language: python
    applies_to:
      - langchain_tool
    scope: tool
    match:
      all:
        - has_params: true
        - has_typed_params: false
    explanation: >
      LangChain builds a tool's argument schema from the wrapped function's type
      hints (or an explicit args_schema Pydantic model). A tool whose parameters
      carry no annotations produces an underspecified schema: the model gets no
      type guidance and passes arguments of the wrong shape, which LangChain then
      rejects at validation time — a silent reliability tax on every call.
    fix: >
      Annotate every parameter with a concrete type (str, int, list[str], a
      Pydantic model, etc.), or pass an args_schema= to StructuredTool. LangChain
      propagates these into the JSON schema the model sees.

  - id: LC-010
    title: TypeScript LangChain tool has no description
    severity: low
    confidence: 0.8
    language: typescript
    applies_to:
      - langchain_tool
    scope: tool
    match:
      has_docstring: false
    explanation: >
      LangChain.js exposes a tool to the model through the description field in
      its config object (the second argument to tool(), or the options for
      DynamicStructuredTool / DynamicTool). The model reads that string verbatim
      to decide whether and how to call the tool. A tool built with no description
      gives the model no signal about its purpose, so it under-calls the tool or
      calls it with the wrong arguments. Unlike Python, where the docstring is a
      fallback, the JS SDK takes the description as an explicit field — omitting it
      is a silent gap.
    fix: >
      Pass a one-sentence description in the tool() config (or the
      DynamicStructuredTool options) naming what the tool does, the inputs it
      expects, and what it returns. Write it for the model, not a human reader.

  - id: LC-021
    title: TypeScript LangChain tool description is a placeholder
    severity: low
    confidence: 0.85
    language: typescript
    applies_to:
      - langchain_tool
    scope: tool
    match:
      has_description_text:
        - todo
        - tbd
        - fixme
        - placeholder
        - no description
        - does stuff
    explanation: >
      The tool sets a description, so it passes LC-010, but the string is a
      placeholder rather than real content. LangChain.js has no docstring to
      fall back on — the description field is the entire account of the tool the
      model sees — so "TODO: describe this tool" leaves the model guessing from
      the tool name. The Zod schema does not compensate: it constrains the shape
      of the arguments once the model has chosen this tool, never whether
      choosing it was right. Mis-selection scales badly here because a
      LangChain agent is routinely handed a dozen or more tools at once, and
      each wrong pick consumes an iteration against the executor's maxIterations
      budget, so a run can exhaust its steps and return nothing useful.
    fix: >
      Replace the placeholder with a real description covering what the tool
      does, what it returns, and when the model should call it rather than a
      neighboring tool. The string is passed to the model verbatim, so write it
      for the model rather than a human maintainer.

  - id: LC-022
    title: TypeScript LangChain tool description is too short to guide model selection
    severity: low
    confidence: 0.8
    language: typescript
    applies_to:
      - langchain_tool
    scope: tool
    match:
      all:
        - has_docstring: true
        - description_length_lt: 40
    explanation: >
      A description under 40 characters is rarely enough to convey what a tool
      does, what it returns, and when to call it rather than a similarly named
      neighbor. With no docstring fallback in LangChain.js, a stub like "Gets
      data." is the whole prompt-side account of the tool, so scope and
      preconditions are left to guesswork. The cost compounds in the executor
      loop: each mis-selected call spends an iteration against the
      maxIterations bound LC-111 checks for, so a thin description can burn the
      run's step budget rather than the run producing an answer.
    fix: >
      Expand the description to at least a full sentence covering inputs,
      outputs, and the situation in which this tool should be used over the
      alternatives. Where two tools are easy to confuse, say in each which one
      the other case belongs to.
