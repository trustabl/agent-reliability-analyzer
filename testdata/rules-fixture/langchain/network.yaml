policy:
  id: langchain_network
  name: LangChain tool network hygiene
  category: langchain
  description: >
    Network-call hygiene inside LangChain tool functions. A tool that makes a
    Requests HTTP call without a finite timeout can remain blocked when an
    upstream service fails to respond, stalling the agent tool invocation.

rules:
  - id: LC-007
    title: LangChain tool network call has no timeout
    severity: high
    confidence: 0.85
    language: python
    applies_to:
      - langchain_tool
    scope: tool
    match:
      call_without_kwarg:
        callees:
          - requests.get
          - requests.post
          - requests.put
          - requests.delete
          - requests.patch
          - requests.head
          - requests.request
          - requests.Session.get
          - requests.Session.post
        missing: timeout
    explanation: >
      This LangChain tool performs a Requests HTTP call without a finite
      timeout, so it can remain blocked when an upstream service or network
      fails to respond. The tool invocation cannot complete while the request
      waits, which consumes worker and runtime resources and prevents the
      agent step from finishing. A kwarg present with literal None counts as
      missing.
    fix: >
      Configure an explicit finite Requests timeout appropriate to the
      upstream service's latency and SLA, and handle timeout failures as a
      structured tool error the model can react to rather than letting the
      call remain blocked.

  - id: LC-015
    title: TypeScript LangChain tool network call has no timeout
    severity: high
    confidence: 0.6
    language: typescript
    applies_to:
      - langchain_tool
    scope: tool
    match:
      has_http_call_without_timeout: true
    explanation: >
      This LangChain.js tool makes an outbound HTTP call (fetch / axios / got /
      undici) with no deadline — no `signal`, `timeout`, or `abortSignal` option.
      Node's `fetch` has no implicit deadline, so an unresponsive host blocks the
      tool callback forever, holding the executor iteration and the request
      worker behind it. Paired with LC-013 the exposure compounds: a
      model-controlled URL that also cannot time out can be steered at an
      internal host that simply never answers.
    fix: >
      Attach a deadline. On modern runtimes,
      `await fetch(url, { signal: AbortSignal.timeout(15_000) })`; on older ones,
      create an `AbortController`, abort it from a `setTimeout`, pass
      `controller.signal`, and clear the timer in a `finally`. axios and got take
      a `timeout` option directly. Return the abort as a structured tool error so
      the model can retry or route around it.
