policy:
  id: agent_config_harness_guidance
  name: Harness guidance hidden text
  category: agent_config
  description: >
    Repo-scoped rule for the guidance files of a staged OpenCode harness tree
    (systemprompt.md, guardrails.md, LongTermMEMORY.md and tool_descriptions/*.md,
    recognised when systemprompt.md and guardrails.md sit side by side). An agent
    reads these files as instructions and an adaptation process may rewrite them,
    while a person reviewing an adopted harness sees only rendered text, so
    characters that are invisible or that reorder what a reviewer sees can carry
    instructions only the model reads. The rule is an objective code-point test;
    it does not judge what the instructions say. It is separate from AGCFG-009,
    which covers AGENTS.md. The pack loads for every scan (the files have no SDK
    import), so the rule's own predicate does the gating. Fires once per scan,
    attributed to the first offending file.

rules:
  - id: AGCFG-010
    title: Harness guidance file contains invisible or direction-overriding text
    severity: medium
    confidence: 0.6
    applies_to:
      - agent_config
    scope: repo
    match:
      repo_harness_guidance_has_hidden_text: true
    explanation: >
      A guidance file of a staged OpenCode harness tree contains zero-width
      characters, Unicode Tags-block characters (U+E0000 to U+E007F), or
      bidirectional override characters. These files are loaded into the agent's
      context as instructions, and a reviewer of an adopted harness sees only
      the rendered text, so any of these can hide an instruction from a human
      while the model still reads it. Tags-block characters mirror ASCII
      invisibly and are the usual carrier for this attack. A byte order mark at
      the start of the file, emoji joined by a zero-width joiner, and
      subdivision-flag emoji are not flagged. Right-to-left prose that uses
      bidirectional controls is flagged and is a known false positive. The
      characters themselves are never echoed.
    fix: >
      Remove the invisible or direction-overriding characters, and retype any
      line that contained them, because they are easy to paste back in. Review
      harness changes with a tool that shows hidden characters before adopting
      them, and keep instructions in plain visible text.
