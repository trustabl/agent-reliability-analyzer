policy:
  id: claude_skill_quality_text
  name: Claude Agent Skill quality (text-match)
  category: claude_skill
  description: >
    Quality and data-governance signals in Claude Code Agent Skills (SKILL.md)
    detected via free-text matching over the skill's name, description, and
    body — claimed crypto/security purpose, sensitive-data handling, missing
    error-handling or purpose language, placeholder descriptions, and
    broad-access or retention phrasing.
    Skill rules audit SKILL.md frontmatter + body and are language-agnostic
    (markdown), so they carry no language: field.

rules:
  - id: CSKILL-080
    title: Skill claims cryptographic operations
    severity: high
    confidence: 0.75
    applies_to:
      - claude_skill
    scope: skill
    match:
      skill_text_matches:
        fields: [name, description]
        terms:
          - crypto
          - cryptographic
          - encrypt
          - decrypt
          - cipher
          - certificate
          - keypair
          - private key
          - sign
          - signature
          - hash
          - hmac
          - asymmetric
          - symmetric
        exclude_context:
          - example
          - for instance
          - e.g.
          - such as
          - sample
          - documented
          - documentation
          - see the
          - refer to
          - placeholder
    explanation: >
      This skill's name or description claims a cryptographic operation —
      encrypting, decrypting, signing, hashing, or certificate handling — but
      states no concrete primitive, key source, or algorithm bound. Crypto is
      easy to misuse silently: a weak cipher, a reused IV, an unvalidated
      signature, or a hardcoded key all look like working code right up until
      they fail under attack, and a skill invoked without those specifics gives
      Claude no constraint to hold to when it writes the actual crypto code.
      A mention that is clearly an example or a pointer to documentation (e.g.
      "for instance, hash a string" or "see the crypto docs") does not count —
      only a claim that the skill itself performs the operation does.
    fix: >
      State the exact primitive the skill uses (e.g. "AES-256-GCM via the
      `cryptography` library", "Ed25519 signing"), where keys or certificates
      come from, and any bounds on their use. Prefer delegating to a vetted,
      well-maintained crypto library and name it explicitly rather than having
      the skill describe cryptographic operations in the abstract.

  - id: CSKILL-081
    title: Skill processes sensitive data
    severity: high
    confidence: 0.7
    applies_to:
      - claude_skill
    scope: skill
    match:
      skill_text_matches:
        fields: [description, body]
        terms:
          - password
          - secret
          - credential
          - api token
          - access token
          - auth token
          - authentication token
          - bearer token
          - refresh token
          - session token
          - oauth token
          - secret token
          - api key
          - ssn
          - social security
          - credit card
          - pii
          - personal data
          - sensitive data
          - confidential
          - private key
        require_context:
          - read
          - write
          - store
          - save
          - send
          - transmit
          - collect
          - process
          - handle
          - log
          - extract
          - parse
          - redact
          - encrypt
          - upload
          - post
          - fetch
          - retrieve
          - access
        exclude_context:
          - lives in
          - live in
          - configured in
          - see the
          - documentation
          - example
          - for instance
          - e.g.
    explanation: >
      This skill's body or description names a sensitive data class (passwords, credentials,
      credential-type tokens such as API, access, bearer, refresh or session tokens, SSNs,
      credit card numbers, PII, or private keys) in the same sentence as an operational verb
      (reads, stores, sends, processes, ...), so it claims to handle that data rather than
      merely mention it, without stating what it does with that data beyond naming it. Without
      an explicit data-minimization boundary and a stated purpose, there is no way to tell
      whether the skill touches the fields the task requires or retains what it reads.
      Limits of this check: it reads words, not meaning. A bare "token" does not match, so a
      sentence about "the token" with no credential qualifier is not flagged. A sentence that
      states where a credential already lives (for example "API keys live in GitHub Actions
      secrets") does not count. "Credential" in the sense of a professional qualification,
      "access" or "process" used in a different sense than operating on the data, and advice
      about how other systems should treat credentials can still match.
    fix: >
      Declare exactly which sensitive fields the skill reads, why it needs them, and how long
      it keeps them (ideally: not at all, beyond the current turn). If the skill needs to
      detect or redact sensitive data rather than process its contents, say so explicitly in
      the description.

  - id: CSKILL-082
    title: Security-purpose skill grants side-effecting tools
    severity: high
    confidence: 0.8
    applies_to:
      - claude_skill
    scope: skill
    match:
      all:
        - skill_name_has_text:
            - security
            - audit
            - pentest
            - scan
            - vulnerability
            - compliance
        - skill_allows_unrestricted_tool:
            - Bash
            - Write
            - Edit
            - WebFetch
            - NotebookEdit
    explanation: >
      This skill's name claims a security, audit, pentest, or compliance
      purpose — a role that is expected to observe and report, not mutate —
      yet its allowed-tools pre-approve an unrestricted side-effecting or
      exfiltration-capable tool (Bash / Write / Edit / WebFetch /
      NotebookEdit). A skill that can be steered into "auditing" a system
      while holding unscoped write or shell access turns a read-first review
      into a privilege-escalation path, whether by an ambiguous request or an
      injected instruction encountered mid-audit.
    fix: >
      Narrow allowed-tools to the read-only set an audit role actually needs
      (Read, Grep, Glob), or to scoped grants such as `Bash(git status:*)` or
      `Edit(docs/**)`. If the skill genuinely must remediate what it finds,
      split remediation into a separate, explicitly-named skill so the
      audit-only skill's grants match what its name promises.

  - id: CSKILL-083
    title: Skill body lacks error-handling guidance
    severity: low
    confidence: 0.5
    applies_to:
      - claude_skill
    scope: skill
    match:
      not:
        skill_body_has_text:
          - error
          - exception
          - catch
          - retry
          - fallback
          - fail
          - handle
          - recover
    explanation: >
      This skill's body contains no error-handling language at all — no
      mention of what to do if a step errors, a tool call fails, or a retry is
      warranted. When a tool fails mid-task, Claude has no guidance from the
      skill on whether to retry, fall back, or stop, and may proceed on
      partial or unexpected results rather than surfacing the failure.
    fix: >
      Add a short paragraph naming what should happen if a step fails — retry
      once, fall back to an alternative, or stop and report the failure to the
      user — so the skill's guidance covers the unhappy path, not just the
      success case.

  - id: CSKILL-084
    title: Skill requests broad, unminimized data access
    severity: medium
    confidence: 0.6
    applies_to:
      - claude_skill
    scope: skill
    match:
      skill_text_matches:
        fields: [body]
        terms:
          - all data
          - entire database
          - entire dataset
          - entire table
          - complete database
          - every record
          - full export
          - all records
    explanation: >
      This skill's body uses broad-access phrasing ("all data", "entire database", "every
      record", "full export") that suggests it pulls more than the task at hand needs.
      Requesting a whole dataset or a full export when a task needs a filtered subset widens
      the blast radius of any bug, leak, or injected instruction that later acts on the
      retrieved data.
      Limits of this check: the phrases are matched as whole words, so "entirely" and
      "small files" do not match, and a bare "entire" or "all files" is not flagged. A skill
      can ask for everything with wording outside this list ("pull the whole users table").
      The text states intent; the tool that runs the query enforces the real boundary.
    fix: >
      Scope the skill's data access to the specific records or fields the task requires and
      filter at the source rather than fetching everything and filtering afterward. If a full
      export is the task, state why in the skill's description so reviewers can evaluate the
      scope deliberately rather than by default.

  - id: CSKILL-085
    title: Skill description states no purpose
    severity: low
    confidence: 0.5
    applies_to:
      - claude_skill
    scope: skill
    match:
      not:
        skill_text_matches:
          fields: [description]
          terms:
            - to
            - for
            - when
            - use
            - used
            - in order to
            - so that
            - purpose
            - helps
            - designed to
            - intended to
    explanation: >
      This skill's description contains none of the words that introduce a purpose or
      a trigger ("to ...", "for ...", "when ...", "use ...", "so that ..."), so it may state what
      the skill touches without stating why. A user or reviewer deciding whether the skill's
      data access and tool grants are justified has no stated intent to weigh them against.
      Limits of this check: it looks for those words as whole words, not for meaning. A
      description in a language other than English, or a description that states its goal
      with a plain verb phrase ("Builds Flask apps"), can match without lacking a purpose,
      and a description that uses one of the words in another sense passes without stating one.
    fix: >
      Add one clause to the description that states the skill's purpose, for example "...to
      allow drafting release notes from commit history", or when to use it. A single purpose
      phrase is enough to let a reviewer judge whether the skill's access is proportionate to
      what it is for.

  - id: CSKILL-086
    title: Skill body implies data retention or logging
    severity: medium
    confidence: 0.65
    applies_to:
      - claude_skill
    scope: skill
    match:
      skill_text_matches:
        fields: [body]
        terms:
          - log
          - store
          - persist
          - persistence
          - persistent
          - save
          - retain
          - cache
          - write to
          - append to
    explanation: >
      This skill's body uses language implying persistence (logging, storing, caching, saving,
      or appending to a file) without stating a retention policy or user-consent basis for
      keeping that data. Data that is written or logged outlives the current session, so what
      gets kept, for how long, and who can see it needs to be explicit rather than implied by a
      verb in the instructions.
      Limits of this check: terms are matched as whole words, so "logic", "catalog",
      "methodology" and "restore" do not match, and the bare nouns "record" and "database" are
      no longer flagged. The sentence is not checked for a data-class word, so persisting a
      setting or a generated file still matches, as does a sentence that reads logs rather
      than writes them. Persistence worded outside the list ("keep a copy") is not seen.
    fix: >
      State what is stored, where it is stored, how long it is retained, and the basis for
      retaining it (for example "logs the request ID, for 24 hours, to support debugging"). If
      the skill does not need to persist anything beyond the current turn, say so explicitly
      instead of leaving it to be inferred.

  - id: CSKILL-087
    title: Skill description is a placeholder
    severity: low
    confidence: 0.85
    applies_to:
      - claude_skill
    scope: skill
    match:
      skill_description_has_text:
        - todo
        - tbd
        - fixme
        - placeholder
        - no description
        - does stuff
    explanation: >
      This skill's description is present, so it passes the empty-description
      check, but the text is a placeholder stub ("TODO", "TBD", "FIXME",
      "placeholder", "no description", "does stuff") rather than a real
      account of what the skill does. Claude Code always loads the description
      into context and uses it to decide whether to auto-invoke the skill; a
      stub gives the model no selection signal and a reviewer no basis for
      judging the skill's tool grants — functionally the same as no
      description at all, except CSKILL-070 never sees it.
    fix: >
      Replace the placeholder in the SKILL.md `description:` field with a
      real one-to-two-sentence summary of what the skill does, which tools it
      uses, and any side effects it may have. For example: "Summarises the
      current git diff and posts a draft PR description. Uses Bash
      (read-only git commands) and WebFetch."
