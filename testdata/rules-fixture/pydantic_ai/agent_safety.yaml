policy:
  id: pydantic_ai_agent_safety
  name: Pydantic AI agent safety
  category: pydantic_ai
  description: >
    Agent-scope safety rules for Pydantic AI agents (the Agent(...) constructor).
    These flag missing output validation, model-driven code execution and URL
    fetching wired as native tools, a FileUrl force_download that fetches on the
    agent host, and a retry strategy that re-runs an already-executed tool.

rules:
  - id: PYD-101
    title: Pydantic AI agent has no structured output validation
    severity: low
    confidence: 0.7
    language: python
    applies_to:
      - pydantic_ai_agent
    scope: agent
    match:
      any:
        - agent_kwarg_missing:
            - output_type
        - agent_kwarg_value:
            kwarg: output_type
            value: str
    explanation: >
      This agent does not constrain its output to a validated type: output_type is
      absent (defaulting to free-form str) or set explicitly to str. Pydantic AI's
      core value is that output_type can be a Pydantic model the framework
      validates and, on failure, asks the model to correct — turning model output
      into a typed contract. Without it, the agent returns whatever text the model
      produced, so downstream code parses unvalidated strings and a prompt
      injection or a confused model can return malformed or unexpected content
      that is consumed as if it were trusted.
    fix: >
      Set output_type to a Pydantic model (or a typed union) describing the
      result the agent must return. Pydantic AI then validates each run against
      that schema and re-prompts the model on a validation failure, so callers
      receive a checked, typed object instead of raw text.

  - id: PYD-102
    title: Pydantic AI agent wires the code-execution native tool
    severity: high
    confidence: 0.85
    language: python
    applies_to:
      - pydantic_ai_agent
    scope: agent
    match:
      agent_uses_hosted_tool_class:
        - CodeExecutionTool
    explanation: >
      This agent wires Pydantic AI's CodeExecutionTool (via capabilities= or
      builtin_tools=), a provider-native tool that executes code the model
      generates. Once it is in the tool set, a prompt injection or a confused
      model can run attacker-chosen code in the execution environment the provider
      grants the tool. Because the agent's instructions, tool outputs, and any
      retrieved content are all model-reachable, this is a direct path from prompt
      injection to arbitrary code execution.
    fix: >
      Remove CodeExecutionTool from production agents. If code execution is a
      genuine requirement, run it outside the agent in a hardened sandbox (no
      filesystem, no network, no credentials, hard timeout) and gate it behind an
      explicit human approval rather than exposing a model-invokable code runner.

  - id: PYD-103
    title: Pydantic AI agent wires a model-driven web-fetching or search native tool
    severity: medium
    confidence: 0.75
    language: python
    applies_to:
      - pydantic_ai_agent
    scope: agent
    match:
      agent_uses_hosted_tool_class:
        - WebFetchTool
        - UrlContextTool
        - WebSearchTool
    explanation: >
      This agent wires a native web-retrieval tool (WebFetchTool, UrlContextTool,
      or WebSearchTool) whose destination or query the model controls. For the
      URL fetchers, a prompt injection can point the request at internal
      services, the cloud metadata endpoint (169.254.169.254), or localhost
      admin ports the agent host can reach — a server-side request forgery
      surface — and can also exfiltrate retrieved or in-context data to an
      attacker-controlled URL. For WebSearchTool, the query itself is an
      exfiltration channel and the returned results are attacker-reachable text
      that re-enters the context as a second-order prompt-injection channel.
      Pydantic AI's built-in fetchers have already needed SSRF hardening
      (CVE-2026-46678, CVE-2026-25580), so enabling one without network egress
      controls reintroduces that exposure.
    fix: >
      Only enable a native fetch or search tool when the agent genuinely needs
      open web access, and put network egress controls around the agent process:
      an allow-list of permitted hosts, blocked private/link-local IP ranges, and
      a proxy that rejects requests to internal addresses. Prefer a purpose-built
      tool that fetches from a fixed, vetted set of endpoints over an open URL
      fetcher, and treat retrieved or searched content as untrusted input. WebFetchTool's allowed_domains
      narrows destinations on Anthropic only (Google ignores it), so it is not a
      substitute for process-level egress controls.

  - id: PYD-104
    title: Pydantic AI FileUrl forces a host-side download
    severity: medium
    confidence: 0.7
    language: python
    applies_to:
      - pydantic_ai_agent
    scope: agent
    match:
      any:
        - agent_file_url_force_download: true
        - agent_hosted_tool_kwarg_value:
            class: WebFetchTool
            kwarg: force_download
            value: "True"
        - agent_hosted_tool_kwarg_value:
            class: WebFetchTool
            kwarg: force_download
            value: "allow-local"
    explanation: >
      This agent constructs a FileUrl-family object (ImageUrl, AudioUrl, VideoUrl,
      DocumentUrl) with force_download set to True or "allow-local", or wires a
      WebFetchTool with the same kwarg. force_download=True makes the Pydantic AI
      process download the URL itself instead of passing it through to the model
      provider, so a prompt injection or a caller-supplied URL is fetched from
      the agent host — the SSRF surface Pydantic AI's own fetchers have already
      needed CVE fixes for (CVE-2026-46678, CVE-2026-25580). force_download=
      "allow-local" goes further: the host still downloads, but private IPs are
      allowed, which turns off the private-range half of that SSRF guard (cloud
      metadata stays blocked). The default False lets providers that support URL
      passthrough fetch the resource themselves, without opening a host-side
      request.
    fix: >
      Leave force_download at its False default so the URL is passed to the
      provider when it supports that, and never set "allow-local" in production.
      If the host must download, keep force_download=True only for URLs you
      control, put egress controls around the process (a host allow-list,
      blocked private and link-local ranges), and reject caller- or
      model-supplied URLs. On any endpoint that accepts client-submitted
      FileUrls, run Pydantic AI's history sanitizer with
      allowed_file_url_force_download left empty so True and "allow-local" are
      reset.

  - id: PYD-105
    title: Pydantic AI agent retries with the exhaustive end strategy
    severity: low
    confidence: 0.7
    language: python
    applies_to:
      - pydantic_ai_agent
    scope: agent
    match:
      agent_kwarg_value:
        kwarg: end_strategy
        value: exhaustive
    explanation: >
      This agent sets end_strategy="exhaustive". When the model emits a final
      result alongside still-pending tool calls, the exhaustive strategy runs
      those remaining tool calls anyway before ending the run, instead of
      returning immediately (the "early" default). If any of those pending calls
      is side-effecting — a write, a charge, a send — exhaustive mode executes it
      even though the model already considered the task done, widening the blast
      radius of a single run and making duplicate or unintended side effects more
      likely.
    fix: >
      Leave end_strategy at its "early" default so the run ends as soon as the
      model produces a final result, skipping pending tool calls. Only choose
      exhaustive when every tool the agent can call is side-effect-free and you
      specifically need the remaining calls to complete.

  - id: PYD-106
    title: Pydantic AI agent has no explicit usage_limits set
    severity: low
    confidence: 0.6
    language: python
    applies_to:
      - pydantic_ai_agent
    scope: agent
    match:
      agent_run_call_usage_limits_missing: true
    explanation: >
      No run/run_sync/run_stream call that executes this agent sets
      usage_limits, so Pydantic AI falls back to a bare UsageLimits() —
      capping request count but leaving token and cost usage completely
      unbounded. A model that loops or oscillates, or a single run that
      balloons into an unexpectedly long tool-calling chain, can burn far more
      tokens and cost than the task warrants before the request cap is ever
      reached, and nothing stops a single expensive run from running the bill
      up. An explicit, task-sized UsageLimits also turns a runaway run into a
      clean UsageLimitExceeded instead of a silent cost overrun.
    fix: >
      Pass usage_limits=UsageLimits(...) to agent.run/run_sync/run_stream,
      sized to the task — request_limit for a hard step count, and
      total_tokens_limit or input_tokens_limit/output_tokens_limit to bound
      token spend directly. Treat hitting the limit as a signal to surface and
      handle rather than to raise it.

  - id: PYD-108
    title: Pydantic AI run call has no wall-clock timeout
    severity: low
    confidence: 0.55
    language: python
    applies_to:
      - pydantic_ai_agent
    scope: agent
    match:
      agent_run_call_wall_clock_timeout_missing: true
    explanation: >
      No run/run_sync/run_stream call that executes this Pydantic AI agent is
      wrapped in a wall-clock timeout (asyncio.wait_for, asyncio.timeout, or
      anyio.move_on_after / fail_after). usage_limits caps request count and
      token spend, but it does not bound how long a single model request or
      tool call may block: a stalled provider connection or a slow tool hangs
      the run indefinitely while it holds the worker and its tool
      credentials. This is distinct from PYD-106 (usage_limits): a run can sit
      well inside its limits and still never return. The check is structural —
      a timeout elsewhere in the file that does not enclose the call is not
      credited — and a timeout applied by the caller of the function
      containing the call is not visible here.
    fix: >
      Wrap the call: await asyncio.wait_for(agent.run(prompt,
      usage_limits=...), timeout=...) or run it inside async with
      asyncio.timeout(...): sized to the task. Also set a request timeout via
      ModelSettings(timeout=...) so an individual model call fails fast, and
      treat TimeoutError as a failed run rather than retrying blindly.
