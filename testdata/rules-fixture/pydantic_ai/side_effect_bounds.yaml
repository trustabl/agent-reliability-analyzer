policy:
  id: pydantic_ai_side_effect_bounds
  name: Pydantic AI unbounded side-effect parameters
  category: pydantic_ai
  description: >
    Rules that flag a side-effecting Pydantic AI tool (send/notify/refund/
    charge/...) whose recipient or amount parameter is free-form model input
    with no visible bound — no allow-list constraining who a message can go
    to, no cap or enum constraining how much money moves. This is a different
    failure mode from PYD-007 (idempotency): a duplicate call repeats an
    action within a bound the caller already accepted, while an unbounded
    recipient or amount lets a single call move further than the caller
    intended.

rules:
  - id: PYD-014
    title: Side-effecting tool lets the model choose the recipient or amount with no visible bound
    severity: high
    confidence: 0.5
    language: python
    applies_to:
      - pydantic_ai_tool
    scope: tool
    match:
      all:
        - any:
            - all:
                - name_has_prefix:
                    - send_
                    - notify_
                - param_name_matches:
                    contains:
                      - recipient
                    exact:
                      - to
                      - cc
                      - bcc
                      - email
                      - email_address
                      - phone
                      - phone_number
                      - to_email
                      - to_address
                      - to_number
            - all:
                - name_has_prefix:
                    - refund_
                    - charge_
                    - pay_
                    - payout_
                    - transfer_
                    - issue_
                - param_name_matches:
                    contains:
                      - amount
                    exact:
                      - total
                      - price
                    suffixes:
                      - cents
        - not:
            has_body_text:
              - "(le="
              - " le="
              - "(lt="
              - " lt="
              - "conint("
              - "condecimal("
              - "confloat("
              - "Literal["
              - "MAX_"
              - "_MAX"
              - "_LIMIT"
              - "_limit"
              - "ALLOWED"
              - "allowed_"
              - "ALLOWLIST"
              - "allow_list"
              - "WHITELIST"
              - "whitelist"
              - "endswith(\"@"
              - "endswith('@"
        - any:
            - not:
                tool_decorator_kwarg_present:
                  - requires_approval
            - tool_decorator_kwarg_value:
                kwarg: requires_approval
                value: "False"
    explanation: >
      This Pydantic AI tool's name signals a send/notify or a refund/charge/
      pay side effect, and it takes a free-form recipient or amount parameter
      with no visible bound: no allow-list constraining who the message
      reaches, no cap, range, or enum constraining how much money moves, and
      no requires_approval gate. A model steered by prompt injection, by its
      own misreading of the task, or by an upstream tool's poisoned output can
      pass any address or any amount to this call, and the tool will act on
      it. This is a distinct failure from PYD-007 (idempotency): a duplicate
      call repeats an action inside a bound the caller already accepted; this
      rule is about a single call moving further — a wider blast radius, not
      a repeated one. Setting requires_approval=True on @agent.tool /
      @agent.tool_plain routes the call through Pydantic AI's deferred-tool
      approval flow and is a gate that silences this rule.
    fix: >
      Do not let the model supply the recipient or the amount unconstrained.
      Derive the recipient from trusted context (the authenticated user's
      on-file address, the run's originating conversation) rather than a
      model parameter, or constrain it to an allow-list / domain allow-list
      validated before the call executes. Cap the amount with a Pydantic
      field constraint (Annotated[int, Field(le=...)], conint(le=...)) AND
      enforce the same cap server-side, since a static bound can be bypassed
      by a differently-shaped call. For anything above a low, pre-approved
      threshold, set requires_approval=True and handle the resulting
      DeferredToolRequests in your run loop so a human signs off before the
      call executes.
