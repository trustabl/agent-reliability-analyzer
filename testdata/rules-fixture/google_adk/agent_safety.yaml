policy:
  id: google_adk_agent_safety
  name: ADK agent safety
  category: google_adk
  description: >
    Agent-scope safety rules for Google ADK LlmAgents and workflow
    agents. Covers description hygiene, callback-based interception
    of shell tools, sub-agent shell exposure, and unrestricted MCP
    tool surfaces.

rules:
  - id: ADK-101
    title: LlmAgent has no description
    severity: medium
    confidence: 0.85
    language: python
    applies_to:
      - adk_llm_agent
    scope: agent
    match:
      all:
        - agent_class: [LlmAgent]
        - agent_kwarg_missing: [description]
    explanation: >
      Google ADK routes delegation between agents using the
      `description=` field on each LlmAgent. When a parent agent
      decides whether to delegate to a child in its `sub_agents` tree,
      the model sees only the child's description. An agent with no
      description becomes effectively unreachable through delegation —
      it sits in the tree but the parent's model has no signal to pick
      it. This usually shows up as a silent routing bug.
    fix: >
      Add a `description=` kwarg that names this agent's role and the
      kind of input it expects. One sentence is usually enough. Treat
      it as documentation for the parent agent's model.

  - id: ADK-102
    title: Agent with the bash tool has no before_tool_callback
    severity: high
    confidence: 0.85
    language: python
    applies_to:
      - adk_llm_agent
    scope: agent
    match:
      all:
        - agent_class: [LlmAgent]
        - agent_uses_hosted_tool_class: [BashTool, ExecuteBashTool]
        - agent_kwarg_missing: [before_tool_callback]
    explanation: >
      An LlmAgent with the bash tool (`ExecuteBashTool` in current google-adk;
      `BashTool` in earlier releases) in its tools= list can execute
      arbitrary shell commands chosen by the model. ADK's
      `before_tool_callback` is the only synchronous interception point
      where you can inspect a tool call before it executes and
      short-circuit it — the moral analog of an OpenAI agent's
      `input_guardrails`. An agent with the bash tool and no
      `before_tool_callback` has no policy of its own over which shell
      commands the model invents — only the tool's generic built-in
      confirmation prompt stands between the model and execution.
    fix: >
      Add a `before_tool_callback=` that inspects the tool name and
      arguments, allow-lists known-safe commands (or denies known-bad
      ones), and returns a refusal `Content` when the call should be
      blocked. Returning anything non-None from the callback skips the
      tool execution.

  - id: ADK-103
    title: Sub-agent is granted the bash tool
    severity: high
    confidence: 0.9
    language: python
    applies_to:
      - adk_llm_agent
    scope: agent
    match:
      all:
        - agent_is_subagent_of_any: true
        - agent_uses_hosted_tool_class: [BashTool, ExecuteBashTool]
    explanation: >
      This LlmAgent appears in another agent's `sub_agents=[...]` tree
      AND is granted the bash tool (`ExecuteBashTool` in current
      google-adk; `BashTool` in earlier releases). A parent agent can
      delegate to a child without the child's tool calls being mediated
      by the parent's `before_tool_callback`. Granting shell access to a
      delegated sub-agent makes the parent's policy worthless: the
      model can route around any safety hook by handing off to the
      sub-agent and asking it to run the same command.
    fix: >
      Either remove the bash tool from this sub-agent's tools= list, or
      restructure so the shell-capable agent is the orchestrator at
      the top of the tree (so its `before_tool_callback` actually
      mediates every shell call).

  - id: ADK-104
    title: Agent has no safety_settings
    severity: medium
    confidence: 0.75
    language: python
    applies_to:
      - adk_llm_agent
    scope: agent
    match:
      all:
        - agent_class: [LlmAgent]
        - agent_kwarg_missing: [generate_content_config.safety_settings]
    explanation: >
      Google ADK agents use Gemini models whose configurable content filters
      default to OFF when safety_settings is not provided. safety_settings is
      not a top-level LlmAgent argument — it is set inside the agent's
      generate_content_config (a google-genai GenerateContentConfig). Harm
      categories including DANGEROUS_CONTENT, HATE_SPEECH, HARASSMENT, and
      SEXUALLY_EXPLICIT are not actively filtered when it is absent. In an
      agentic loop where model outputs drive subsequent tool calls, an
      unfiltered harmful output can propagate into real side effects.
    fix: >
      Pass safety_settings within the generate_content_config= given to the
      LlmAgent constructor, e.g. generate_content_config=types.GenerateContentConfig(
      safety_settings=[...]), with explicit HarmBlockThreshold values for each
      HarmCategory your use case requires. At minimum set DANGEROUS_CONTENT to
      BLOCK_LOW_AND_ABOVE for agents that touch external data or execute tools
      with side effects.

  - id: ADK-105
    title: Agent uses web search built-in without before_tool_callback
    severity: high
    confidence: 0.85
    language: python
    applies_to:
      - adk_llm_agent
    scope: agent
    match:
      all:
        - agent_class: [LlmAgent]
        - any:
            - agent_grants_builtin_tool: [google_search]
            - agent_uses_hosted_tool_class: [GoogleSearchTool, VertexAiSearchTool]
        - agent_kwarg_missing: [before_tool_callback]
    explanation: >
      This LlmAgent is wired with a web search built-in (the google_search
      instance, GoogleSearchTool, or VertexAiSearchTool) but has no
      before_tool_callback. Web search results are
      untrusted external data that can contain prompt injection payloads.
      Without a callback intercepting tool calls before execution, there is no
      gate to validate queries or block attacker-influenced invocations. An
      injected instruction retrieved from a prior search can direct the agent
      to issue further queries or pass malicious content to downstream tools.
    fix: >
      Pass before_tool_callback= to the LlmAgent constructor. The callback
      receives the tool name and parameters before execution; validate that the
      search query conforms to expected patterns and return a dict with an
      "error" key to block suspicious calls. Pair this with safety_settings= to
      filter harmful model outputs from processing search content.

  - id: ADK-106
    title: Agent has a code_executor but no before_model_callback
    severity: high
    confidence: 0.8
    language: python
    applies_to:
      - adk_llm_agent
    scope: agent
    match:
      all:
        - agent_class: [LlmAgent]
        - agent_kwarg_present: [code_executor]
        - agent_kwarg_missing: [before_model_callback]
    explanation: >
      This LlmAgent sets a code_executor, which lets the model emit code blocks
      that ADK extracts and runs. With an UnsafeLocalCodeExecutor this is
      arbitrary code execution in the agent process. The only synchronous gate
      over what the model emits is before_model_callback — before_tool_callback
      does not fire for code execution, because code blocks are not tool calls.
      An agent with a code_executor and no before_model_callback runs
      model-authored code with nothing inspecting it.
    fix: >
      Add a before_model_callback that inspects the assembled LlmRequest and
      rejects unsafe code, and prefer a sandboxed executor (ContainerCodeExecutor
      / VertexAiCodeExecutor) over UnsafeLocalCodeExecutor. Run the agent under
      OS-level isolation if local execution is unavoidable.

  - id: ADK-107
    title: Agent grants AgentTool but has no before_tool_callback
    severity: high
    confidence: 0.7
    language: python
    applies_to:
      - adk_llm_agent
    scope: agent
    match:
      all:
        - agent_class: [LlmAgent]
        - agent_uses_hosted_tool_class: [AgentTool]
        - agent_kwarg_missing: [before_tool_callback]
    explanation: >
      This LlmAgent wraps another agent as a callable via AgentTool but has no
      before_tool_callback. AgentTool delegates to the wrapped agent, whose own
      tool calls are not mediated by this agent's callbacks (and ADK does not
      transitively analyze the wrapped agent). The parent's before_tool_callback
      is the only point that sees the delegation call itself; without it, the
      model can route work into the delegated agent with no policy gate on the
      handoff.
    fix: >
      Add a before_tool_callback that inspects AgentTool invocations and the
      arguments passed to the delegated agent. Ensure the wrapped agent carries
      its own guardrails, since the parent cannot see past the delegation
      boundary.

  - id: ADK-108
    title: LoopAgent has no max_iterations
    severity: medium
    confidence: 0.7
    language: python
    applies_to:
      - adk_loop_agent
    scope: agent
    match:
      all:
        - agent_class: [LoopAgent]
        - agent_kwarg_missing: [max_iterations]
    explanation: >
      This LoopAgent sets no max_iterations, so it loops until a sub-agent
      escalates. An agentic loop with no iteration cap, driven by model output,
      is a cost and availability footgun: a model that never escalates spins
      indefinitely, burning tokens and wall-clock with no termination guarantee.
    fix: >
      Pass max_iterations= to the LoopAgent constructor with a bound appropriate
      to the workflow. If the loop is meant to terminate via a sub-agent's
      escalate action, still set a defensive cap so a missed escalation cannot
      run unbounded.

  - id: ADK-110
    title: Agent fetches web content via UrlContextTool/LoadWebPage without before_tool_callback
    severity: medium
    confidence: 0.7
    language: python
    applies_to:
      - adk_llm_agent
    scope: agent
    match:
      all:
        - agent_class: [LlmAgent]
        - any:
            - agent_uses_hosted_tool_class: [UrlContextTool, LoadWebPage]
            - agent_grants_builtin_tool: [url_context, load_web_page]
        - agent_kwarg_missing: [before_tool_callback]
    explanation: >
      This LlmAgent is wired with a URL/page-fetch built-in — the idiomatic
      url_context instance or the load_web_page function reference, or a
      directly-constructed UrlContextTool — but has no before_tool_callback.
      These tools retrieve
      model-chosen URLs whose content re-enters the agent loop — a prompt
      injection vector (attacker-controlled page content) and an SSRF surface
      (the model can point the fetch at internal addresses). Without a callback
      gating the call there is nothing to validate the target before the fetch
      runs. This extends ADK-105's web-search coverage to the direct-fetch tools.
    fix: >
      Add a before_tool_callback that allow-lists permitted hosts/URLs and blocks
      internal address ranges before the fetch executes. Treat fetched content as
      untrusted and avoid passing it directly into further tool calls.

  - id: ADK-109
    title: TypeScript LlmAgent has no description
    severity: medium
    confidence: 0.85
    language: typescript
    applies_to:
      - adk_llm_agent
    scope: agent
    match:
      all:
        - agent_class: [LlmAgent]
        - agent_kwarg_missing: [description]
    explanation: >
      Google ADK routes delegation between agents using each LlmAgent's
      `description`. When a parent agent decides whether to hand off to a child in
      its `subAgents` tree, the model sees only the child's `description`. A
      TypeScript LlmAgent constructed with no `description` becomes effectively
      unreachable through delegation — it sits in the tree but the parent's model
      has no signal to select it. This usually surfaces as a silent routing bug
      where a sub-agent is never invoked.
    fix: >
      Pass a `description` in the `new LlmAgent({...})` options that names this
      agent's role and the kind of input it handles. One sentence is enough; treat
      it as documentation the parent agent's model reads to route.

  - id: ADK-111
    title: Agent wires an MCPToolset with no tool_filter
    severity: high
    confidence: 0.75
    language: python
    applies_to:
      - adk_llm_agent
    scope: agent
    match:
      all:
        - agent_class: [LlmAgent]
        - agent_uses_hosted_tool_class: [MCPToolset]
        - not:
            agent_hosted_tool_kwarg_present:
              class: MCPToolset
              kwarg: tool_filter
    explanation: >
      This LlmAgent wires an MCPToolset with no tool_filter=. Unlike an
      explicit tools=[FunctionTool(...), ...] list, MCPToolset connects
      the agent to every tool the remote MCP server currently exposes —
      a surface that is not enumerable from the agent's source, can grow
      or change behavior whenever the server is updated, and is entirely
      outside this codebase's control. tool_filter= is ADK's only
      mechanism for narrowing that catalog to a named allow-list; without
      it, the agent inherits the server's full, and potentially
      MCPToolset-server-controlled, tool set with no static boundary a
      code reviewer can check.
    fix: >
      Pass tool_filter=[...] to the MCPToolset constructor naming the
      specific tool names this agent is allowed to call, e.g.
      MCPToolset(connection_params=..., tool_filter=["read_file",
      "list_directory"]). Re-review the filter whenever the agent's task
      changes, and treat any server tool not in the list as excluded by
      default.

  - id: ADK-112
    title: Workflow agent has no description
    severity: medium
    confidence: 0.85
    language: python
    applies_to:
      - adk_sequential_agent
      - adk_parallel_agent
      - adk_loop_agent
    scope: agent
    match:
      all:
        - agent_class: [SequentialAgent, ParallelAgent, LoopAgent]
        - agent_kwarg_missing: [description]
    explanation: >
      Google ADK routes delegation using the description= field on each agent in
      a sub_agents tree, and a workflow agent is routed to exactly like an
      LlmAgent is: when the parent decides whether to hand off, the model sees
      only the child's description. A SequentialAgent, ParallelAgent, or
      LoopAgent with no description sits in the tree but gives the parent's model
      no signal to pick it, so it is effectively unreachable through delegation
      — a silent routing bug, not an error. It is easier to miss on a workflow
      agent than on an LlmAgent: a workflow agent has no instruction= and no
      model= of its own, so nothing else about its construction reads as
      model-facing text and the missing description does not look like an
      omission. What the agent orchestrates is also invisible from the outside —
      the parent cannot infer "runs these three steps in order" from the class
      name alone.
    fix: >
      Add a description= kwarg naming what the workflow accomplishes and the
      kind of input it expects, not its mechanics — the parent's model is
      choosing whether this branch is the right one, so "drafts, reviews, and
      revises a support reply" routes correctly where "sequential agent" does
      not. One sentence is usually enough. Treat it as documentation for the
      parent agent's model.

  - id: ADK-113
    title: Google ADK Runner run call has no wall-clock timeout
    severity: low
    confidence: 0.5
    language: python
    applies_to:
      - adk_llm_agent
      - adk_sequential_agent
      - adk_parallel_agent
      - adk_loop_agent
      - adk_langgraph_agent
    scope: agent
    match:
      agent_run_call_wall_clock_timeout_missing: true
    explanation: >
      No Runner.run / run_async call that executes this agent is wrapped in a
      wall-clock timeout (asyncio.wait_for, asyncio.timeout, or anyio
      move_on_after / fail_after) or passes an abort_signal. RunConfig.max_llm_calls
      caps how many model calls a run makes, but it does not bound how long ONE
      call can block: a stalled model request or a slow tool hangs the run
      indefinitely, holding the session, the worker, and the tool credentials the
      agent was granted while it waits. This is distinct from a call-count limit;
      a run can stay well under it and still never return. The check is structural
      — a timeout elsewhere in the file that does not enclose the call is not
      credited — and a timeout applied by the caller of the function that contains
      the call is not visible here.
    fix: >
      Run the agent with the async API and bound it: wrap the loop in async with
      asyncio.timeout(...): around async for event in runner.run_async(...), or pass
      abort_signal= (an asyncio.Event) that a timer sets, sized to the task. The
      synchronous Runner.run cannot be wrapped this way, so prefer run_async.
      Treat the resulting TimeoutError as a failed run rather than retrying
      blindly, and give the tools the agent calls their own timeouts so the outer
      deadline is a backstop rather than the only bound.
