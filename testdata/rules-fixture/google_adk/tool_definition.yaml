policy:
  id: google_adk_tool_definition
  name: ADK tool definition hygiene
  category: google_adk
  description: >
    Hygiene rules for Google ADK FunctionTool-wrapped user functions —
    the same surfaces that drive tool-call self-correction for the model.

rules:
  - id: ADK-001
    title: FunctionTool-wrapped function has no docstring
    severity: low
    confidence: 0.8
    language: python
    applies_to:
      - adk_function_tool
    scope: tool
    match:
      has_docstring: false
    explanation: >
      Google ADK FunctionTool wraps a user-written function and exposes it
      to the model. ADK uses the function's docstring as the tool
      description that the model sees when deciding whether to call it. A
      tool with no docstring is a tool the model cannot reason about — it
      will under-call it or call it with the wrong arguments. This is the
      single highest-leverage authoring fix for ADK tools.
    fix: >
      Add a one-paragraph docstring describing what the tool does, what
      inputs it expects, and what it returns. The model reads this string
      verbatim.

  - id: ADK-002
    title: FunctionTool-wrapped function has no type-annotated parameters
    severity: medium
    confidence: 0.85
    language: python
    applies_to:
      - adk_function_tool
    scope: tool
    match:
      all:
        - has_params: true
        - has_typed_params: false
    explanation: >
      Google ADK derives the JSON schema for a FunctionTool's parameters
      from the wrapped function's type annotations. A function with
      untyped parameters produces an underspecified schema — the model
      receives no type guidance and will pass arguments of the wrong
      type, which the SDK then rejects at validation time.
    fix: >
      Annotate every parameter with a concrete type (str, int, bool,
      list[str], Pydantic model, etc.). ADK propagates these into the
      schema the model sees.

  - id: ADK-007
    title: Ambiguous tool name
    severity: low
    confidence: 0.9
    language: python
    applies_to:
      - adk_function_tool
    scope: tool
    match:
      name_in:
        - process
        - handle
        - run
        - do
        - execute
        - perform
        - work
        - go
        - thing
        - stuff
    explanation: >
      Tool names like `process`, `handle`, or `run` give the model no signal
      about intent. The model will either call this tool for the wrong job or
      refuse to call it at all when a better-named alternative is present.
    fix: >
      Rename to a verb-object form, e.g. `summarize_document`, `fetch_order`.

  - id: ADK-009
    title: FunctionTool body prints to stdout
    severity: low
    confidence: 0.7
    language: python
    applies_to:
      - adk_function_tool
    scope: tool
    match:
      has_print_call: true
    explanation: >
      Google ADK FunctionTool runs inside the agent's process and shares its
      stdout with the runtime. A wrapped function that calls `print(...)` for
      debug tracing leaks raw arguments (paths, IDs, decoded blob contents)
      into the same stream the runner uses for structured logs, mangles JSON
      log lines, and can echo secrets pulled from `tool_context.state` into
      terminal scrollback or container log shippers. The output is also not
      addressable by the model — `print` writes go to the process, not to the
      tool response, so the operator sees noise while the agent sees nothing.
    fix: >
      Delete debug `print` calls before shipping, or replace them with a
      module logger (`logging.getLogger(__name__).debug(...)`) so the operator
      can silence them with a level switch. If the data is meant for the
      model, return it as part of the tool's structured result instead.

  - id: ADK-013
    title: TypeScript FunctionTool has no description
    severity: low
    confidence: 0.8
    language: typescript
    applies_to:
      - adk_function_tool
    scope: tool
    match:
      has_docstring: false
    explanation: >
      Google ADK for TypeScript exposes a FunctionTool to the model using the
      `description` field in its options object. The model reads that string
      verbatim to decide whether and how to call the tool. A FunctionTool
      constructed with no `description` (or an empty one) gives the model no
      signal about the tool's purpose, so it will under-call the tool or call it
      with wrong arguments. Unlike Python ADK, which derives the description from
      the function docstring, the TypeScript SDK takes it as an explicit option,
      so omitting it is a silent gap rather than a syntax error.
    fix: >
      Pass a one-sentence `description` in the `new FunctionTool({...})` options
      that names what the tool does, the inputs it expects, and what it returns.
      Write it for the model, not for a human reader.

  - id: ADK-115
    title: FunctionTool description is a placeholder
    severity: low
    confidence: 0.85
    language: python
    applies_to:
      - adk_function_tool
    scope: tool
    match:
      has_description_text:
        - todo
        - tbd
        - fixme
        - placeholder
        - no description
        - does stuff
    explanation: >
      The docstring passes the ADK-001 has-a-docstring check but carries a
      placeholder marker instead of real content. The ADK builds the tool
      declaration it sends to the model from this docstring, so a stub like
      "TODO: describe this tool" is functionally indistinguishable from no
      docstring at all and the model still has to guess from the function name.
      The ADK also parses the docstring for the per-parameter descriptions that
      accompany the generated schema, so a placeholder body strips the
      argument-level guidance at the same time as the tool-level guidance. In an
      agent tree the mis-selection does not stay local: a tool picked wrongly
      inside one branch produces output the following agents treat as
      established fact, so the error is laundered into the shared session state
      rather than surfacing where it began.
    fix: >
      Replace the placeholder with a real description covering what the tool
      does, what it returns, and when the model should call it rather than a
      neighboring tool, and document each parameter so the ADK can carry those
      descriptions into the generated declaration.

  - id: ADK-116
    title: FunctionTool description is too short to guide model selection
    severity: low
    confidence: 0.8
    language: python
    applies_to:
      - adk_function_tool
    scope: tool
    match:
      all:
        - has_docstring: true
        - description_length_lt: 40
    explanation: >
      A docstring under 40 characters is rarely enough to convey what a tool
      does, what it returns, and when to call it rather than a similarly named
      neighbor. The ADK passes it to the model as the tool's only selection
      signal, so a stub like "Gets data." leaves scope and preconditions to
      guesswork. A docstring this short also has no room for the per-parameter
      descriptions the ADK reads into the tool declaration, so the arguments
      reach the model undescribed as well. ADK-102 and ADK-107's
      before_tool_callback gate can block a call it recognizes as wrong, but it
      cannot supply the judgment the description was meant to provide, so a thin
      description is not something a callback compensates for.
    fix: >
      Expand the docstring to at least a full sentence covering inputs, outputs,
      and the situation in which this tool should be used over the alternatives,
      and document each parameter so those descriptions reach the model with the
      generated schema.
