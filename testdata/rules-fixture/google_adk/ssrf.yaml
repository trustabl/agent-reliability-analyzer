policy:
  id: google_adk_ssrf
  name: ADK tool server-side request forgery
  category: google_adk
  description: >
    Rules covering FunctionTool-wrapped functions that issue HTTP requests to
    a non-literal destination URL — an SSRF vector into the ADK host's
    network.

rules:
  - id: ADK-012
    title: Tool fetches a caller-controlled URL (SSRF)
    severity: high
    confidence: 0.6
    language: python
    applies_to:
      - adk_function_tool
    scope: tool
    match:
      all:
        - has_dynamic_url_call: true
        - not:
            has_body_text:
              - ".hostname not in"
              - ".netloc not in"
              - "ALLOWED_HOSTS"
              - "ALLOWED_DOMAINS"
              - "allowed_hosts"
              - "allowed_domains"
              - "HOST_ALLOWLIST"
              - "host_allowlist"
    explanation: >
      This ADK tool issues an HTTP request to a URL built from a parameter or
      an interpolated string rather than a fixed literal. The model chooses the
      arguments passed to the tool, so an adversarial conversation can steer
      the request at any host the ADK runtime can reach. On Cloud Run or Vertex
      AI that includes the GCP metadata server (metadata.google.internal /
      169.254.169.254), which vends service-account tokens — a direct path from
      prompt injection to cloud credential theft — as well as internal VPC
      services not exposed publicly.
    fix: >
      Constrain the destination to an explicit host allow-list, or fix the base
      URL and accept only the path/query. After DNS resolution, reject private,
      loopback, and link-local ranges, and on GCP block 169.254.169.254 /
      metadata.google.internal explicitly. Disable redirects to addresses
      outside the allow-list. Credit is given when the body checks the parsed hostname against a named allow-list; also require https:// and cap or disable redirects (follow_redirects=False / allow_redirects=False).

  - id: ADK-016
    title: TypeScript FunctionTool fetches a caller-controlled URL (SSRF)
    severity: high
    confidence: 0.6
    language: typescript
    applies_to:
      - adk_function_tool
    scope: tool
    match:
      all:
        - has_dynamic_url_call: true
        - not:
            any:
              - all:
                  - has_body_text:
                      - ".hostname"
                      - ".host"
                  - has_body_text:
                      - ".includes("
                      - ".has("
              - has_body_text:
                  - "allowedHosts"
                  - "allowedDomains"
                  - "ALLOWED_HOSTS"
                  - "ALLOWED_DOMAINS"
                  - "hostAllowlist"
    explanation: >
      This TypeScript FunctionTool issues an HTTP request (`fetch`, `axios`,
      `got`, or `undici`) to a URL built from a tool parameter or an interpolated
      string rather than a fixed literal. The model chooses the arguments the tool
      receives, so an adversarial conversation can steer the request at any host
      the ADK runtime can reach. On Cloud Run or Vertex AI that includes the GCP
      metadata server (metadata.google.internal / 169.254.169.254), which vends
      service-account tokens (a direct path from prompt injection to cloud
      credential theft), as well as internal VPC services not exposed publicly.
    fix: >
      Constrain the destination to an explicit host allow-list, or fix the base
      URL and accept only a path/query segment from the model. After resolving
      DNS, reject private, loopback, and link-local ranges, and on GCP block
      169.254.169.254 / metadata.google.internal explicitly. Disable redirects to
      hosts outside the allow-list. Credit is given when the body checks new URL(x).hostname/host against an allow-list; also require https: and use redirect: "manual" or cap redirects.

  - id: ADK-022
    title: ADK tool fetches an allow-listed host without pinning https://
    severity: medium
    confidence: 0.6
    language: python
    applies_to:
      - adk_function_tool
    scope: tool
    match:
      all:
        - has_unpinned_scheme_url_call: true
        - has_body_text:
            - ".hostname not in"
            - ".netloc not in"
            - "ALLOWED_HOSTS"
            - "ALLOWED_DOMAINS"
            - "allowed_hosts"
            - "allowed_domains"
            - "HOST_ALLOWLIST"
            - "host_allowlist"
        - not:
            has_body_text:
              - ".scheme =="
              - ".scheme !="
              - ".scheme in"
              - ".scheme not in"
              - 'startswith("https://")'
              - "startswith('https://')"
    explanation: >
      This ADK tool checks the destination host against an allow-list (so
      ADK-012 stays silent) but builds its outbound request URL without a literal
      https:// prefix and without checking the URL scheme. The allow-list
      bounds where the request can go, not how: a model-supplied or
      configured value such as http://allowed.example.com is accepted, so
      credentials in headers and the request body cross the network in
      cleartext, and anyone on the network path can read or rewrite the
      response. The rewritten response re-enters the model's context as
      trusted tool output, a second-order prompt-injection channel. This rule
      fires only after ADK-012's allow-list credit applies, so the two never
      fire on the same tool.
    fix: >
      Pin the scheme: build the URL from a literal "https://" prefix, or
      reject any URL whose urlparse(url).scheme is not "https" before the
      request. Also cap or disable redirects (follow_redirects=False /
      allow_redirects=False) so a redirect cannot downgrade to http://.

  - id: ADK-023
    title: TypeScript ADK tool fetches an allow-listed host without pinning https://
    severity: medium
    confidence: 0.6
    language: typescript
    applies_to:
      - adk_function_tool
    scope: tool
    match:
      all:
        - has_unpinned_scheme_url_call: true
        - any:
            - all:
                - has_body_text:
                    - ".hostname"
                    - ".host"
                - has_body_text:
                    - ".includes("
                    - ".has("
            - has_body_text:
                - "allowedHosts"
                - "allowedDomains"
                - "ALLOWED_HOSTS"
                - "ALLOWED_DOMAINS"
                - "hostAllowlist"
        - not:
            has_body_text:
              - ".protocol ==="
              - ".protocol !=="
              - ".protocol =="
              - ".protocol !="
              - 'startsWith("https://")'
              - "startsWith('https://')"
              - 'startsWith("https:")'
    explanation: >
      This TypeScript ADK tool checks the destination host against an
      allow-list (so ADK-016 stays silent) but passes fetch/axios/got a URL
      that does not begin with a literal https:// prefix and checks no
      URL protocol. The allow-list bounds where the request can go, not how:
      an http:// URL for an allowed host is accepted, so credentials and
      request bodies cross the network in cleartext and anyone on the path
      can read or rewrite the response, which then re-enters the model's
      context as trusted tool output. This rule fires only after ADK-016's
      allow-list credit applies, so the two never fire on the same tool.
    fix: >
      Pin the scheme: build the URL from a literal `https://` prefix, or
      reject any URL whose `new URL(x).protocol` is not "https:" before
      fetching. Use redirect: "manual" or cap redirects so a redirect cannot
      downgrade to http://.
