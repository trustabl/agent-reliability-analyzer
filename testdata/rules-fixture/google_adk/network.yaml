policy:
  id: google_adk_network
  name: ADK tool network hygiene
  category: google_adk
  description: >
    Network-call hygiene inside FunctionTool-wrapped functions.

rules:
  - id: ADK-003
    title: Network call has no timeout
    severity: high
    confidence: 0.85
    language: python
    applies_to:
      - adk_function_tool
    scope: tool
    match:
      call_without_kwarg:
        callees:
          - requests.get
          - requests.post
          - requests.put
          - requests.delete
          - requests.patch
          - requests.head
          - requests.request
          - httpx.get
          - httpx.post
          - httpx.put
          - httpx.delete
          - httpx.patch
          - httpx.head
          - httpx.request
          - requests.Session.get
          - requests.Session.post
          - urllib.request.urlopen
          # Bare `urlopen` covers the from-import form.
          - urlopen
          # Aliased aiohttp sessions canonicalize to aiohttp.ClientSession.<m>.
          - aiohttp.ClientSession.get
          - aiohttp.ClientSession.post
        missing: timeout
    explanation: >
      An ADK tool that makes a network request without a timeout will
      hang indefinitely on a slow or unresponsive remote. ADK has no
      tool-level timeout — the entire agent loop blocks until the
      request returns. Under load, this exhausts whatever runtime ADK is
      hosted on (Cloud Run, Vertex AI, a local process) without ever
      surfacing the failure to the model.
    fix: >
      Pass `timeout=` (typically 5–30 seconds) to the request. Choose a
      value that's tight enough to fail fast and loose enough to allow
      legitimate slow responses for this endpoint.

  - id: ADK-114
    title: TypeScript FunctionTool HTTP call has no timeout
    severity: high
    confidence: 0.6
    language: typescript
    applies_to:
      - adk_function_tool
    scope: tool
    match:
      has_http_call_without_timeout: true
    explanation: >
      This TypeScript ADK FunctionTool makes an outbound HTTP call (fetch /
      axios / got / undici) with no deadline — no signal, timeout, or
      abortSignal option. Node's fetch has no implicit deadline, so a slow or
      unresponsive host blocks the tool callback until the socket eventually
      dies. What that costs depends on where the tool sits in the agent tree,
      and the composition ADK encourages makes it worse rather than better: a
      stalled tool inside a SequentialAgent blocks every step after it, and
      inside a ParallelAgent the whole fan-out waits on its slowest branch, so
      one unresponsive host stalls work that has nothing to do with it.
      ADK-108's max_iterations bounds how many times a LoopAgent goes round, not
      how long one tool call may run, so no configured limit breaks the stall.
      The exposure compounds with ADK-016: a tool that fetches a
      caller-controlled URL and cannot time out can be steered at an internal
      host that never answers.
    fix: >
      Attach a deadline. On modern runtimes,
      await fetch(url, { signal: AbortSignal.timeout(15_000) }); on older ones,
      create an AbortController, abort it from a setTimeout, pass
      controller.signal, and clear the timer in a finally. axios and got take a
      timeout option directly. Return the abort as a structured tool result so
      the agent can react to an unreachable upstream rather than the branch
      hanging.
