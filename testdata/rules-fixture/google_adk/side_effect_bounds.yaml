policy:
  id: google_adk_side_effect_bounds
  name: Google ADK unbounded side-effect parameters
  category: google_adk
  description: >
    Rules that flag a side-effecting Google ADK tool
    (send/notify/refund/charge/...) whose recipient or amount parameter is
    free-form model input with no visible bound — no allow-list constraining who
    a message can go to, no cap or enum constraining how much money moves. This
    is a different failure mode from ADK-006 (idempotency): a duplicate call
    repeats an action within a bound the caller already accepted, while an
    unbounded recipient or amount lets a single call move further than the
    caller intended.

rules:
  - id: ADK-020
    title: Side-effecting tool lets the model choose the recipient or amount with no visible bound
    severity: high
    confidence: 0.5
    language: python
    applies_to:
      - adk_function_tool
    scope: tool
    match:
      all:
        - any:
            - all:
                - name_has_prefix:
                    - send_
                    - notify_
                - param_name_matches:
                    contains:
                      - recipient
                    exact:
                      - to
                      - cc
                      - bcc
                      - email
                      - email_address
                      - phone
                      - phone_number
                      - to_email
                      - to_address
                      - to_number
            - all:
                - name_has_prefix:
                    - refund_
                    - charge_
                    - pay_
                    - payout_
                    - transfer_
                    - issue_
                - param_name_matches:
                    contains:
                      - amount
                    exact:
                      - total
                      - price
                    suffixes:
                      - cents
        - not:
            has_body_text:
              - "(le="
              - " le="
              - "(lt="
              - " lt="
              - "conint("
              - "condecimal("
              - "confloat("
              - "Literal["
              - "MAX_"
              - "_MAX"
              - "_LIMIT"
              - "_limit"
              - "ALLOWED"
              - "allowed_"
              - "ALLOWLIST"
              - "allow_list"
              - "WHITELIST"
              - "whitelist"
              - "endswith(\"@"
              - "endswith('@"
              - "request_confirmation("
        - any:
            - not:
                tool_decorator_kwarg_present:
                  - require_confirmation
            - tool_decorator_kwarg_value:
                kwarg: require_confirmation
                value: "False"
    explanation: >
      This Google ADK FunctionTool wraps a function whose name signals a
      send/notify or a refund/charge/pay side effect, and it takes a free-form
      recipient or amount parameter with no visible bound: no allow-list
      constraining who the message reaches, no cap, range, or enum constraining
      how much money moves, and no confirmation gate. A model steered by prompt
      injection, a misread task, or another tool's poisoned output can pass any
      address or any amount to this call. This is a distinct failure from ADK-006
      (idempotency): a duplicate call repeats an action inside a bound the caller
      already accepted; this rule is about a single call moving further — a wider
      blast radius, not a repeated one. Passing require_confirmation=True (or a
      confirmation callable) to FunctionTool, or calling
      tool_context.request_confirmation(...) inside the function, is a gate and
      silences this rule. Only FunctionTool(fn) wrappers of a same-file function
      are discovered; bare functions listed in tools=[...] are not.
    fix: >
      Do not let the model supply the recipient or the amount unconstrained.
      Derive the recipient from trusted context (a value bound to the session or
      the authenticated user) rather than a model parameter, or constrain it to an
      allow-list / domain allow-list validated before the call executes. Cap the
      amount with a range check or a typed constraint AND enforce the same cap
      server-side, since a static bound can be bypassed by a differently-shaped
      call. For anything above a low, pre-approved threshold, wrap the function
      with FunctionTool(fn, require_confirmation=True), or a callable that decides
      per call from the arguments, so a human confirms the specific recipient or
      amount before the side effect runs.

  - id: ADK-021
    title: TypeScript side-effecting tool lets the model choose the recipient or amount with no visible bound
    severity: high
    confidence: 0.5
    language: typescript
    applies_to:
      - adk_function_tool
    scope: tool
    match:
      all:
        - any:
            - all:
                - name_has_prefix:
                    - send
                    - notify
                - param_name_matches:
                    contains:
                      - recipient
                    exact:
                      - to
                      - cc
                      - bcc
                      - email
                      - emailAddress
                      - toEmail
                      - toAddress
                      - phone
                      - phoneNumber
                      - toNumber
            - all:
                - name_has_prefix:
                    - refund
                    - charge
                    - payout
                    - transfer
                    - issue
                - param_name_matches:
                    contains:
                      - amount
                    exact:
                      - total
                      - price
                    suffixes:
                      - cents
        - not:
            has_body_text:
              - ".max("
              - ".lte("
              - ".lt("
              - "maximum"
              - "z.enum("
              - "nativeEnum("
              - "\"enum\""
              - "enum:"
              - "MAX_"
              - "_MAX"
              - "maxAmount"
              - "_LIMIT"
              - "Limit"
              - "ALLOWED"
              - "allowedDomains"
              - "AllowList"
              - "allowList"
              - "WHITELIST"
              - "whitelist"
              - "endsWith(\"@"
              - "endsWith('@"
              - "requestConfirmation("
              - "request_confirmation("
    explanation: >
      This Google ADK FunctionTool authored in TypeScript has a name that signals
      a send/notify or a refund/charge/pay side effect, and it takes a free-form
      recipient or amount parameter with no visible bound: no allow-list
      constraining who the message reaches, no cap, max, or enum constraining how
      much money moves, and no confirmation request in the handler. A model
      steered by prompt injection, a misread task, or another tool's poisoned
      output can pass any address or any amount to this call. This is a distinct
      failure from ADK-006 (idempotency): a duplicate call repeats an action
      inside a bound the caller already accepted; this rule is about a single call
      moving further — a wider blast radius, not a repeated one. ADK for
      TypeScript has no declarative confirmation option on FunctionTool (Python's
      require_confirmation has no counterpart there): confirmation is implemented
      by hand inside execute through the ToolContext, so this rule treats a call
      to requestConfirmation( in the tool's source as the gate.
    fix: >
      Do not let the model supply the recipient or the amount unconstrained.
      Derive the recipient from trusted context rather than a model parameter, or
      constrain it with a zod allow-list / domain check validated before the call
      executes. Cap the amount with a zod bound (z.number().max(...)) or an enum
      AND enforce the same cap server-side, since a static bound in the schema can
      be bypassed by a differently-shaped call. For anything above a low,
      pre-approved threshold, request confirmation from inside execute through the
      ToolContext so a human approves the specific recipient or amount before the
      side effect runs.
