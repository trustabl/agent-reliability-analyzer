policy:
  id: claude_sdk_tool_call_claims
  name: Claude Agent SDK tool-call claims (EBTE)
  category: claude_sdk
  description: >
    Rules that flag a Claude Agent SDK tool whose calls are not bound to a typed
    action claim checked outside the model, after Explanation-Bound Tool
    Execution (EBTE, arXiv 2607.25364). The claim is a reserved `claim` key in the tool's input schema
    (a ToolInvocationExplanation: intent class, selected tool, expected effect,
    risk tier, uncertainty, untrusted-context dependencies, evidence digests)
    that a mediation step compares with server-held facts before the call has
    any effect. The three rules form a ladder over the tool's claim_use fact: no
    claim on a side-effecting tool, a claim nothing reads, and a claim that is
    only written out or returned. A checked claim, a tool with an extra
    decorator that may mediate, or a repo with a PreToolUse hook or a
    can_use_tool callback that runs for the tool is silent.

rules:
  - id: CSDK-026
    title: Side-effecting tool takes no structured claim for its calls
    severity: info
    confidence: 0.5
    language: python
    applies_to:
      - claude_sdk_tool
    scope: tool
    match:
      all:
        - tool_claim_use: [absent]
        - any:
            - has_shell_call: true
            - has_code_exec_call: true
            - has_write_call: true
            - name_has_prefix:
                - send
                - notify
                - email
                - post_
                - publish
                - delete
                - remove
                - drop
                - purge
                - refund
                - charge
                - payout
                - pay_
                - transfer
                - deploy
                - execute
                - write
                - update
                - create
                - insert
                - upsert
    explanation: >
      This Claude Agent SDK `@tool` handler has a side effect — it shells out, executes code,
      writes a file, or its name says it sends, deletes, pays, deploys, creates
      or updates — and its input schema has no `claim` key, so nothing about why the
      model chose this call or what it expects the call to do reaches the code
      that runs it. The model's own reasoning is free text: it can be wrong,
      written after the fact, or steered by a poisoned tool result or document,
      and nothing can compare it with the task, the policy or the arguments
      before the effect happens. This is a defense-in-depth gap, not a bug on
      its own: the tool's existing controls still apply, and a claim never
      grants authority. The rule reads the input schema passed to `@tool`
      (a dict, the JSON-schema form, or a same-file TypedDict or dict); a schema
      imported from another module is not resolved, and a claim carried some
      other way (a separate intent tool, a context object), both still fire.
    fix: >
      Add a reserved `claim` key to the tool's input schema, typed as a ToolInvocationExplanation
      (schema_version, intent_class, selected_tool, expected_effect, risk_tier,
      uncertainty, untrusted_context, evidence_refs; an optional summary that no
      check reads) and check it in a mediation step before the effect: a `PreToolUse` hook on `ClaudeAgentOptions(hooks={"PreToolUse": [HookMatcher(matcher="mcp__<server>__<tool>", hooks=[check])]})` (it receives the call's `tool_input` and blocks it with `permissionDecision: "deny"`), or one shared decorator stacked under `@tool`.
      The step denies a missing or mismatched claim, sends an unresolved fact or
      a high-risk tool to review, and combines with the existing controls so the
      most restrictive outcome wins. Map a review outcome to `permissionDecision: "ask"` so a person confirms the specific call. A `can_use_tool` callback does not run for tools listed in `allowed_tools` or under `bypassPermissions`, so it is not a reliable place for this check.

  - id: CSDK-027
    title: Tool declares a claim argument that nothing checks
    severity: medium
    confidence: 0.6
    language: python
    applies_to:
      - claude_sdk_tool
    scope: tool
    match:
      tool_claim_use: [unused]
    explanation: >
      This Claude Agent SDK `@tool` handler's input schema has a `claim` key, so the model fills in a typed
      claim about the call, but the handler never reads `args["claim"]` or
      the whole `args` dict, the tool has no decorator besides the one that
      registers it, and the repo registers no PreToolUse hook (and no
      can_use_tool callback that runs for it), so no mediation step visible here
      can check it.
      A claim nobody checks is worse than none: reviewers and auditors see a
      claim-carrying tool and assume the call was verified against the task and
      the policy, while a prompt-injected or mistaken call runs exactly as it
      would have without one. The rule cannot see a mediation step that lives in
      a dispatch layer outside the tool (custom runner code, server middleware),
      so that shape also fires.
    fix: >
      Check the claim before the effect: a `PreToolUse` hook on `ClaudeAgentOptions(hooks={"PreToolUse": [HookMatcher(matcher="mcp__<server>__<tool>", hooks=[check])]})` (it receives the call's `tool_input` and blocks it with `permissionDecision: "deny"`), or one shared decorator stacked under `@tool`. Validate it, resolve the
      facts server-side (tool registry, the task's authorized intent, policy,
      route), and compare. Deny a conflict, review anything unresolved, and run
      the tool only on allow. Map a review outcome to `permissionDecision: "ask"` so a person confirms the specific call. A `can_use_tool` callback does not run for tools listed in `allowed_tools` or under `bypassPermissions`, so it is not a reliable place for this check. If the claim is checked in a dispatch
      layer this rule cannot see, move the check into one of those places so the
      binding is visible in the code.

  - id: CSDK-028
    title: Tool's claim argument is only written out or returned, never checked
    severity: medium
    confidence: 0.55
    language: python
    applies_to:
      - claude_sdk_tool
    scope: tool
    match:
      tool_claim_use: [passthrough]
    explanation: >
      This Claude Agent SDK `@tool` handler reads its `claim` input, but every read only writes
      it out — to print, a logger, json.dumps, str or repr — or puts it in the
      return value. Nothing compares the claim with the arguments, the task or
      the policy before the side effect runs, so a claim that contradicts what
      the call actually does is recorded rather than stopped. An audit trail of
      unchecked claims is evidence of what the model said, not of what was
      allowed. The rule follows each read to the first call it is an argument of
      within the handler; passing the whole `args` dict to a helper, or
      copying the claim into a local (`c = args["claim"]`), is counted as
      checked and stays silent.
    fix: >
      Pass the claim to a verifier before the effect and act on its outcome:
      deny on a conflict between the claim and the arguments, task or policy,
      review on anything unresolved or high risk, and run the tool only on
      allow. Keep writing the outcome and the per-check results to the audit
      trail, but not the raw claim summary or untrusted content. Do it in a
      mediation step: a `PreToolUse` hook on `ClaudeAgentOptions(hooks={"PreToolUse": [HookMatcher(matcher="mcp__<server>__<tool>", hooks=[check])]})` (it receives the call's `tool_input` and blocks it with `permissionDecision: "deny"`), or one shared decorator stacked under `@tool`. Map a review outcome to `permissionDecision: "ask"` so a person confirms the specific call. A `can_use_tool` callback does not run for tools listed in `allowed_tools` or under `bypassPermissions`, so it is not a reliable place for this check.
