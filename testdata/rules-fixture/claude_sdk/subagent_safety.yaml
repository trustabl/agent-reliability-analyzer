policy:
  id: claude_sdk_subagent_safety
  name: Subagent safety
  category: claude_sdk
  description: >
    Rules covering .claude/agents/*.md subagent declarations.

rules:
  - id: CSDK-110
    title: Subagent granted the built-in Bash tool
    severity: high
    confidence: 0.9
    applies_to:
      - claude_subagent
    scope: subagent
    match:
      subagent_grants_tool:
        - Bash
    explanation: >
      This subagent's frontmatter grants the built-in `Bash` tool, letting it
      run arbitrary shell commands. A narrowly-scoped subagent (e.g. a search
      or read specialist) rarely needs shell access; granting it widens the
      blast radius if the subagent is compromised or misdirected.
    fix: >
      Remove `Bash` from the subagent's `tools:` list unless shell access is
      essential. Prefer specific tools (Read, Grep, Glob) for read-only roles.

  - id: CSDK-111
    title: Subagent granted filesystem-write or web-fetch built-ins
    severity: high
    confidence: 0.85
    applies_to:
      - claude_subagent
    scope: subagent
    match:
      subagent_grants_tool:
        - Write
        - Edit
        - MultiEdit
        - NotebookEdit
        - WebFetch
    explanation: >
      This subagent's frontmatter grants a filesystem-write
      (`Write`/`Edit`/`MultiEdit`/`NotebookEdit`) or web-fetch (`WebFetch`)
      built-in. Like Bash (CSDK-110), these widen the blast radius of an
      autonomously-dispatched subagent: write tools let it modify source,
      config, or the `.claude/` settings that govern it, and WebFetch pulls
      attacker-controllable URL content back into the loop (a prompt-injection
      and SSRF surface). A narrowly-scoped subagent rarely needs them.
    fix: >
      Remove the write and fetch built-ins from the subagent's `tools:` list
      unless the role genuinely requires them. For read/research roles prefer
      Read, Grep, Glob; for fetching, gate with a PreToolUse hook that
      allowlists hosts.

  - id: CSDK-112
    title: Subagent granted the WebSearch tool
    severity: medium
    confidence: 0.8
    applies_to:
      - claude_subagent
    scope: subagent
    match:
      subagent_grants_tool:
        - WebSearch
    explanation: >
      This subagent's frontmatter grants the built-in `WebSearch` tool, so
      search-result content chosen by the model flows back into the subagent's
      context. Search results are attacker-reachable text (anyone can publish a
      page that ranks for a query the subagent is likely to make), which makes
      the grant a prompt-injection channel into an autonomously-dispatched
      worker — the same surface the agent-scope check flags on
      AgentDefinition (CSDK-102), here declared in `.claude/agents/*.md`.
    fix: >
      Remove `WebSearch` from the subagent's `tools:` list unless the role is
      genuinely research-oriented. If the subagent must search, keep its other
      grants read-only so injected search content cannot escalate into writes
      or shell, and treat its output as untrusted in the parent loop.

  - id: CSDK-115
    title: Subagent omits tools and inherits the full subagent tool pool
    severity: high
    confidence: 0.75
    applies_to:
      - claude_subagent
    scope: subagent
    match:
      subagent_inherits_all_tools: true
    explanation: >
      This subagent file sits in a `.claude/agents/` directory and its
      frontmatter has no `tools:` key and no `disallowedTools:` entries. Claude
      Code documents that a subagent with `tools` omitted inherits all tools
      available to subagents: the built-in tools and MCP tools of the main
      conversation, less a short list Claude Code removes from all subagents.
      The subagent therefore gets whichever of Bash, file-write, web-fetch and
      MCP tools the main conversation has, whatever its description says its
      job is. Claude Code documents that Claude decides when to delegate to a
      subagent and composes the delegation message the subagent works from, so
      instructions that steer the main conversation can reach this subagent
      and the tools it holds.
      Limits of this check: the rule reads the frontmatter alone and cannot see
      which tools the main conversation has, so it cannot tell how wide the
      inherited pool is. A `tools:` key with an empty or null value counts as
      declared and stays silent. Any `disallowedTools:` entry silences the
      rule, whatever it removes. Markdown files found outside `.claude/agents/`
      (plugin `agents/` directories, flat collections) are not checked.
      In-code `AgentDefinition` subagents are covered by CSDK-103 and CSDK-120
      when they also set bypassPermissions, and are not checked here.
    fix: >
      Add a `tools:` list naming the tools the role needs, for example
      `tools: Read, Grep, Glob` for a review or search role. If the subagent
      needs most of the pool, keep `tools` omitted and add a `disallowedTools:`
      list for the tools it must not reach, such as `Bash`, `Write`, `Edit` or
      `mcp__*`.
