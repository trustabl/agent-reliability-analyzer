policy:
  id: mcp_secret_and_memory_flows
  name: MCP tools that return a credential or store one in memory
  category: mcp
  description: >
    Rules for an MCP tool that returns the value of a credential-named environment variable
    to the model, or writes a credential-named parameter into a memory store. The flow comes
    from the one-function taint pass; no call into another function is followed.

rules:
  - id: MCP-221
    title: Python MCP tool returns a secret-named environment value
    severity: medium
    confidence: 0.4
    language: python
    applies_to:
      - mcp_tool
    scope: tool
    match:
      tool_flow_reaches_sink:
        sources: [secret_env]
        sinks: [return_value]
    explanation: >
      This tool reads an environment variable whose name reads as a credential (a name with
      a KEY, TOKEN, SECRET, PASSWORD or similar word, such as `API_KEY` or `GITHUB_TOKEN`)
      and returns it, or text built from it, in a return statement. The client places a tool
      result in the model's context. A secret in the context is exposed to anything that
      can steer the model: the arXiv study "Caught in the Act(ivation)" (arXiv:2606.04141)
      describes agents that keep credentials in the same context window as untrusted
      retrieved content, which gives indirect prompt injection a direct path to
      credential exfiltration, and the arXiv study of skills (arXiv:2604.03070) finds that
      agent frameworks feed script output into the model's context, so a printed
      credential is exposed to the model. The pack cites them for that exposure and for
      nothing more; neither paper studies MCP tool return values. The finding sits on the
      return statement.
      Limits of this check: just the tool's own function is read. A value passed to a
      helper that returns it is not found, and a secret read in another function and
      returned by this one is not found. The variable name must be a string literal in
      `os.environ[...]`, `os.environ.get(...)` or `os.getenv(...)`; a name held in a
      variable is not read. A slice such as `key[:4]` ends the flow, so a masked value is
      not flagged, and a call to a masking function ends it too. A tool that returns
      whether the variable is set, as in `bool(os.environ.get("API_KEY"))`, is not flagged.
      Names ending in a path, URL, host or identifier word, such as `API_KEY_FILE`, are
      not read as credentials.
    fix: >
      Do not return the credential. Use it inside the tool to call the service and return
      the result of the call. If the tool must confirm configuration, return whether the
      variable is set, or the last four characters, and not the value.

  - id: MCP-222
    title: TypeScript MCP tool returns a secret-named environment value
    severity: medium
    confidence: 0.4
    language: typescript
    applies_to:
      - mcp_tool
    scope: tool
    match:
      tool_flow_reaches_sink:
        sources: [secret_env]
        sinks: [return_value]
    explanation: >
      This tool reads `process.env.NAME` or `process.env["NAME"]` for a name that reads as
      a credential (a name with a KEY, TOKEN, SECRET, PASSWORD or similar word) and returns
      it, or text built from it, from the handler. The client places a tool result in the
      model's context. A secret in the context is exposed to anything that can steer the
      model: the arXiv study "Caught in the Act(ivation)" (arXiv:2606.04141) describes
      agents that keep credentials in the same context window as untrusted retrieved
      content, which gives indirect prompt injection a direct path to credential
      exfiltration. The pack cites it for that exposure and for nothing more; the study does
      not concern MCP tool return values. The finding sits on the return statement, or on the
      body of an arrow function that returns an expression.
      Limits of this check: just the handler body is read. A value passed to another
      function that returns it is not found, and a secret read at module level into a
      constant is not tracked into the handler. The variable name must be a property name
      or a string literal after `process.env`. A `.slice`, `.substring` or `.substr` call
      ends the flow, so a masked value is not flagged. A comparison or a `Boolean()` call
      over the value is not flagged. Names ending in a path, URL, host or identifier word
      are not read as credentials.
    fix: >
      Do not return the credential. Use it inside the handler to call the service and
      return the result of the call. To confirm configuration, return whether the variable is
      set, or its last four characters, and not the value.

  - id: MCP-223
    title: Python MCP tool writes a credential-named parameter into a memory store
    severity: medium
    confidence: 0.3
    language: python
    applies_to:
      - mcp_tool
    scope: tool
    match:
      tool_flow_reaches_sink:
        sources: [param]
        sinks: [memory_write]
        param_regex: "(?i)(^|_)(password|passwd|pwd|secret|token|api_?key|credentials?|cookie|bearer|passphrase)($|_)"
    explanation: >
      A parameter of this tool whose name reads as a credential (`password`, `token`,
      `api_key`, `credential`, `cookie` and the like) reaches the value written by a store
      `put` or a memory client's `add` or `save_context` inside the same function. The
      arXiv study "Whose Credential Is It?" (arXiv:2610.25707) finds that a long-term
      memory shared across users retrieves another user's credentials for the agent that
      serves a different user, that agents in a stress test then used the foreign
      credential and changed the other user's account, and that recording the owner with
      each credential line prevents most of the misuse. The pack cites the study for the
      exposure of credentials held in agent memory and for nothing more. The finding sits
      on the write call and the explanation names the parameter.
      Limits of this check: the rule does not know whether the namespace or the stored
      text names the owner, which is the control the study tests, so a per-user store that
      records the owner is flagged too. The memory client is recognized when it is bound in
      the same file to `Memory(...)`, `MemoryClient(...)` or a variant, or when the receiver
      name contains `store`, `mem0` or `memory`. A write made in a helper is not found.
      Credentials passed as the value of an untagged field name are not read.
    fix: >
      Keep credentials in a secret manager and give the tool a reference, not the value.
      If a credential must be remembered, scope the store to the user and record the owner
      with each entry, expire it, and check the owner when it is read back.
