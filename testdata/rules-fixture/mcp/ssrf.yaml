policy:
  id: mcp_ssrf
  name: MCP server-side request forgery
  category: mcp
  description: >
    Rules covering outbound HTTP requests from an MCP tool handler whose
    destination URL is not a fixed literal. A tool that fetches a
    caller-controlled URL can be steered at internal services the server host
    can reach.

rules:
  - id: MCP-008
    title: Tool fetches a caller-controlled URL (SSRF)
    severity: high
    confidence: 0.6
    language: python
    applies_to:
      - mcp_tool
    scope: tool
    match:
      all:
        - has_dynamic_url_call: true
        - not:
            has_body_text:
              - ".hostname not in"
              - ".netloc not in"
              - "ALLOWED_HOSTS"
              - "ALLOWED_DOMAINS"
              - "allowed_hosts"
              - "allowed_domains"
              - "HOST_ALLOWLIST"
              - "host_allowlist"
    explanation: >
      This MCP tool issues an HTTP request to a URL built from a parameter or an
      interpolated string rather than a fixed literal. Because MCP tool
      arguments come from a connecting client (and a model choosing values from
      conversation context), an attacker who can shape that context can drive
      the request at an arbitrary host — including internal addresses the server
      host can reach but the public internet cannot: cloud metadata endpoints
      (169.254.169.254) that vend credentials, loopback admin APIs, and internal
      services. This is server-side request forgery; the server becomes a proxy
      for requests the attacker could not otherwise make.
    fix: >
      Constrain the destination to an explicit allow-list of hosts (or a single
      fixed base URL with only a path parameter), reject requests to private,
      loopback, and link-local IP ranges after DNS resolution, and disable
      redirects to addresses outside the allow-list. Credit is given when the body checks the parsed hostname against a named allow-list; also require https:// and cap or disable redirects (follow_redirects=False / allow_redirects=False).

  - id: MCP-013
    title: TypeScript MCP tool fetches a caller-controlled URL (SSRF)
    severity: high
    confidence: 0.6
    language: typescript
    applies_to:
      - mcp_tool
    scope: tool
    match:
      all:
        - has_dynamic_url_call: true
        - not:
            any:
              - all:
                  - has_body_text:
                      - ".hostname"
                      - ".host"
                  - has_body_text:
                      - ".includes("
                      - ".has("
              - has_body_text:
                  - "allowedHosts"
                  - "allowedDomains"
                  - "ALLOWED_HOSTS"
                  - "ALLOWED_DOMAINS"
                  - "hostAllowlist"
    explanation: >
      This MCP tool handler, authored in TypeScript, issues an HTTP request to a
      URL built from a tool argument or an interpolated string rather than a
      fixed literal. Because a connecting model chooses tool arguments, a
      prompt-injected conversation can drive the request at internal services the
      server host can reach — cloud metadata endpoints (169.254.169.254),
      loopback admin APIs, and other targets the public internet cannot. This is
      server-side request forgery.
    fix: >
      Validate the destination before fetching: resolve the host and reject
      private, loopback, and link-local ranges; prefer an allowlist of exact
      hosts, or resolve an opaque ID against a server-side registry and build the
      URL from the trusted entry. Credit is given when the body checks new URL(x).hostname/host against an allow-list; also require https: and use redirect: "manual" or cap redirects.

  - id: MCP-031
    title: MCP tool fetches an allow-listed host without pinning https://
    severity: medium
    confidence: 0.6
    language: python
    applies_to:
      - mcp_tool
    scope: tool
    match:
      all:
        - has_unpinned_scheme_url_call: true
        - has_body_text:
            - ".hostname not in"
            - ".netloc not in"
            - "ALLOWED_HOSTS"
            - "ALLOWED_DOMAINS"
            - "allowed_hosts"
            - "allowed_domains"
            - "HOST_ALLOWLIST"
            - "host_allowlist"
        - not:
            has_body_text:
              - ".scheme =="
              - ".scheme !="
              - ".scheme in"
              - ".scheme not in"
              - 'startswith("https://")'
              - "startswith('https://')"
    explanation: >
      This MCP tool checks the destination host against an allow-list (so
      MCP-008 stays silent) but builds its outbound request URL without a literal
      https:// prefix and without checking the URL scheme. The allow-list
      bounds where the request can go, not how: a model-supplied or
      configured value such as http://allowed.example.com is accepted, so
      credentials in headers and the request body cross the network in
      cleartext, and anyone on the network path can read or rewrite the
      response. The rewritten response re-enters the model's context as
      trusted tool output, a second-order prompt-injection channel. This rule
      fires only after MCP-008's allow-list credit applies, so the two never
      fire on the same tool.
    fix: >
      Pin the scheme: build the URL from a literal "https://" prefix, or
      reject any URL whose urlparse(url).scheme is not "https" before the
      request. Also cap or disable redirects (follow_redirects=False /
      allow_redirects=False) so a redirect cannot downgrade to http://.

  - id: MCP-032
    title: TypeScript MCP tool fetches an allow-listed host without pinning https://
    severity: medium
    confidence: 0.6
    language: typescript
    applies_to:
      - mcp_tool
    scope: tool
    match:
      all:
        - has_unpinned_scheme_url_call: true
        - any:
            - all:
                - has_body_text:
                    - ".hostname"
                    - ".host"
                - has_body_text:
                    - ".includes("
                    - ".has("
            - has_body_text:
                - "allowedHosts"
                - "allowedDomains"
                - "ALLOWED_HOSTS"
                - "ALLOWED_DOMAINS"
                - "hostAllowlist"
        - not:
            has_body_text:
              - ".protocol ==="
              - ".protocol !=="
              - ".protocol =="
              - ".protocol !="
              - 'startsWith("https://")'
              - "startsWith('https://')"
              - 'startsWith("https:")'
    explanation: >
      This TypeScript MCP tool checks the destination host against an
      allow-list (so MCP-013 stays silent) but passes fetch/axios/got a URL
      that does not begin with a literal https:// prefix and checks no
      URL protocol. The allow-list bounds where the request can go, not how:
      an http:// URL for an allowed host is accepted, so credentials and
      request bodies cross the network in cleartext and anyone on the path
      can read or rewrite the response, which then re-enters the model's
      context as trusted tool output. This rule fires only after MCP-013's
      allow-list credit applies, so the two never fire on the same tool.
    fix: >
      Pin the scheme: build the URL from a literal `https://` prefix, or
      reject any URL whose `new URL(x).protocol` is not "https:" before
      fetching. Use redirect: "manual" or cap redirects so a redirect cannot
      downgrade to http://.
