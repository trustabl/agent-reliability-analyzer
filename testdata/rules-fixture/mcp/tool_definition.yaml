policy:
  id: mcp_tool_definition
  name: MCP tool definition hygiene
  category: mcp
  description: >
    Rules covering the structural hygiene of Model Context Protocol tool
    registrations (@server.tool / @mcp.tool / .register_tool). An MCP server
    advertises each tool's name, description, and input schema across a trust
    boundary to whatever client and model connect to it, so weak definitions
    degrade tool selection for every consumer of the server.

rules:
  - id: MCP-001
    title: Tool has no description
    severity: low
    confidence: 0.9
    language: python
    applies_to:
      - mcp_tool
    scope: tool
    match:
      has_docstring: false
    explanation: >
      An MCP server publishes each tool's description to connecting clients as
      the text a model uses to decide whether to call the tool. A registration
      with no docstring (and no explicit description) gives every connecting
      model nothing to route on, leading to wrong-tool or skipped calls across
      all clients of the server.
    fix: >
      Add a one-line docstring (or a description= argument on the registration)
      stating what the tool does and when a model should call it. This text is
      the tool's primary routing signal alongside its name.

  - id: MCP-002
    title: Tool has no type-annotated parameters
    severity: medium
    confidence: 0.85
    language: python
    applies_to:
      - mcp_tool
    scope: tool
    match:
      has_params: true
      has_typed_params: false
    explanation: >
      MCP derives a tool's input JSON schema from the handler's Python type
      annotations. Without annotations the advertised schema is degraded
      (parameters fall back to an unconstrained type), so connecting models
      send unvalidated inputs that frequently cause runtime errors inside the
      server.
    fix: >
      Add type hints to every parameter (def search(query: str, limit: int = 10)
      -> dict). Use Pydantic models or TypedDict for structured inputs so the
      published schema constrains them.

  - id: MCP-003
    title: Ambiguous tool name
    severity: low
    confidence: 0.85
    language: python
    applies_to:
      - mcp_tool
    scope: tool
    match:
      name_in:
        - process
        - handle
        - run
        - do
        - execute
        - perform
        - work
        - go
        - thing
        - stuff
    explanation: >
      Tool names like `process`, `handle`, or `run` give a connecting model no
      signal about intent. Because an MCP server is consumed by clients the
      author does not control, an ambiguous name degrades selection everywhere
      the server is mounted, and collides more easily with similarly-named
      tools from other servers in the same session.
    fix: >
      Rename to a verb-object form, e.g. `summarize_invoice`, `fetch_weather`.

  - id: MCP-011
    title: TypeScript MCP tool has no description
    severity: low
    confidence: 0.85
    language: typescript
    applies_to:
      - mcp_tool
    scope: tool
    match:
      has_docstring: false
    explanation: >
      An MCP server authored in TypeScript registers each tool with
      `server.registerTool(name, {description, inputSchema}, handler)`. With no
      `description` (or one built from a non-literal expression, captured as
      empty), every connecting model loses the primary signal for deciding
      whether to call the tool, causing wrong-tool or skipped calls across all
      clients of the server.
    fix: >
      Provide a concise `description` string in the registration config stating
      what the tool does and when a model should call it.

  - id: MCP-015
    title: Go MCP tool has no description
    severity: low
    confidence: 0.85
    language: go
    applies_to:
      - mcp_tool
    scope: tool
    match:
      has_docstring: false
    explanation: >
      An MCP server authored in Go advertises each tool's description to
      connecting clients as the text a model uses to decide whether to call it. A
      `mcp.NewTool("name", ...)` with no `mcp.WithDescription(...)` option (or an
      `mcp.Tool{...}` whose `Description` is empty) gives every connecting model
      nothing to route on, causing wrong-tool or skipped calls across all clients
      of the server.
    fix: >
      Add `mcp.WithDescription("...")` to the `mcp.NewTool(...)` call (mark3labs/
      mcp-go), or set the `Description` field on the `mcp.Tool` value (the
      official go-sdk), stating what the tool does and when a model should call
      it.

  - id: MCP-016
    title: Ambiguous Go MCP tool name
    severity: low
    confidence: 0.85
    language: go
    applies_to:
      - mcp_tool
    scope: tool
    match:
      name_in:
        - process
        - handle
        - run
        - do
        - execute
        - perform
        - work
        - thing
        - stuff
    explanation: >
      A Go MCP tool's name is the first argument to `mcp.NewTool(...)` (or the
      `Name` field of an `mcp.Tool`). Names like `process`, `handle`, or `run`
      give a connecting model no signal about intent. Because an MCP server is
      consumed by clients the author does not control, an ambiguous name degrades
      tool selection everywhere the server is mounted and collides more easily
      with similarly-named tools from other servers in the same session.
    fix: >
      Rename to a verb-object form, e.g. `summarize_invoice`, `fetch_weather`.

  - id: MCP-017
    title: C# MCP tool has no description
    severity: low
    confidence: 0.85
    language: csharp
    applies_to:
      - mcp_tool
    scope: tool
    match:
      has_docstring: false
    explanation: >
      A C# MCP server advertises each tool's description to connecting clients as
      the text a model uses to decide whether to call it. An `[McpServerTool]`
      method with no co-located `[Description("...")]` attribute advertises no
      routing signal, causing wrong-tool or skipped calls across every client of
      the server.
    fix: >
      Add a `[Description("...")]` attribute (System.ComponentModel) to the
      `[McpServerTool]` method, stating what the tool does and when a model
      should call it.

  - id: MCP-018
    title: Ambiguous C# MCP tool name
    severity: low
    confidence: 0.85
    language: csharp
    applies_to:
      - mcp_tool
    scope: tool
    match:
      name_in:
        - process
        - handle
        - run
        - do
        - execute
        - perform
        - work
        - thing
        - stuff
    explanation: >
      A C# MCP tool's name defaults to the `[McpServerTool]` method name. Names
      like `Process`, `Handle`, or `Run` give a connecting model no signal about
      intent. Because an MCP server is consumed by clients the author does not
      control, an ambiguous name degrades tool selection everywhere the server is
      mounted and collides more easily with similarly-named tools from other
      servers in the same session.
    fix: >
      Rename the method (or set `[McpServerTool(Name = "...")]`) to a verb-object
      form, e.g. `SummarizeInvoice`, `FetchWeather`.

  - id: MCP-019
    title: PHP MCP tool has no description
    severity: low
    confidence: 0.85
    language: php
    applies_to:
      - mcp_tool
    scope: tool
    match:
      has_docstring: false
    explanation: >
      A PHP MCP server advertises each tool's description to connecting clients
      as the text a model uses to decide whether to call it. A `#[McpTool]`
      attribute with no `description:` argument advertises no routing signal,
      causing wrong-tool or skipped calls across every client of the server.
    fix: >
      Add a `description:` argument to the `#[McpTool]` attribute, e.g.
      `#[McpTool(description: '...')]`, stating what the tool does and when a
      model should call it.

  - id: MCP-020
    title: Ambiguous PHP MCP tool name
    severity: low
    confidence: 0.85
    language: php
    applies_to:
      - mcp_tool
    scope: tool
    match:
      name_in:
        - process
        - handle
        - run
        - do
        - execute
        - perform
        - work
        - thing
        - stuff
    explanation: >
      A PHP MCP tool's name is the `#[McpTool]` attribute's `name:` argument, or
      the method name when that argument is omitted. Names like `process`,
      `handle`, or `run` give a connecting model no signal about intent. Because
      an MCP server is consumed by clients the author does not control, an
      ambiguous name degrades tool selection everywhere the server is mounted and
      collides more easily with similarly-named tools from other servers in the
      same session.
    fix: >
      Rename the method (or set the `#[McpTool]` `name:` argument) to a
      verb-object form, e.g. `summarize_invoice`, `fetch_weather`.

  - id: MCP-021
    title: Rust MCP tool has no description
    severity: low
    confidence: 0.85
    language: rust
    applies_to:
      - mcp_tool
    scope: tool
    match:
      has_docstring: false
    explanation: >
      A Rust MCP server (the official rmcp crate) advertises each tool's
      description to connecting clients as the text a model uses to decide
      whether to call it. The rmcp `#[tool]` macro derives that description from
      either a `description = "..."` attribute argument or the method's `///`
      doc comment; when neither is present the tool ships with no routing signal,
      causing wrong-tool or skipped calls across every client of the server.
    fix: >
      Add a `description = "..."` argument to the `#[tool(...)]` attribute, or a
      `///` doc comment on the method, stating what the tool does and when a
      model should call it.

  - id: MCP-022
    title: Ambiguous Rust MCP tool name
    severity: low
    confidence: 0.85
    language: rust
    applies_to:
      - mcp_tool
    scope: tool
    match:
      name_in:
        - process
        - handle
        - run
        - do
        - execute
        - perform
        - work
        - thing
        - stuff
    explanation: >
      A Rust MCP tool's name is the `#[tool]` attribute's `name = "..."` argument,
      or the method name when that argument is omitted. Names like `process`,
      `handle`, or `run` give a connecting model no signal about intent. Because
      an MCP server is consumed by clients the author does not control, an
      ambiguous name degrades tool selection everywhere the server is mounted and
      collides more easily with similarly-named tools from other servers in the
      same session.
    fix: >
      Rename the method (or set the `#[tool]` `name = "..."` argument) to a
      verb-object form, e.g. `summarize_invoice`, `fetch_weather`.

  - id: MCP-029
    title: PHP MCP tool has no type-annotated parameters
    severity: medium
    confidence: 0.85
    language: php
    applies_to:
      - mcp_tool
    scope: tool
    match:
      has_params: true
      has_typed_params: false
    explanation: >
      MCP derives a PHP tool's advertised input JSON schema from the handler's
      parameter type hints. PHP type hints are optional; without them the
      published schema is unconstrained, so connecting models send unvalidated
      inputs that frequently cause runtime errors inside the server. Go, C#,
      and Rust MCP tools cannot express this gap — those languages are
      statically typed — which is why this sibling of MCP-002 exists only for
      PHP.
    fix: >
      Add type hints to every parameter (`function search(string $query, int
      $limit = 10): array`). Use typed properties or DTO classes for structured
      inputs so the published schema constrains them.
