policy:
  id: observability_quality
  name: Agent observability quality
  category: observability
  description: >
    Cross-SDK rules covering observability that is present but not working.
    These rules are framed around the observability VENDOR rather than the agent
    SDK — the failure and its fix are identical whichever SDK declared the
    agent — so they list every SDK token in applies_to instead of shipping nine
    byte-identical copies. See the rulebook rationale doc for the defense of
    that widening.

rules:
  - id: OBS-001
    title: Observability instrumentation is imported but never initialized
    severity: medium
    confidence: 0.7
    applies_to:
      - claude_sdk
      - openai_agents
      - langchain
      - pydantic_ai
      - vercel_ai
      - crewai
      - google_adk
      - autogen
      - mcp
    scope: repo
    match:
      all:
        - repo_has_observability: true
        - repo_observability_initialized: false
    explanation: >
      An observability package is imported in this repo, but no call that
      activates it appears anywhere in the parsed source — no tracer provider is
      set, no vendor client is constructed, no instrumentor is started. Spans are
      created and then dropped, so the dashboard stays empty while the code and
      the dependency manifest both suggest tracing is in place. This reads as
      working observability right up to the incident where it is needed.
    fix: >
      Initialize the instrumentation once at process start, before the first
      agent run: set an OpenTelemetry tracer provider with an exporter, or call
      the vendor's init entry point (logfire.configure(), Traceloop.init(),
      agentops.init(), braintrust.init_logger(), Langfuse's CallbackHandler).
      Verify by checking that a test run produces at least one span in the
      backend.

  - id: OBS-002
    title: The only span exporter writes to the console
    severity: low
    confidence: 0.6
    # Python-only: the exporter-construction walk that backs
    # repo_observability_console_only (pyObservabilitySignals) has no TS/JS
    # counterpart yet (tsObservabilitySignals only collects import/init). A
    # pure TS/JS repo has zero exporter signals, so the predicate can never
    # observe a console-only exporter there — language: python keeps the rule
    # from advertising coverage on repos it cannot actually inspect. See the
    # rulebook rationale doc's known-gaps section.
    language: python
    applies_to:
      - claude_sdk
      - openai_agents
      - langchain
      - pydantic_ai
      - vercel_ai
      - crewai
      - google_adk
      - autogen
      - mcp
    scope: repo
    match:
      repo_observability_console_only: true
    explanation: >
      Every span exporter constructed in this repo writes to the console. Traces
      reach stdout and nothing else, so there is no queryable history: nobody can
      search last week's runs, compare a regression against a baseline, or alert
      on an error rate. On a stdio-transport MCP server the same writes also
      share the JSON-RPC channel and can corrupt the protocol stream.
    fix: >
      Add a network exporter alongside the console one — an OTLP exporter
      pointed at your collector or vendor endpoint. Keep the console exporter for
      local development only, selected by an environment check rather than
      shipped as the sole sink.

  - id: OBS-003
    title: Tracing captures full prompt and response content
    severity: medium
    confidence: 0.8
    # Python-only: the content-capture walk that backs
    # repo_observability_captures_content (pyObservabilitySignals) has no
    # TS/JS counterpart yet — Vercel's experimental_telemetry.recordInputs and
    # equivalents are not detected on the TS side. language: python keeps the
    # rule from advertising coverage on repos it cannot actually inspect. See
    # the rulebook rationale doc's known-gaps section.
    language: python
    applies_to:
      - claude_sdk
      - openai_agents
      - langchain
      - pydantic_ai
      - vercel_ai
      - crewai
      - google_adk
      - autogen
      - mcp
    scope: repo
    match:
      repo_observability_captures_content: true
    explanation: >
      This repo switches on capture of full message content, so every prompt and
      completion is sent to the tracing backend verbatim. Agent prompts routinely
      carry whatever the user typed, retrieved document text, and tool results —
      which is how PII, credentials pasted by users, and internal documents end
      up in a third-party system that was never scoped for them. Trace retention
      is typically long and access is typically broad.
    fix: >
      Turn content capture off in production and keep it for local debugging
      only. If you need the content, install a span processor that redacts
      message bodies before export, and confirm your backend's retention and
      access controls match the sensitivity of what is now flowing into it.

  - id: OBS-005
    title: An observability dependency is declared but never wired
    severity: medium
    confidence: 0.65
    applies_to:
      - claude_sdk
      - openai_agents
      - langchain
      - pydantic_ai
      - vercel_ai
      - crewai
      - google_adk
      - autogen
      - mcp
    scope: repo
    match:
      all:
        - repo_observability_declared: true
        - repo_has_observability: false
        - repo_observability_inspectable: true
    explanation: >
      An observability package is declared in this project's dependency manifest
      — it ships in the image and appears in the SBOM — but nothing in the parsed
      source imports or initializes it. Someone decided this project should be
      instrumented and the wiring never landed. That is worse than never having
      tried: the dependency, the lockfile, and the SBOM all attest to tracing
      that does not exist, so the gap survives review and is discovered during an
      incident, when the traces are not there to read.
    fix: >
      Either wire the dependency you already ship — import it and initialize it
      once at process start, before the first agent run (logfire.configure(),
      Traceloop.init(), agentops.init(), braintrust.init_logger(), Langfuse's
      CallbackHandler, or an OpenTelemetry tracer provider with an exporter) —
      or remove it from the manifest so the SBOM stops claiming coverage this
      project does not have.

  # ─── agent-reliability-otel-labels process labels (OBS-006..008) ──────────
  # One ladder, three rungs: installed, a run started, the labels written.
  # The rules are mutually exclusive — each fires at the first missing rung —
  # and every one is gated on repo_observability_initialized: true, because
  # the library only labels spans the agent already emits. A repo with no
  # tracing gets the SDK's own absence rule instead, never these.
  - id: OBS-006
    title: Instrumented agent does not label its spans with agent-reliability-otel-labels
    severity: low
    confidence: 0.7
    applies_to:
      - claude_sdk
      - openai_agents
      - langchain
      - pydantic_ai
      - vercel_ai
      - crewai
      - google_adk
      - autogen
      - mcp
    scope: repo
    match:
      all:
        - repo_observability_initialized: true
        - repo_otel_labels_installed: false
    explanation: >
      This repo initializes tracing, so the agent emits spans, but nothing
      declares or imports agent-reliability-otel-labels. The spans record that
      a tool ran without recording whether it was the same call as before,
      whether it was a retry, whether it changed outside state, or how the run
      ended. An agent repeating one call in a loop, a retry storm, and a run
      that quietly hit its step cap all read as ordinary successful traces, so
      each is found by someone reading spans by hand after the damage is done.
    fix: >
      Install agent-reliability-otel-labels (pip install
      agent-reliability-otel-labels, or npm install
      @trustabl/agent-reliability-otel-labels) and label the spans the agent
      already emits: create a Run and call run.mark_start(root) on the root
      span, call mark_tool_span on each tool span, and call mark_run_end before
      the root span ends. Running trustabl forge writes these steps for this
      repo's language and framework in its Runtime Tracing section.

  - id: OBS-007
    title: agent-reliability-otel-labels is installed but no run is ever started
    severity: medium
    confidence: 0.65
    applies_to:
      - claude_sdk
      - openai_agents
      - langchain
      - pydantic_ai
      - vercel_ai
      - crewai
      - google_adk
      - autogen
      - mcp
    scope: repo
    match:
      all:
        - repo_observability_initialized: true
        - repo_otel_labels_installed: true
        - repo_otel_labels_initialized: false
    explanation: >
      agent-reliability-otel-labels is declared or imported in this repo, but
      no call to a Run's mark_start appears in the parsed source. That call is
      what stamps the run identity on the root span. Without it the root span
      carries no trustabl.run_id, so tool-span labels cannot be grouped into a
      run and the order of steps cannot be rebuilt. The dependency and the
      import both suggest the labels are in place, while an exported trace has
      nothing that ties them together.
    fix: >
      Create one Run per agent run, inside the function that runs the agent,
      and call run.mark_start(root) on the root span as soon as it is open
      (run.markStart(root) in TypeScript). Never share one Run between runs.
      Verify by exporting one run and checking that the root span carries
      trustabl.run_id. Running trustabl forge writes the full pattern in its
      Runtime Tracing section.

  - id: OBS-008
    title: An agent-reliability-otel-labels run is started but its spans are never labelled
    severity: medium
    confidence: 0.6
    applies_to:
      - claude_sdk
      - openai_agents
      - langchain
      - pydantic_ai
      - vercel_ai
      - crewai
      - google_adk
      - autogen
      - mcp
    scope: repo
    match:
      all:
        - repo_observability_initialized: true
        - repo_otel_labels_initialized: true
        - repo_otel_labels_implemented: false
    explanation: >
      A run is started with mark_start, but the labels the run exists to carry
      are missing: either no mark_run_end call records how the run finished, or
      this repo ships tools and no mark_tool_span call labels a tool span. The
      root span then has a run id and nothing else — no input and output
      fingerprints to show a repeated call, no attempt count to show a retry,
      no side-effect class, and no exit reason, so a run stopped by its step
      cap is indistinguishable from one that finished.
    fix: >
      In each tool, call mark_tool_span on the tool's span inside a finally
      block so a failing call is still labelled, passing the arguments, the
      result, a per-run attempt count, and the step index from run.next_step().
      Call mark_run_end(root, exit_reason=...) before the root span ends, using
      "error" on the exception path. Verify by exporting one run and checking
      for trustabl.tool.input_fp on each tool span and trustabl.exit_reason on
      the root span.

  # ─── agent-reliability-otel-labels label correctness (OBS-009..012) ────────
  # OBS-006..008 prove the labels are written; these prove they are right.
  # Each is gated where its labels must exist, and a single correct call
  # credits the repo (spec D6), so partial misuse is accepted as a miss. Test
  # files never decide one (D8). Findings carry the offending call's file and
  # line.
  - id: OBS-009
    title: One agent-reliability-otel-labels Run is shared by every agent run
    severity: medium
    confidence: 0.6
    applies_to:
      - claude_sdk
      - openai_agents
      - langchain
      - pydantic_ai
      - vercel_ai
      - crewai
      - google_adk
      - autogen
      - mcp
    scope: repo
    match:
      all:
        - repo_observability_initialized: true
        - repo_otel_labels_initialized: true
        - repo_otel_labels_run_shared: true
    explanation: >
      A Run is built once instead of once per agent run: at module scope, in a
      class body, or as a default argument, or it is given a fixed run id.
      Every run then writes the same trustabl.run_id, and the step counter keeps
      counting across runs. Two users' separate requests read as one run, and
      two identical questions read as a loop, so any check that groups tool
      calls by run draws the wrong conclusion, and nothing in the trace shows
      the labels are wrong.
    fix: >
      Create the Run inside the function that handles one agent run, with run =
      Run() (const run = new Run() in TypeScript) as its first line, and pass it
      to the code that labels spans. Do not keep a Run at module scope, as a
      class attribute, or as a default argument, and leave run_id unset or pass
      a per-request id. Verify by exporting two runs and checking that their
      root spans carry different trustabl.run_id values.

  - id: OBS-010
    title: Tool spans are labelled only when the tool succeeds
    severity: low
    confidence: 0.55
    applies_to:
      - claude_sdk
      - openai_agents
      - langchain
      - pydantic_ai
      - vercel_ai
      - crewai
      - google_adk
      - autogen
      - mcp
    scope: repo
    match:
      all:
        - repo_observability_initialized: true
        - repo_otel_labels_implemented: true
        - repo_otel_labels_tool_span_failure_unsafe: true
    explanation: >
      Every mark_tool_span call runs after the tool returns, outside any
      finally or except block, so a tool call that raises is never labelled.
      Failed calls are the ones a retry storm is made of: a tool that fails and
      is retried ten times leaves one labelled span, without the fingerprints
      and attempt counts that would show the repetition.
    fix: >
      Set result = None before calling the tool, call it inside try, and call
      mark_tool_span in the finally block (in TypeScript, let result; try { ... }
      finally { markToolSpan(...) }, or .finally(() => markToolSpan(...)) on the
      promise). Pass error_class when the failure type is known. Verify by
      forcing one tool call to fail and checking that its span carries
      trustabl.tool.input_fp.

  - id: OBS-011
    title: The tool-call attempt count is a constant
    severity: low
    confidence: 0.7
    applies_to:
      - claude_sdk
      - openai_agents
      - langchain
      - pydantic_ai
      - vercel_ai
      - crewai
      - google_adk
      - autogen
      - mcp
    scope: repo
    match:
      all:
        - repo_observability_initialized: true
        - repo_otel_labels_implemented: true
        - repo_otel_labels_attempt_constant: true
    explanation: >
      Every mark_tool_span call passes attempt as a fixed number, usually 1, so
      every call reports as a first attempt. trustabl.tool.attempt exists to
      show retries; with a constant it never can, and an agent that calls the
      same tool with the same arguments again and again looks like a series of
      fresh calls.
    fix: >
      Count attempts per run: keep a dict (a Map in TypeScript) created next to
      the Run, keyed by canonical_fp(args) (canonicalFp in TypeScript),
      increment it before each call, and pass the count as attempt. Verify by
      calling one tool twice with the same arguments in one run and checking
      that the second span carries trustabl.tool.attempt = 2.

  - id: OBS-012
    title: The run's end is recorded only when the run succeeds
    severity: low
    confidence: 0.55
    applies_to:
      - claude_sdk
      - openai_agents
      - langchain
      - pydantic_ai
      - vercel_ai
      - crewai
      - google_adk
      - autogen
      - mcp
    scope: repo
    match:
      all:
        - repo_observability_initialized: true
        - repo_otel_labels_implemented: true
        - repo_otel_labels_run_end_success_only: true
    explanation: >
      Every mark_run_end call records a fixed success reason such as
      "final_answer", on the success path or in a finally block, and none
      records "error". A run that raises then ends with no trustabl.exit_reason,
      or is recorded as finished. Separating failed runs from completed ones is
      what the exit reason is for, so every check on how runs end reports
      success.
    fix: >
      Call mark_run_end(root, exit_reason="final_answer") at the end of the try
      block and mark_run_end(root, exit_reason="error") in the except block
      before re-raising (markRunEnd(root, "error") in catch in TypeScript). Use
      "max_steps" or "policy_stop" when those stopped the run, and never record a
      fixed success reason in finally. Verify by forcing one run to fail and
      checking that its root span carries trustabl.exit_reason = error.
