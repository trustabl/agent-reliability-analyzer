policy:
  id: autogen_ssrf
  name: AutoGen SSRF safety
  category: autogen
  description: >
    Flags AutoGen tools that issue an outbound HTTP request to a
    caller-controlled (non-literal) URL — the server-side request forgery
    surface a model-callable tool exposes.

rules:
  - id: AG2-011
    title: AutoGen tool fetches a caller-controlled URL (SSRF)
    severity: high
    confidence: 0.8
    language: python
    applies_to:
      - autogen_tool
    scope: tool
    match:
      all:
        - has_dynamic_url_call: true
        - not:
            has_body_text:
              - ".hostname not in"
              - ".netloc not in"
              - "ALLOWED_HOSTS"
              - "ALLOWED_DOMAINS"
              - "allowed_hosts"
              - "allowed_domains"
              - "HOST_ALLOWLIST"
              - "host_allowlist"
    explanation: >
      This AutoGen tool issues an HTTP request whose URL is built from a parameter
      or interpolated value rather than a fixed literal. Because the tool is
      model-callable, the model (or a prompt injection) controls the destination —
      it can reach internal services, the cloud metadata endpoint (169.254.169.254),
      or localhost admin ports the agent host can see but an external caller cannot.
      This is a classic server-side request forgery primitive handed to the model.
    fix: >
      Constrain the destination: validate the URL against an allow-list of hosts,
      reject private and link-local IP ranges (and redirects into them), and forbid
      raw model-supplied URLs. If the tool only ever talks to one service, hard-code
      the base URL and accept only a path or query from the model. Credit is given when the body checks the parsed hostname against a named allow-list; also require https:// and cap or disable redirects (follow_redirects=False / allow_redirects=False).

  - id: AG2-022
    title: AutoGen tool fetches an allow-listed host without pinning https://
    severity: medium
    confidence: 0.6
    language: python
    applies_to:
      - autogen_tool
    scope: tool
    match:
      all:
        - has_unpinned_scheme_url_call: true
        - has_body_text:
            - ".hostname not in"
            - ".netloc not in"
            - "ALLOWED_HOSTS"
            - "ALLOWED_DOMAINS"
            - "allowed_hosts"
            - "allowed_domains"
            - "HOST_ALLOWLIST"
            - "host_allowlist"
        - not:
            has_body_text:
              - ".scheme =="
              - ".scheme !="
              - ".scheme in"
              - ".scheme not in"
              - 'startswith("https://")'
              - "startswith('https://')"
    explanation: >
      This AutoGen tool checks the destination host against an allow-list (so
      AG2-011 stays silent) but builds its outbound request URL without a literal
      https:// prefix and without checking the URL scheme. The allow-list
      bounds where the request can go, not how: a model-supplied or
      configured value such as http://allowed.example.com is accepted, so
      credentials in headers and the request body cross the network in
      cleartext, and anyone on the network path can read or rewrite the
      response. The rewritten response re-enters the model's context as
      trusted tool output, a second-order prompt-injection channel. This rule
      fires only after AG2-011's allow-list credit applies, so the two never
      fire on the same tool.
    fix: >
      Pin the scheme: build the URL from a literal "https://" prefix, or
      reject any URL whose urlparse(url).scheme is not "https" before the
      request. Also cap or disable redirects (follow_redirects=False /
      allow_redirects=False) so a redirect cannot downgrade to http://.
