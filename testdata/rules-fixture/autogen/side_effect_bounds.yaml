policy:
  id: autogen_side_effect_bounds
  name: AutoGen unbounded side-effect parameters
  category: autogen
  description: >
    Rules that flag a side-effecting AutoGen / AG2 tool
    (send/notify/refund/charge/...) whose recipient or amount parameter is
    free-form model input with no visible bound — no allow-list constraining who
    a message can go to, no cap or enum constraining how much money moves. This
    is a different failure mode from AG2-015 (idempotency): a duplicate call
    repeats an action within a bound the caller already accepted, while an
    unbounded recipient or amount lets a single call move further than the
    caller intended.

rules:
  - id: AG2-020
    title: Side-effecting tool lets the model choose the recipient or amount with no visible bound
    severity: high
    confidence: 0.5
    language: python
    applies_to:
      - autogen_tool
    scope: tool
    match:
      all:
        - any:
            - all:
                - name_has_prefix:
                    - send_
                    - notify_
                - param_name_matches:
                    contains:
                      - recipient
                    exact:
                      - to
                      - cc
                      - bcc
                      - email
                      - email_address
                      - phone
                      - phone_number
                      - to_email
                      - to_address
                      - to_number
            - all:
                - name_has_prefix:
                    - refund_
                    - charge_
                    - pay_
                    - payout_
                    - transfer_
                    - issue_
                - param_name_matches:
                    contains:
                      - amount
                    exact:
                      - total
                      - price
                    suffixes:
                      - cents
        - not:
            has_body_text:
              - "(le="
              - " le="
              - "(lt="
              - " lt="
              - "conint("
              - "condecimal("
              - "confloat("
              - "Literal["
              - "MAX_"
              - "_MAX"
              - "_LIMIT"
              - "_limit"
              - "ALLOWED"
              - "allowed_"
              - "ALLOWLIST"
              - "allow_list"
              - "WHITELIST"
              - "whitelist"
              - "endswith(\"@"
              - "endswith('@"
    explanation: >
      This AutoGen / AG2 tool function's name signals a send/notify or a
      refund/charge/pay side effect, and it takes a free-form recipient or amount
      parameter with no visible bound: no allow-list constraining who the message
      reaches, and no cap, range, or enum constraining how much money moves. Once
      registered with register_for_llm / register_function, the model chooses
      these arguments itself, and prompt injection or another agent's message in
      the conversation can steer it. There is no tool-level approval gate to check
      for: human_input_mode is set on the agent that executes the tool, not on the
      tool, so this rule cannot see it (AG2-002 covers the NEVER case). This is a
      distinct failure from AG2-015 (idempotency): a duplicate call repeats an
      action inside a bound the caller already accepted; this rule is about a
      single call moving further — a wider blast radius, not a repeated one. Tools
      registered through autogen_core FunctionTool are not discovered.
    fix: >
      Do not let the model supply the recipient or the amount unconstrained.
      Derive the recipient from trusted context (a value bound to the session or
      the authenticated user) rather than a model parameter, or constrain it to an
      allow-list / domain allow-list validated before the call executes. Cap the
      amount with a range check or a typed constraint AND enforce the same cap
      server-side, since a static bound can be bypassed by a differently-shaped
      call. For anything above a low, pre-approved threshold, run the executing
      agent with human_input_mode="ALWAYS" (or route the call through a
      human-approval agent) so a person confirms the specific recipient or amount
      before the side effect runs.
