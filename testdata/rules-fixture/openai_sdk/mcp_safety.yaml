policy:
  id: openai_sdk_mcp_safety
  name: OpenAI Agents SDK MCP integration safety
  category: openai_sdk
  description: >
    Rules covering tool-poisoning and unbounded-catalog risk when an OpenAI
    agent wires MCP servers — either directly via mcp_servers=, or as a
    hosted HostedMCPTool. MCP tool descriptions are advertised by the MCP
    server, which sits on a separate trust boundary from the agent; without
    an input guardrail no pre-execution screen catches a poisoned tool list,
    and without an allow-list a hosted MCP tool inherits the server's full,
    and potentially server-controlled, tool catalog.

rules:
  - id: OAI-106
    title: Agent wires MCP servers without input_guardrails
    severity: high
    confidence: 0.9
    language: python
    applies_to:
      - openai_agent
      - openai_sandbox_agent
    scope: agent
    match:
      all:
        - agent_kwarg_present: [mcp_servers]
        # An empty mcp_servers=[] wires no MCP tools — do not fire on it.
        - not:
            agent_kwarg_list_empty: [mcp_servers]
        - agent_kwarg_list_empty: [input_guardrails]
    explanation: >
      The agent imports tools from one or more MCP servers (mcp_servers=)
      but has no input_guardrails. MCP tool descriptions are advertised by
      the MCP server, which is a separate trust boundary; an attacker-
      controlled or compromised MCP server can craft tool descriptions
      that bait the agent into harmful actions — the "tool poisoning"
      pattern documented in the MCP threat literature. Detection only
      fires when mcp_servers is actually configured with at least one
      server (an empty list wires nothing), so agents without MCP are
      unaffected.
    fix: >
      Add at least one @input_guardrail that inspects the user's input AND
      the resolved tool list before the model is invoked. Pin MCP servers
      to known-trusted URLs/checksums and document the trust assumption.

  - id: OAI-115
    title: Agent wires a HostedMCPTool with no allowed_tools allow-list
    severity: high
    confidence: 0.7
    language: python
    applies_to:
      - openai_agent
      - openai_sandbox_agent
    scope: agent
    match:
      all:
        - agent_uses_hosted_tool_class: [HostedMCPTool]
        - not:
            agent_hosted_tool_kwarg_present:
              class: HostedMCPTool
              kwarg: tool_config.allowed_tools
    explanation: >
      This agent wires a HostedMCPTool whose tool_config names a hosted MCP
      server but sets no allowed_tools. Unlike an explicit tools=[...] list,
      HostedMCPTool connects the agent to every tool that server currently
      exposes — a surface that is not enumerable from the agent's source,
      can grow or change behavior whenever the server is updated, and sits
      on the far side of a trust boundary this codebase does not control.
      allowed_tools is the only static allow-list narrowing that catalog;
      without it there is no boundary a code reviewer can check, and a
      poisoned or newly-added tool description reaches the model unfiltered.
    fix: >
      Add allowed_tools to the tool_config dict, naming the specific tools
      this agent is allowed to call, e.g. HostedMCPTool(tool_config={"type":
      "mcp", "server_label": "deepwiki", "server_url": ...,
      "allowed_tools": ["ask_question"]}). Re-review the list whenever the
      agent's task changes, and keep require_approval at its default rather
      than "never" for anything side-effecting.

  - id: OAI-116
    title: TypeScript agent wires a hostedMcpTool with no allowedTools allow-list
    severity: high
    confidence: 0.75
    language: typescript
    applies_to:
      - openai_agent
    scope: agent
    match:
      all:
        - agent_uses_hosted_tool_class: [hostedMcpTool]
        - not:
            agent_hosted_tool_kwarg_present:
              class: hostedMcpTool
              kwarg: allowedTools
    explanation: >
      This TypeScript OpenAI Agents SDK agent wires a hostedMcpTool() whose
      options set no allowedTools. Unlike an explicit tools: [...] array,
      hostedMcpTool hands the named server to OpenAI's Responses API, which
      connects the agent to every tool that server currently exposes — a
      surface that is not enumerable from the agent's source, can grow or
      change behavior whenever the server is updated, and sits on the far
      side of a trust boundary this codebase does not control. allowedTools
      is the only static allow-list narrowing that catalog, and the risk is
      sharper here than in the equivalent Python case: hostedMcpTool()
      defaults requireApproval to 'never' when the option is omitted, so an
      agent that sets neither allowedTools nor requireApproval has no static
      boundary and no runtime approval gate either — a poisoned or
      newly-added tool description reaches the model unfiltered and executes
      without confirmation.
    fix: >
      Add allowedTools to the hostedMcpTool({...}) options, naming the
      specific tools this agent is allowed to call, e.g. hostedMcpTool({
      serverLabel: "deepwiki", serverUrl: "https://mcp.deepwiki.com/mcp",
      allowedTools: ["ask_question"] }) (an { toolNames: [...] } filter
      object also works). Re-review the list whenever the agent's task
      changes, and set requireApproval explicitly for anything
      side-effecting rather than leaving it at its 'never' default.
