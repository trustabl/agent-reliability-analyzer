policy:
  id: openai_sdk_tracing
  name: OpenAI Agents SDK tracing configuration
  category: openai_sdk
  description: >
    Repo-scoped rules for OpenAI Agents SDK tracing behavior.

rules:
  - id: OAI-201
    title: Project uses default OpenAI tracing
    severity: medium
    confidence: 0.8
    language: python
    applies_to:
      - openai_agents
    scope: repo
    match:
      all:
        - repo_has_sdk_in_code: [openai_agents]
        - repo_uses_default_tracing: true
    explanation: >
      The project uses the OpenAI Agents SDK with default tracing enabled.
      By default, inputs, tool calls, tool outputs, and agent responses are
      sent to OpenAI's hosted tracing backend. For projects handling
      sensitive data (PII, credentials, internal documents), this is a data
      egress channel that is easy to miss.
    fix: >
      Either disable tracing entirely (set OPENAI_AGENTS_DISABLE_TRACING=1
      in the environment) OR register a custom trace processor via
      agents.tracing.add_trace_processor(...) that redacts sensitive fields
      before they leave the process.

  - id: OAI-203
    title: OpenAI Agents SDK project wires no observability
    severity: low
    confidence: 0.75
    applies_to:
      - openai_agents
    scope: repo
    match:
      all:
        - repo_has_sdk_in_code: [openai_agents]
        - repo_has_observability: false
        - repo_observability_inspectable: true
        - repo_observability_declared: false
    explanation: >
      This project runs OpenAI Agents SDK agents but wires no observability
      backend: no OpenTelemetry provider, no Langfuse, Logfire, Phoenix,
      Braintrust, Weave, or AgentOps instrumentation appears anywhere in the
      parsed source. When an agent misbehaves in production — a tool loop, a
      silent guardrail trip, a cost spike — there is no trace to read, so the
      only evidence is whatever the application happened to log. Agent runs are
      non-deterministic, which makes after-the-fact reconstruction from logs
      alone unreliable.
    fix: >
      Wire a trace backend. The SDK traces natively: register a processor with
      agents.tracing.add_trace_processor(...) to ship spans to your collector,
      or install an OpenTelemetry provider
      (opentelemetry.trace.set_tracer_provider(...)) with an OTLP exporter. If
      you already run a vendor — Langfuse, Logfire, Braintrust, Phoenix —
      initialize its SDK at process start.
