# trustabl rule schema — annotated reference
#
# This file documents every field accepted by the YAML rules engine. It is
# DOCUMENTATION, not a runtime policy: it lives in the engine repo alongside
# the loader, not in the rules repository, so the loader never reads it as a
# rule.
#
# To author a new rule:
#   1. Read this file end-to-end.
#   2. Copy fields from the annotated example below into a new entry under
#      <category>/<topic>.yaml in the external agent-reliability-rules repository
#      (Phase-1 interim copy: testdata/rules-fixture/<category>/<topic>.yaml).
#   3. Use the predicate reference (bottom of this file) to express your
#      match condition.
#
# Source of truth for the schema is internal/rules/schema.go. If a struct
# field there does not match this file, schema.go wins — and this file is
# wrong, fix it.


# ─── annotated example ──────────────────────────────────────────────────────
# A complete, valid policy file with every commonly-used field shown. Copy
# from this; lint with `yq` or `python -c "import yaml,sys; yaml.safe_load(sys.stdin)"`
# if you want to be sure a paste is well-formed.

policy:
  id: claude_sdk_network                    # REQUIRED. lowercase_underscored. file-level identifier;
                                            # surfaces only in error messages, not in detection.
                                            # Convention: <category>_<topic>.

  name: Network call hygiene                # REQUIRED. Human title. Reserved for future UX surfaces.

  category: claude_sdk                      # REQUIRED. Inherited by every rule in this file. Allowed:
                                            #   claude_sdk | openai_sdk | openshell | google_adk | mcp |
                                            #   langchain | crewai | pydantic_ai | vercel_ai | autogen | claude_skill.

  description: >                            # REQUIRED. Multi-line ok. Describe the policy's intent.
    Rules that govern outbound network calls made from inside agent tools.
    The SDK does not enforce reliability guarantees on its own — these
    checks make sure tool authors set them explicitly.

rules:
  - id: CSDK-003                            # REQUIRED. GLOBALLY UNIQUE across every file in policies/.
                                            # Convention: <CATEGORY-NNN>. Treat as immutable once shipped —
                                            # downstream consumers cite IDs.

    title: Network call has no timeout      # REQUIRED. Short human title shown in scan output.

    severity: high                          # REQUIRED. info | low | medium | high | critical.
                                            # Drives scoring weight (models.SeverityWeight) and the CLI
                                            # exit code (medium+ → exit 1; --strict treats any as failure).

    confidence: 0.85                        # REQUIRED. (0, 1]. Probability the match is a real problem
                                            # vs. a false positive. Multiplies severity in scoring.
                                            # Loader rejects values <= 0 or > 1.

    language: python                        # OPTIONAL (default: python). Source language this rule
                                            # targets. Allowed: python | typescript | javascript | go |
                                            # csharp | php | rust.
                                            # A rule only fires against tools whose Language matches.
                                            # Python and TypeScript discovery are both plumbed in today,
                                            # so python and typescript rules fire. JavaScript shares the
                                            # TypeScript grammar + discovery (the tsx parser parses plain
                                            # JS) and is audited by the typescript rule packs via the
                                            # TS/JS family gate, so a typescript rule fires on .js too (and
                                            # a javascript rule fires on both). Go, C#, PHP, and Rust have
                                            # MCP tool discovery and field-based rules (e.g. MCP-015..022),
                                            # so go/csharp/php/rust rules fire against discovered MCP tools.
                                            # Non-python rules MUST set this explicitly.

    applies_to:                             # REQUIRED. Non-empty list of kind strings (tool scope shown):
      - claude_sdk_tool                     #   claude_sdk_tool   — @tool / @claude_tool / claude_agent_sdk
      - mcp_tool                            #   openai_tool       — OpenAI Agents SDK @function_tool
                                            #   mcp_tool          — @server.tool / @mcp.tool / .register_tool
                                            #   adk_function_tool — Google ADK FunctionTool-wrapped function
                                            #   shell_invocation  — bare functions calling subprocess.* / os.system
                                            #   unknown           — fallback; rarely useful
                                            # (agent/subagent/skill/repo scopes accept different kinds — see scope below.)
                                            #
                                            # Be honest about scope: a rule's explanation/fix text
                                            # often references a specific SDK ("the Claude Agent SDK
                                            # uses the docstring as ..."). Only list a kind in
                                            # applies_to if the rule's user-facing text is correct
                                            # for that kind. Cross-SDK rules belong in their own
                                            # SDK-specific policy file with their own framing.

    scope: tool                             # REQUIRED. One of: tool | agent | subagent | skill | repo.
                                            #   tool  — fires per ToolDef. Input: a ToolDef + ParsedFile.
                                            #           applies_to accepts: claude_sdk_tool, openai_tool,
                                            #           mcp_tool, adk_function_tool, shell_invocation, unknown,
                                            #           langchain_tool, crewai_tool, pydantic_ai_tool,
                                            #           vercel_ai_tool, autogen_tool.
                                            #   agent — fires per AgentDef (Agent/SandboxAgent/AgentDefinition/
                                            #           ADK/query() constructor call). applies_to accepts:
                                            #           openai_agent, openai_sandbox_agent,
                                            #           claude_agent_definition, claude_query_main,
                                            #           adk_llm_agent, adk_sequential_agent, adk_parallel_agent,
                                            #           adk_loop_agent, adk_langgraph_agent,
                                            #           langchain_agent, langchain_agent_executor,
                                            #           langchain_state_graph, crewai_agent, pydantic_ai_agent,
                                            #           vercel_ai_agent, autogen_conversable_agent,
                                            #           autogen_user_proxy_agent, autogen_assistant_agent,
                                            #           autogen_group_chat_manager, autogen_code_executor_agent.
                                            #   subagent — fires per Claude Code subagent. applies_to accepts:
                                            #           claude_subagent.
                                            #   skill — fires per Claude Code skill (SKILL.md). applies_to accepts:
                                            #           claude_skill.
                                            #   repo  — fires once per scan. applies_to accepts:
                                            #           claude_sdk, openai_agents, google_adk, openshell, mcp,
                                            #           langchain, crewai, pydantic_ai, vercel_ai, autogen.
                                            # (Authoritative per-scope applies_to set: internal/rules/loader.go
                                            #  appliesToByScope — the lists here are a human summary of it.)

    match:                                  # REQUIRED. Predicate expression. See the reference section
                                            # below the example for the full vocabulary.
      call_without_kwarg:
        callees: [requests.get, requests.post]
        missing: timeout

    explanation: >                          # REQUIRED. Multi-paragraph explanation shown to the user.
      An agent tool that makes a network request without a timeout can hang
      indefinitely, blocking the conversation loop and exhausting the
      agent's wall-clock budget. The SDK does not enforce timeouts for you.

    fix: >                                  # REQUIRED. Concrete remediation instruction.
      Pass `timeout=` (typically 5–30s) to the request. Surface failures
      as a structured error the model can react to.


# ─── predicate reference ────────────────────────────────────────────────────
#
# `match:` is a recursive MatchExpr. SEMANTICS:
#
#   • Every set field on a node is conjoined (logical AND). A node with two
#     predicates means "BOTH must hold".
#   • An empty `match: {}` is vacuously true, firing on every instance of
#     `applies_to`. Allowed ONLY at `scope: repo` (the fires-once pattern);
#     the loader rejects an empty match at tool/agent/subagent scope.
#   • Combinators (all/any/not) recurse into sub-expressions.
#
# The vocabulary below is exhaustive. If you need something not listed,
# extend MatchExpr in schema.go AND add a Pred* in predicates.go AND wire it
# in evaluator.go AND document it here. Never invent a YAML key — the loader
# uses KnownFields(true) and rejects unknowns immediately.
#
#
# ━━━ COMBINATORS ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
#   all: [<expr>, <expr>, ...]
#       Every sub-expression must match. Equivalent to listing predicates
#       inline at the same level; use for clarity in complex rules.
#
#   any: [<expr>, <expr>, ...]
#       At least one sub-expression must match.
#
#   not: <expr>
#       Negate the sub-expression. Common: `not: { has_try_except: true }`.
#
#
# ━━━ BOOL PREDICATES ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# Each is a tri-state: omitted = "don't check", true = "must have it",
# false = "must NOT have it". The pointer typing in MatchExpr is what makes
# this distinction work.
#
#   has_docstring:          tool has a non-empty docstring
#   has_params:             tool has at least one parameter (excluding self/cls)
#   has_typed_params:       at least one parameter is type-annotated
#   has_raise:              body contains a `raise` statement
#   has_try_except:         body contains a try/except block
#   has_shell_call:         body calls subprocess.* / os.system / os.popen / os.spawn*
#   has_code_exec_call:     body calls the eval/exec/compile builtins (bare callee,
#                           so re.compile and other attribute calls are not flagged)
#   has_print_call:         body calls the print builtin (bare callee, so pprint and
#                           other callees containing "print" are not flagged)
#   has_write_call:         body opens a file 'w'/'a'/'x', or shutil.copy/copy2/move/rmtree
#   has_dynamic_url_call:   HTTP call where the URL is a non-literal (param/f-string)
#   has_http_call_without_timeout: (TypeScript only) a fetch/axios/got/undici call
#                           with no signal/timeout/abortSignal option — an unbounded
#                           HTTP call that can hang the agent's run loop. Python
#                           tools use call_without_kwarg with `timeout` instead.
#   always:                 sentinel — `false` matches nothing; `true` is a no-op
#                           (an empty match{} is already vacuously true)
#
#
# ━━━ STRING-LIST PREDICATES ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
#   name_in: [name, name, ...]
#       Tool name (case-insensitive) is exactly one of the listed names.
#
#   name_has_prefix: [prefix, prefix, ...]
#       Tool name (case-insensitive) starts with any listed prefix.
#
#   has_body_text: [substring, substring, ...]
#       The function body's raw text contains any listed substring.
#       DISCOURAGED last resort — substring matching is brittle (it false-
#       positives on comments, docstrings, and callees whose text merely
#       contains the needle, e.g. "print(" matches "pprint("). Prefer a
#       structured AST predicate (has_shell_call, has_code_exec_call,
#       has_print_call, call_without_kwarg, …); add a new Pred* if none fits.
#       Shipped use is deliberately rare: OAI-019 (TypeScript idempotency)
#       uses it to spot idempotency-token constants in a tool body span.
#       Reserve new uses for a known constant that has no structural
#       signature.
#
#   has_description_text: [substring, substring, ...]
#       The tool's description (docstring for Python, the explicit
#       description argument for TypeScript) contains any listed substring.
#       Matching is CASE-INSENSITIVE (unlike has_body_text above) — placeholder
#       markers show up as "TODO", "todo", "Todo" interchangeably, and lowering
#       both sides avoids authoring a rule per casing. Reads ToolDef.Description,
#       not the function body — use has_body_text for body content.
#       Intended use: catch placeholder descriptions (todo, tbd, fixme,
#       placeholder, "no description") that pass has_docstring but give the
#       model no real selection signal.
#
#
# ━━━ INT PREDICATES ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
#   description_length_lt: N
#       Fires when the tool's description, trimmed of leading/trailing
#       whitespace, is shorter than N characters. Pair with
#       `has_docstring: true` (via `all:`) so this doesn't double-report
#       against a rule that already flags a missing description — an empty
#       description is length 0, which is also < N, but that case belongs to
#       has_docstring, not this predicate.
#
#
# ━━━ NESTED STRUCT PREDICATES ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
#   param_name_matches:
#       Match any parameter name against any of the listed patterns. Sub-
#       fields are OR'd within the predicate.
#
#       exact:    [path, file]           exact match (case-insensitive)
#       contains: [idempot]              substring match (case-insensitive)
#       suffixes: [_path, _dir]          whole-suffix match (case-insensitive)
#       prefixes: [file_, path_]         whole-prefix match (case-insensitive)
#
#
#   call_without_kwarg:
#       Fires when a matching call lacks an *effective* value for the named
#       kwarg — the kwarg is absent OR present with literal `None`. Callee
#       matching is alias-aware: a call through a local client alias (e.g.
#       `s = requests.Session(); s.get(...)`) matches the canonical
#       `requests.get` callee.
#
#       callees: [requests.get, requests.post, ...]   REQUIRED. Exact callee text.
#       missing: timeout                              REQUIRED. The kwarg name.
#
#
#   call_uses_unnormalized_path_param:
#       Per-param path-flow check. Tracks WHICH params have been normalized
#       — fires only on params that flow into a matching call AND have NOT
#       been .resolve()'d / realpath()'d in the same function. Per-param
#       tracking avoids the false-negative where one normalized param
#       suppresses findings on an unrelated unnormalized one.
#
#       callees:         [open, Path]    OPTIONAL. Exact-match callees.
#       callee_prefixes: [shutil., os.]  OPTIONAL. Prefix-match callees.
#
#
#   tool_decorator_kwarg_value:
#       Fires when the tool's decorator call has a specific kwarg equal to a
#       specific value (literal text comparison against the source). Use for
#       @function_tool(strict_mode=False) style checks.
#
#       kwarg: strict_mode               REQUIRED. Decorator kwarg name.
#       value: "False"                   REQUIRED. Literal text — quote bool/None.
#
#
#   tool_decorator_kwarg_present: [name, name, ...]
#       Fires when the tool's decorator call has ANY of the listed kwargs set.
#
#
# ━━━ AGENT-SCOPE PREDICATES ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# (used only in scope: agent rules)
#
#   agent_class: [Agent, SandboxAgent, AgentDefinition]
#       Fires when the agent's class name is any of the listed values.
#
#   agent_kwarg_present: [kwarg, dotted.path, ...]
#       Fires when ANY of the listed kwargs is present in the agent constructor.
#       Supports dotted paths for nested kwargs (model_settings.tool_choice).
#
#   agent_kwarg_missing: [kwarg, dotted.path, ...]
#       True when a kwarg is absent OR present with literal `None`.
#       (Asymmetric with `agent_kwarg_present`, which tests pure presence.)
#
#   agent_kwarg_list_empty: [kwarg, ...]
#       Fires when ANY of the listed list kwargs is absent or an empty list [].
#       Use for input_guardrails/output_guardrails presence checks.
#
#   agent_kwarg_value:
#       Fires when the named kwarg equals the given value. String literals have
#       surrounding quotes stripped before comparison.
#
#       kwarg: model_settings.tool_choice   REQUIRED. Supports dotted path.
#       value: required                     REQUIRED. Value after quote-stripping.
#
#   agent_uses_tool_kind: [shell_invocation, mcp_tool, ...]
#       Fires when any of the agent's resolved ToolRefs has the given ToolKind.
#       Only resolved (in-repo) tools are checked; External=true refs are skipped.
#
#   agent_grants_builtin_tool: [Bash, WebSearch, ...]
#       Fires when the agent's tools= list contains one of the given built-in
#       tool name strings. Unlike agent_uses_tool_kind, this matches the raw
#       string entries (quotes stripped) — use for Claude AgentDefinition,
#       whose tools= holds built-in tool names ("Bash", "Write") that resolve
#       to no in-repo ToolDef.
#
#   agent_uses_hosted_tool_class: [BashTool, WebSearchTool, ...]
#       Returns true if the agent's HostedToolRefs include any of the named
#       hosted-tool classes (e.g. BashTool, WebSearchTool, GoogleSearchTool).
#       Matches by class name on the ref, so an unresolved HostedToolRef
#       (e.g. an SDK we discovered but did not resolve back to a typed def)
#       still counts.
#
#   agent_is_subagent_of_any: bool
#       Returns true if the agent appears as a Resolved entry in any other
#       agent's HandoffRefs in the inventory. Useful for rules that fire only
#       on agents that participate in a delegation tree (e.g. ADK's sub_agents
#       composition or OpenAI's handoffs= edges).
#
#   agent_hosted_tool_kwarg_present: {class: ToolClass, kwarg: name}
#       Returns true if the agent wires a hosted tool of `class` whose `kwarg`
#       is present (e.g. BashTool with a `policy=`). `kwarg` supports dotted
#       paths. Requires the hosted ref to be resolved (the def carries the
#       captured kwargs). Negate with not: to flag a missing safety kwarg.
#
#   agent_hosted_tool_kwarg_value: {class: ToolClass, kwarg: name, value: V}
#       Returns true if the agent wires a hosted tool of `class` whose `kwarg`
#       equals `value` (quote-stripped for string literals), e.g. ShellTool with
#       needs_approval == "True".
#
#   agent_run_call_max_turns_missing: bool
#       OpenAI Agents SDK only (agent.sdk == openai_agents). Returns true if
#       the agent has at least one same-file Runner.run/run_sync/run_streamed
#       call resolvable to it by variable name, and none of those calls set
#       max_turns. Silent (false) if the agent has no resolvable run call at
#       all — absence of evidence isn't evidence of absence.
#
#   agent_run_call_usage_limits_missing: bool
#       Pydantic AI only (agent.sdk == pydantic_ai). Returns true if the agent
#       has at least one same-file <agent>.run/run_sync/run_stream call
#       resolvable to it by variable name, and none of those calls set
#       usage_limits. Same silence rule as agent_run_call_max_turns_missing.
#
#   agent_mcp_server_kwarg_missing: {classes: [MCPServerStdio, ...], kwarg: tool_filter}
#       Returns true if the agent wires at least one MCP server of any class in
#       `classes` whose `kwarg` is absent OR present with literal None. `kwarg`
#       supports dotted paths. Requires the MCP server ref to be resolved (the
#       def carries the captured kwargs) — an unresolved/external ref is
#       skipped, not counted as missing. `classes` is a list (unlike
#       agent_hosted_tool_kwarg_present's single `class`) because
#       MCPServerStdio/Sse/StreamableHttp all share tool_filter as the same
#       allow-list mechanism, so one rule checks all three. Positive logic
#       (not a negated `_present` predicate, and no separate
#       agent_uses_*_class clause needed): finding a ref whose class is in the
#       list already proves the agent uses it, and with multiple wired servers
#       negating a presence check would go silent as soon as ANY one sets the
#       kwarg, masking the others that don't.
#
#
# ━━━ SUBAGENT-SCOPE PREDICATES ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# (used only in scope: subagent rules)
#
#   subagent_grants_tool: [Bash, Write, ...]
#       Fires when the subagent's frontmatter tools= list contains any of the
#       given Claude Code tool names (string matching against the raw tool name
#       in the list — e.g. tools: [Bash, Write, WebSearch]). Use for subagents
#       that call system tools or manipulate files.
#
#
# ━━━ SKILL-SCOPE PREDICATES ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# (used only in scope: skill rules — Claude Code Agent Skills, SKILL.md)
#
#   skill_allows_unrestricted_shell: true
#       Fires when allowed-tools pre-approves unrestricted shell — a bare `Bash`
#       grant or a wildcard pattern (Bash(*) / Bash(:*)). allowed-tools is an
#       auto-approval list, not a sandbox, so this auto-runs any shell command
#       without prompting. Bool predicate; negate with `false`.
#
#   skill_allows_tool: [Bash, Write, WebFetch, ...]
#       Fires when allowed-tools pre-approves any of the given Claude Code tool
#       names (matches the parsed grant Tool, then the raw token).
#
#   skill_model_invocable: true
#       Fires when the model can auto-invoke the skill (disable-model-invocation
#       is not set). Pair with skill_allows_tool to flag a model-triggerable
#       side-effecting skill. Bool predicate.
#
#   skill_body_has_dynamic_exec: true
#       Fires when the SKILL.md body uses dynamic-context shell execution (the
#       inline !`cmd` form or a ```! fenced block), which Claude Code runs during
#       preprocessing — before the model sees the skill. Bool predicate.
#
#   skill_dynamic_exec_touches_network_or_secrets: true
#       Fires when a dynamic-context command performs network egress (curl / wget
#       / nc / ...) or reads credentials/secrets (gh auth, $AWS_*, ~/.aws,
#       ~/.ssh, id_rsa, *_key, ...). The pre-model exfiltration primitive. Bool.
#
#   skill_references_external_url: true
#       Fires when the SKILL.md body references an external http(s) URL — an
#       indirect-injection vector and possible exfiltration endpoint. Bool.
#
#   skill_body_has_injection_marker: true
#       Fires when the body carries a prompt-injection marker (instruction-
#       override phrasing, zero-width characters, or a long base64 blob). Bool.
#
#   skill_bundled_script_network_egress: true
#       Fires when a script bundled in the skill's directory makes outbound
#       network calls (curl / wget / nc / ...). A skill can run its bundled
#       scripts, so this is the payload-in-aux-file egress that scanning
#       SKILL.md alone misses. Bool predicate.
#
#   skill_bundled_script_reads_secrets: true
#       Fires when a bundled script reads credentials/secrets (gh auth, $AWS_*,
#       ~/.aws, ~/.ssh, id_rsa, *_key, ...). Credential theft hidden outside the
#       SKILL.md body. Bool predicate.
#
#   skill_bundled_file_has_hardcoded_secret: true
#       Fires when any non-binary bundled file contains a hardcoded secret
#       literal — a distinctive provider token (AWS AKIA, GitHub ghp_/
#       github_pat_, Slack xox, Google AIza, OpenAI sk-) or a private-key header.
#       A credential committed INTO the skill, distinct from a script that reads
#       one at runtime. High-specificity (low FP). Bool predicate.
#
#   skill_description_tool_mismatch: true
#       Fires when the description explicitly claims to be read-only /
#       side-effect-free yet allowed-tools pre-approve a side-effecting tool
#       (Bash / Write / Edit / WebFetch / NotebookEdit, or unrestricted shell) —
#       a metadata-vs-capability mismatch. Heuristic, low confidence. Bool.
#
#   skill_has_description: true
#       Fires when SkillDef.Description is non-empty (after trimming
#       whitespace). Use skill_has_description: false to flag skills
#       with a missing or blank description. Bool predicate.
#
#   skill_is_agent_specific: true
#       Fires when the skill's frontmatter binds it to one specific agent
#       (context: fork / agent: <name>) rather than being agent-agnostic.
#       An agent-bound skill inherits that agent's trust and guardrail
#       assumptions and is harder to reuse or review independently of it.
#       Bool predicate.
#
#   skill_has_duplicate_tool_refs: true
#       Fires when SkillDef.AllowedTools contains duplicate entries
#       (case-insensitive, whitespace-trimmed) — the same tool referenced
#       more than once unnecessarily. Configuration-quality signal, not a
#       security bug on its own. Bool predicate.
#
#   skill_body_has_text: [substring, substring, ...]
#       Fires when the SKILL.md body (the raw markdown below the frontmatter)
#       contains any listed substring, matched case-insensitively. Mirrors the
#       tool-scope has_body_text — same DISCOURAGED-last-resort caveat: prefer
#       a structured predicate (skill_body_has_dynamic_exec,
#       skill_references_external_url, skill_body_has_injection_marker, ...)
#       when one fits; reserve this for a known phrase with no structural
#       signature.
#
#   skill_name_has_text: [substring, substring, ...]
#       Fires when SkillDef.Name contains any listed substring, matched
#       case-insensitively.
#
#   skill_description_has_text: [substring, substring, ...]
#       Fires when SkillDef.Description contains any listed substring,
#       matched case-insensitively.
#
#
# ━━━ REPO-SCOPE PREDICATES ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# (used only in scope: repo rules; match runs once per scan)
#
#   repo_has_sdk_in_code: [claude_agent_sdk, openai_agents, google_adk, mcp,
#                          langchain, crewai, pydantic_ai, vercel_ai, autogen,
#                          openshell]
#       Fires when RepoInventory.SDKsDetected contains the given SDK value.
#       Derived from actually-observed tool/agent kinds in code (not just deps).
#       Special case: "openshell" is NOT an SDK and never appears in
#       SDKsDetected — it routes to RepoInventory.HasShellInvocations (true
#       when a Python function calls subprocess.* / os.system / os.popen).
#
#   repo_component_present: [mcp_config, hook_script, claude_md, ...]
#       Fires when any Component in Manifest.Components has the given kind.
#       Allowed values match models.ComponentKind: mcp_config, claude_md,
#       agents_md, claude_settings, subagent, skill, slash_command,
#       plugin_manifest, hook_script, sandbox_policy, system_prompt,
#       dependency_manifest, claude_agent_definition.
#
#   repo_uses_default_tracing: true | false
#       Fires when the scanner's derived UsesDefaultTracing flag matches.
#       UsesDefaultTracing is true when no add_trace_processor or
#       OPENAI_AGENTS_DISABLE_TRACING appears anywhere in parsed Python files.
#   repo_claude_default_mode_is: [bypassPermissions, acceptEdits, ...]
#       Fires when any discovered .claude/settings.json (or settings.local.json)
#       declares a defaultMode equal to one of the listed modes. Reads
#       RepoInventory.ClaudeSettings[].DefaultMode. Used by CSDK-201 to flag
#       defaultMode: bypassPermissions, which disables Claude Code approval
#       prompts repo-wide.
#   repo_claude_options_permission_mode_is: [bypassPermissions, acceptEdits, ...]
#       Fires when any discovered ClaudeAgentOptions(...) construction sets
#       permission_mode to one of the listed modes. Reads
#       RepoInventory.ClaudeAgentOptions[].Kwargs (permission_mode). The in-code,
#       session-level analogue of repo_claude_default_mode_is. Used by CSDK-202.
#   repo_claude_options_max_turns_missing: true | false
#       Fires when the repo has at least one non-opaque ClaudeAgentOptions(...)
#       construction and NONE of them set max_turns. Reads
#       RepoInventory.ClaudeAgentOptions[].Kwargs (max_turns) via the same
#       lookup as repo_claude_options_permission_mode_is. Constructions built
#       with ** unpacking (Opaque: true) are skipped — their kwarg set is
#       untrustworthy, so their silence isn't evidence of a missing cap. A repo
#       with zero ClaudeAgentOptions constructions never fires. Used by
#       CSDK-204.
#   repo_claude_options_disallowed_tools_missing: true | false
#       Fires when the repo has at least one non-opaque ClaudeAgentOptions(...)
#       construction and NONE of them set disallowed_tools. Reads
#       RepoInventory.ClaudeAgentOptions[].Kwargs (disallowed_tools) via the
#       same lookup and Opaque-skip rules as
#       repo_claude_options_max_turns_missing. A repo with zero
#       ClaudeAgentOptions constructions never fires. Note: a construction that
#       sets disallowed_tools=[] or disallowed_tools=None still counts as "set"
#       — the presence check only requires a non-nil Value, the same tri-state
#       gap max_turns=None already has. Used by CSDK-205.
