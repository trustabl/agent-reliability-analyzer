# trustabl rule schema — annotated reference
#
# This file documents every field accepted by the YAML rules engine. It is
# DOCUMENTATION, not a runtime policy: it lives in the engine repo alongside
# the loader, not in the rules repository, so the loader never reads it as a
# rule.
#
# To author a new rule:
#   1. Read this file end-to-end.
#   2. Copy fields from the annotated example below into a new entry under
#      <category>/<topic>.yaml in the external agent-reliability-rules repository
#      (Phase-1 interim copy: testdata/rules-fixture/<category>/<topic>.yaml).
#   3. Use the predicate reference (bottom of this file) to express your
#      match condition.
#
# Source of truth for the schema is internal/rules/schema.go. If a struct
# field there does not match this file, schema.go wins — and this file is
# wrong, fix it.


# ─── annotated example ──────────────────────────────────────────────────────
# A complete, valid policy file with every commonly-used field shown. Copy
# from this; lint with `yq` or `python -c "import yaml,sys; yaml.safe_load(sys.stdin)"`
# if you want to be sure a paste is well-formed.

policy:
  id: claude_sdk_network                    # REQUIRED. lowercase_underscored. file-level identifier;
                                            # surfaces only in error messages, not in detection.
                                            # Convention: <category>_<topic>.

  name: Network call hygiene                # REQUIRED. Human title. Reserved for future UX surfaces.

  category: claude_sdk                      # REQUIRED. Inherited by every rule in this file. Allowed:
                                            #   claude_sdk | openai_sdk | openshell | google_adk | mcp |
                                            #   langchain | crewai | pydantic_ai | vercel_ai | autogen | claude_skill |
                                            #   observability | raw_llm_sdk | agent_config | ci.

  description: >                            # REQUIRED. Multi-line ok. Describe the policy's intent.
    Rules that govern outbound network calls made from inside agent tools.
    The SDK does not enforce reliability guarantees on its own — these
    checks make sure tool authors set them explicitly.

rules:
  - id: CSDK-003                            # REQUIRED. GLOBALLY UNIQUE across every file in policies/.
                                            # Convention: <CATEGORY-NNN>. Treat as immutable once shipped —
                                            # downstream consumers cite IDs.

    title: Network call has no timeout      # REQUIRED. Short human title shown in scan output.

    severity: high                          # REQUIRED. info | low | medium | high | critical.
                                            # Drives scoring weight (models.SeverityWeight) and the CLI
                                            # exit code (medium+ → exit 1; --strict treats any as failure).

    confidence: 0.85                        # REQUIRED. (0, 1]. Probability the match is a real problem
                                            # vs. a false positive. Multiplies severity in scoring.
                                            # Loader rejects values <= 0 or > 1.

    language: python                        # OPTIONAL (default: python). Source language this rule
                                            # targets. Allowed: python | typescript | javascript | go |
                                            # csharp | php | rust.
                                            # A rule only fires against tools whose Language matches.
                                            # Python and TypeScript discovery are both plumbed in today,
                                            # so python and typescript rules fire. JavaScript shares the
                                            # TypeScript grammar + discovery (the tsx parser parses plain
                                            # JS) and is audited by the typescript rule packs via the
                                            # TS/JS family gate, so a typescript rule fires on .js too (and
                                            # a javascript rule fires on both). Go, C#, PHP, and Rust have
                                            # MCP tool discovery and field-based rules (e.g. MCP-015..022),
                                            # so go/csharp/php/rust rules fire against discovered MCP tools.
                                            # Non-python rules MUST set this explicitly.

    applies_to:                             # REQUIRED. Non-empty list of kind strings (tool scope shown):
      - claude_sdk_tool                     #   claude_sdk_tool   — @tool / @claude_tool / claude_agent_sdk
      - mcp_tool                            #   openai_tool       — OpenAI Agents SDK @function_tool
                                            #   mcp_tool          — @server.tool / @mcp.tool / .register_tool
                                            #   adk_function_tool — Google ADK FunctionTool-wrapped function
                                            #   shell_invocation  — bare functions calling subprocess.* / os.system
                                            #   unknown           — fallback; rarely useful
                                            # (agent/subagent/skill/repo scopes accept different kinds — see scope below.)
                                            #
                                            # Be honest about scope: a rule's explanation/fix text
                                            # often references a specific SDK ("the Claude Agent SDK
                                            # uses the docstring as ..."). Only list a kind in
                                            # applies_to if the rule's user-facing text is correct
                                            # for that kind. Cross-SDK rules belong in their own
                                            # SDK-specific policy file with their own framing.

    scope: tool                             # REQUIRED. One of: tool | agent | subagent | skill | repo.
                                            #   tool  — fires per ToolDef. Input: a ToolDef + ParsedFile.
                                            #           applies_to accepts: claude_sdk_tool, openai_tool,
                                            #           mcp_tool, adk_function_tool, shell_invocation, unknown,
                                            #           langchain_tool, crewai_tool, pydantic_ai_tool,
                                            #           vercel_ai_tool, autogen_tool, langgraph_node.
                                            #   agent — fires per AgentDef (Agent/SandboxAgent/AgentDefinition/
                                            #           ADK/query() constructor call). applies_to accepts:
                                            #           openai_agent, openai_sandbox_agent,
                                            #           claude_agent_definition, claude_query_main,
                                            #           adk_llm_agent, adk_sequential_agent, adk_parallel_agent,
                                            #           adk_loop_agent, adk_langgraph_agent,
                                            #           langchain_agent, langchain_agent_executor,
                                            #           langchain_state_graph, crewai_agent, pydantic_ai_agent,
                                            #           vercel_ai_agent, autogen_conversable_agent,
                                            #           autogen_user_proxy_agent, autogen_assistant_agent,
                                            #           autogen_group_chat_manager, autogen_code_executor_agent.
                                            #   subagent — fires per Claude Code subagent. applies_to accepts:
                                            #           claude_subagent.
                                            #   skill — fires per Claude Code skill (SKILL.md). applies_to accepts:
                                            #           claude_skill.
                                            #   repo  — fires once per scan. applies_to accepts:
                                            #           claude_sdk, openai_agents, google_adk, openshell, mcp,
                                            #           langchain, crewai, pydantic_ai, vercel_ai, autogen,
                                            #           raw_llm_sdk (bare anthropic/openai client usage),
                                            #           agent_config (pre-trust harness config; no SDK gate),
#           github_actions (coding agents in GitHub Actions workflows; no SDK gate).
                                            # (Authoritative per-scope applies_to set: internal/rules/loader.go
                                            #  appliesToByScope — the lists here are a human summary of it.)

    match:                                  # REQUIRED. Predicate expression. See the reference section
                                            # below the example for the full vocabulary.
      call_without_kwarg:
        callees: [requests.get, requests.post]
        missing: timeout

    explanation: >                          # REQUIRED. Multi-paragraph explanation shown to the user.
      An agent tool that makes a network request without a timeout can hang
      indefinitely, blocking the conversation loop and exhausting the
      agent's wall-clock budget. The SDK does not enforce timeouts for you.

    fix: >                                  # REQUIRED. Concrete remediation instruction.
      Pass `timeout=` (typically 5–30s) to the request. Surface failures
      as a structured error the model can react to.


# ─── predicate reference ────────────────────────────────────────────────────
#
# `match:` is a recursive MatchExpr. SEMANTICS:
#
#   • Every set field on a node is conjoined (logical AND). A node with two
#     predicates means "BOTH must hold".
#   • An empty `match: {}` is vacuously true, firing on every instance of
#     `applies_to`. Allowed ONLY at `scope: repo` (the fires-once pattern);
#     the loader rejects an empty match at tool/agent/subagent scope.
#   • Combinators (all/any/not) recurse into sub-expressions.
#
# The vocabulary below is exhaustive. If you need something not listed,
# extend MatchExpr in schema.go AND add a Pred* in predicates.go AND wire it
# in evaluator.go AND document it here. Never invent a YAML key — the loader
# uses KnownFields(true) and rejects unknowns immediately.
#
#
# ━━━ COMBINATORS ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
#   all: [<expr>, <expr>, ...]
#       Every sub-expression must match. Equivalent to listing predicates
#       inline at the same level; use for clarity in complex rules.
#
#   any: [<expr>, <expr>, ...]
#       At least one sub-expression must match.
#
#   not: <expr>
#       Negate the sub-expression. Common: `not: { has_try_except: true }`.
#
#
# ━━━ BOOL PREDICATES ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# Each is a tri-state: omitted = "don't check", true = "must have it",
# false = "must NOT have it". The pointer typing in MatchExpr is what makes
# this distinction work.
#
#   has_docstring:          tool has a non-empty docstring
#   has_params:             tool has at least one parameter (excluding self/cls)
#   has_typed_params:       at least one parameter is type-annotated
#   has_raise:              body contains a `raise` statement
#   has_try_except:         body contains a try/except block
#   has_shell_call:         body calls subprocess.* / os.system / os.popen / os.spawn*
#   has_code_exec_call:     body calls the eval/exec/compile builtins (bare callee,
#                           so re.compile and other attribute calls are not flagged)
#   has_print_call:         body writes to stdout for diagnostics. Python: calls
#                           the print builtin (bare callee, so pprint and other
#                           callees containing "print" are not flagged).
#                           TypeScript/JavaScript: calls console.log /
#                           console.info / console.debug / process.stdout.write.
#                           console.warn, console.error and process.stderr.write
#                           are deliberately NOT flagged — Node routes them to
#                           stderr, which is the remediation (and on an MCP stdio
#                           server the only safe destination, since stdout carries
#                           the JSON-RPC frames).
#   has_write_call:         body opens a file 'w'/'a'/'x', or shutil.copy/copy2/move/rmtree
#   has_dynamic_url_call:   HTTP call where the URL is a non-literal (param/f-string)
#   has_unpinned_scheme_url_call: HTTP call with a non-literal URL that does not
#                           start with a literal https:// prefix (f-string / template
#                           / concat / .format / % forms are recognized; an identifier
#                           URL is unpinned). Pair with the SSRF allow-list gate.
#   has_http_call_without_timeout: (TypeScript only) a fetch/axios/got/undici call
#                           with no signal/timeout/abortSignal option — an unbounded
#                           HTTP call that can hang the agent's run loop. Python
#                           tools use call_without_kwarg with `timeout` instead.
#   always:                 sentinel — `false` matches nothing; `true` is a no-op
#                           (an empty match{} is already vacuously true)
#
#
# ━━━ STRING-LIST PREDICATES ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
#   name_in: [name, name, ...]
#       Tool name (case-insensitive) is exactly one of the listed names.
#
#   name_has_prefix: [prefix, prefix, ...]
#       Tool name (case-insensitive) starts with any listed prefix.
#
#   has_body_text: [substring, substring, ...]
#       The function body's raw text contains any listed substring.
#       DISCOURAGED last resort — substring matching is brittle (it false-
#       positives on comments, docstrings, and callees whose text merely
#       contains the needle, e.g. "print(" matches "pprint("). Prefer a
#       structured AST predicate (has_shell_call, has_code_exec_call,
#       has_print_call, call_without_kwarg, …); add a new Pred* if none fits.
#       Shipped use is deliberately rare: OAI-019 (TypeScript idempotency)
#       uses it to spot idempotency-token constants in a tool body span.
#       Reserve new uses for a known constant that has no structural
#       signature.
#
#   tool_claim_use: [absent | unused | passthrough | checked | wrapped, ...]
#       How the tool uses its EBTE-style `claim` argument (a typed
#       ToolInvocationExplanation the model fills in with each call). True when
#       the tool's use is any listed value. `absent`: no `claim` in
#       param_names or input_keys (a Claude Agent SDK handler's input-schema
#       keys), so it holds for every discovery path. The other values come from
#       the claim_use fact, stamped by Python decorated-tool discovery, the
#       Python factory paths (LangChain StructuredTool / Tool.from_function,
#       Pydantic AI Tool(fn), ADK FunctionTool(fn), AutoGen register_function),
#       Claude Agent SDK @tool handlers (args["claim"]) and TypeScript OpenAI
#       Agents tool({...}) execute functions: `unused` (never read),
#       `passthrough` (every read is an argument to an output call — print, a
#       logger method, json.dumps, str, repr; console.*, JSON.stringify, String
#       in TypeScript — or part of a return value), `checked` (some read feeds
#       another call, a comparison or a condition), `wrapped` (a decorator
#       besides the registering one, or an SDK pre-tool hook that may mediate;
#       not verified: an OpenAI tool input guardrail, or anywhere in the repo a
#       CrewAI before_tool_call hook, a Pydantic AI tool-execution hook or
#       args_validator=, a Claude PreToolUse hook or unbypassed can_use_tool,
#       or an ADK before_tool_callback). A tool that declares `claim` without
#       the fact matches no value. The loader rejects any other value.
#
#   has_description_text: [substring, substring, ...]
#       The tool's description (docstring for Python, the explicit
#       description argument for TypeScript) contains any listed substring.
#       Matching is CASE-INSENSITIVE (unlike has_body_text above) — placeholder
#       markers show up as "TODO", "todo", "Todo" interchangeably, and lowering
#       both sides avoids authoring a rule per casing. Reads ToolDef.Description,
#       not the function body — use has_body_text for body content.
#       Intended use: catch placeholder descriptions (todo, tbd, fixme,
#       placeholder, "no description") that pass has_docstring but give the
#       model no real selection signal.
#
#
# ━━━ INT PREDICATES ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
#   description_length_lt: N
#       Fires when the tool's description, trimmed of leading/trailing
#       whitespace, is shorter than N characters. Pair with
#       `has_docstring: true` (via `all:`) so this doesn't double-report
#       against a rule that already flags a missing description — an empty
#       description is length 0, which is also < N, but that case belongs to
#       has_docstring, not this predicate.
#
#
# ━━━ NESTED STRUCT PREDICATES ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
#   param_name_matches:
#       Match any parameter name against any of the listed patterns. Sub-
#       fields are OR'd within the predicate.
#
#       exact:    [path, file]           exact match (case-insensitive)
#       contains: [idempot]              substring match (case-insensitive)
#       suffixes: [_path, _dir]          whole-suffix match (case-insensitive)
#       prefixes: [file_, path_]         whole-prefix match (case-insensitive)
#
#
#   call_without_kwarg:
#       Fires when a matching call lacks an *effective* value for the named
#       kwarg — the kwarg is absent OR present with literal `None`. Callee
#       matching is alias-aware: a call through a local client alias (e.g.
#       `s = requests.Session(); s.get(...)`) matches the canonical
#       `requests.get` callee.
#
#       callees: [requests.get, requests.post, ...]   REQUIRED. Exact callee text.
#       missing: timeout                              REQUIRED. The kwarg name.
#
#
#   call_uses_unnormalized_path_param:
#       Per-param path-flow check. Tracks WHICH params have been normalized
#       — fires only on params that flow into a matching call AND have NOT
#       been .resolve()'d / realpath()'d in the same function. Per-param
#       tracking avoids the false-negative where one normalized param
#       suppresses findings on an unrelated unnormalized one.
#
#       callees:         [open, Path]    OPTIONAL. Exact-match callees.
#       callee_prefixes: [shutil., os.]  OPTIONAL. Prefix-match callees.
#
#
#   tool_decorator_kwarg_value:
#       Fires when the tool's decorator call has a specific kwarg equal to a
#       specific value (literal text comparison against the source). Use for
#       @function_tool(strict_mode=False) style checks.
#
#       kwarg: strict_mode               REQUIRED. Decorator kwarg name.
#       value: "False"                   REQUIRED. Literal text — quote bool/None.
#
#
#   tool_decorator_kwarg_present: [name, name, ...]
#       Fires when the tool's decorator call has ANY of the listed kwargs set.
#
#
# ━━━ AGENT-SCOPE PREDICATES ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# (used only in scope: agent rules)
#
#   agent_class: [Agent, SandboxAgent, AgentDefinition]
#       Fires when the agent's class name is any of the listed values.
#
#   agent_kwarg_present: [kwarg, dotted.path, ...]
#       Fires when ANY of the listed kwargs is present in the agent constructor.
#       Supports dotted paths for nested kwargs (model_settings.tool_choice).
#
#   agent_kwarg_missing: [kwarg, dotted.path, ...]
#       True when a kwarg is absent OR present with literal `None`.
#       (Asymmetric with `agent_kwarg_present`, which tests pure presence.)
#       One exception: a kwarg named by AgentDef.InstrumentedBy (set when a
#       process-wide instrumentation call such as logfire.instrument_pydantic_ai()
#       covers the agent) is treated as set, so `instrument` / `callbacks` are not
#       reported missing on a covered agent. Every other kwarg is unaffected.
#
#   agent_kwarg_list_empty: [kwarg, ...]
#       Fires when ANY of the listed list kwargs is absent or an empty list [].
#       Use for input_guardrails/output_guardrails presence checks.
#
#   agent_kwarg_value:
#       Fires when the named kwarg equals the given value. String literals have
#       surrounding quotes stripped before comparison.
#
#       kwarg: model_settings.tool_choice   REQUIRED. Supports dotted path.
#       value: required                     REQUIRED. Value after quote-stripping.
#
#   agent_uses_tool_kind: [shell_invocation, mcp_tool, ...]
#       Fires when any of the agent's resolved ToolRefs has the given ToolKind.
#       Only resolved (in-repo) tools are checked; External=true refs are skipped.
#
#   agent_grants_builtin_tool: [Bash, WebSearch, ...]
#       Fires when the agent's tools= list contains one of the given built-in
#       tool name strings. Unlike agent_uses_tool_kind, this matches the raw
#       string entries (quotes stripped) — use for Claude AgentDefinition,
#       whose tools= holds built-in tool names ("Bash", "Write") that resolve
#       to no in-repo ToolDef.
#
#   agent_uses_hosted_tool_class: [BashTool, WebSearchTool, ...]
#       Returns true if the agent's HostedToolRefs include any of the named
#       hosted-tool classes (e.g. BashTool, WebSearchTool, GoogleSearchTool).
#       Matches by class name on the ref, so an unresolved HostedToolRef
#       (e.g. an SDK we discovered but did not resolve back to a typed def)
#       still counts.
#
#   agent_is_subagent_of_any: bool
#       Returns true if the agent appears as a Resolved entry in any other
#       agent's HandoffRefs in the inventory. Useful for rules that fire only
#       on agents that participate in a delegation tree (e.g. ADK's sub_agents
#       composition or OpenAI's handoffs= edges).
#
#   agent_hosted_tool_kwarg_present: {class: ToolClass, kwarg: name}
#       Returns true if the agent wires a hosted tool of `class` whose `kwarg`
#       is present (e.g. BashTool with a `policy=`). `kwarg` supports dotted
#       paths. Requires the hosted ref to be resolved (the def carries the
#       captured kwargs). Negate with not: to flag a missing safety kwarg.
#
#   agent_hosted_tool_kwarg_value: {class: ToolClass, kwarg: name, value: V}
#       Returns true if the agent wires a hosted tool of `class` whose `kwarg`
#       equals `value` (quote-stripped for string literals), e.g. ShellTool with
#       needs_approval == "True".
#
#   agent_run_call_max_turns_missing: bool
#       OpenAI Agents SDK only (agent.sdk == openai_agents). Returns true if
#       the agent has at least one same-file Runner.run/run_sync/run_streamed
#       call resolvable to it by variable name, and none of those calls set
#       max_turns. Silent (false) if the agent has no resolvable run call at
#       all — absence of evidence isn't evidence of absence.
#
#   agent_run_call_usage_limits_missing: bool
#       Pydantic AI only (agent.sdk == pydantic_ai). Returns true if the agent
#       has at least one same-file <agent>.run/run_sync/run_stream call
#       resolvable to it by variable name, and none of those calls set
#       usage_limits. Same silence rule as agent_run_call_max_turns_missing.
#
#   agent_mcp_server_kwarg_missing: {classes: [MCPServerStdio, ...], kwarg: tool_filter}
#       Returns true if the agent wires at least one MCP server of any class in
#       `classes` whose `kwarg` is absent OR present with literal None. `kwarg`
#       supports dotted paths. Requires the MCP server ref to be resolved (the
#       def carries the captured kwargs) — an unresolved/external ref is
#       skipped, not counted as missing. `classes` is a list (unlike
#       agent_hosted_tool_kwarg_present's single `class`) because
#       MCPServerStdio/Sse/StreamableHttp all share tool_filter as the same
#       allow-list mechanism, so one rule checks all three. Positive logic
#       (not a negated `_present` predicate, and no separate
#       agent_uses_*_class clause needed): finding a ref whose class is in the
#       list already proves the agent uses it, and with multiple wired servers
#       negating a presence check would go silent as soon as ANY one sets the
#       kwarg, masking the others that don't.
#
#   agent_file_url_force_download: bool
#       Pydantic AI only. Returns true if discovery stamped
#       AgentDef.FileURLForceDownload as "True" or "allow-local" — a
#       FileUrl / ImageUrl / AudioUrl / VideoUrl / DocumentUrl constructor
#       in the agent's file set force_download to a host-side download
#       (True) or a private-IP-allowing download ('allow-local'). Silent
#       when the field is empty (kwarg absent or False).
#
#   agent_run_call_wall_clock_timeout_missing: true | false
#       OpenAI Agents SDK, Pydantic AI, Google ADK and AutoGen only. Fires when
#       this agent has at least one resolvable run call (Runner.run-family /
#       <agent>.run-family / ADK Runner.run + run_async resolved to the agent
#       via Runner(agent=) / InMemoryRunner(agent) / AutoGen initiate_chat
#       (receiver and recipient) + run-family; same-file, non-opaque) and NONE of
#       them sit structurally inside an
#       asyncio.wait_for(...) argument or an asyncio.timeout / anyio.move_on_after
#       / anyio.fail_after `with` block (AgentRunCallDef.WallClockTimeoutWrapped).
#       An unrelated timeout elsewhere in the file is not credited. For ADK and
#       AutoGen a non-None abort_signal / cancellation_token kwarg on the run
#       call also satisfies it. Silent when no run call resolves. Complements
#       max_turns / usage_limits, which bound step count and spend but not how
#       long one step can block.
#
#   agent_kwargs_observed: true | false
#       True iff discovery resolved this agent's call site: kwargs were captured
#       (non-nil) and the call was not opaque (** unpacking). Pair with
#       agent_kwarg_missing so an absence rule fires only when the call was
#       genuinely seen to lack the key, not when it was never linked at all
#       (e.g. a chained StateGraph(...).compile() with no named variable, or a
#       compiled graph that is used as a subgraph).
#
#   agent_checkpointer_in_memory: true | false
#       True when the agent's checkpointer= (LangGraph compile() /
#       create_react_agent() / create_agent()) resolves to an in-process saver:
#       MemorySaver or InMemorySaver, imported from a langgraph module (bare,
#       `as` alias, or module-qualified), passed as a call
#       (MemorySaver(serde=...)) or as a same-file variable bound to one. Any
#       other class, an unresolved name, a saver chosen at runtime, or no
#       checkpointer at all is false. Used by LC-116.
#
#   agent_server_reachable: true | false
#       True when at least one same-SDK run call of the agent is reachable from
#       a server entrypoint (FastAPI / Flask route = http; Celery / Dramatiq task
#       = worker), within the v1 one-hop-per-edge reachability model (inside the
#       entrypoint, a same-file helper it calls, or an imported helper it calls).
#       Run calls correlate by AgentVarName and file, including a LangGraph graph
#       compiled in one module and imported into another (`from graph import
#       app`). Test paths (tests/, test_*.py, conftest.py, ...) are ignored for
#       the agent, the run call and the entrypoint. Used by LC-116.
#
#   repo_langgraph_platform_config_present: true | false
#       DUAL-SCOPE (valid at agent and repo scope, like repo_has_observability).
#       True when the repo ships a langgraph.json at any depth
#       (RepoInventory.Manifest.JSONFiles) — LangGraph Platform then injects its
#       own checkpointer. Used by LC-114 and LC-116 to stay silent on Platform
#       deployments.
#
#
# ━━━ SUBAGENT-SCOPE PREDICATES ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# (used only in scope: subagent rules)
#
#   subagent_grants_tool: [Bash, Write, ...]
#       Fires when the subagent's frontmatter tools= list contains any of the
#       given Claude Code tool names (string matching against the raw tool name
#       in the list — e.g. tools: [Bash, Write, WebSearch]). Use for subagents
#       that call system tools or manipulate files.
#
#   subagent_inherits_all_tools: true | false
#       True when a subagent found in a .claude/agents/ directory has no
#       `tools:` key in its frontmatter and no disallowedTools entries.
#       Claude Code gives such a subagent all tools available to subagents.
#       A `tools:` key with an empty or null value counts as declared (false).
#       Files found by the frontmatter-shape fallback are excluded. Used by
#       CSDK-115.
#
#
# ━━━ SKILL-SCOPE PREDICATES ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# (used only in scope: skill rules — Claude Code Agent Skills, SKILL.md)
#
#   skill_allows_unrestricted_shell: true
#       Fires when allowed-tools pre-approves unrestricted shell — a bare `Bash`
#       grant or a wildcard pattern (Bash(*) / Bash(:*)). allowed-tools is an
#       auto-approval list, not a sandbox, so this auto-runs any shell command
#       without prompting. Bool predicate; negate with `false`.
#
#   skill_allows_tool: [Bash, Write, WebFetch, ...]
#       Fires when allowed-tools pre-approves any of the given Claude Code tool
#       names (matches the parsed grant Tool, then the raw token). PATTERN-BLIND:
#       ignores the grant's Pattern, so "Bash(git status:*)" matches identically
#       to a bare "Bash". Prefer skill_allows_unrestricted_tool when a narrowly-
#       scoped grant should not count.
#
#   skill_allows_unrestricted_tool: [Bash, Write, WebFetch, ...]
#       Fires when allowed-tools pre-approves any of the given tool names with a
#       genuinely unrestricted grant. Unlike skill_allows_tool, this consults the
#       grant's Pattern per Claude Code's own permission-rule semantics: Bash/
#       PowerShell are unrestricted only for "" / "*" / ":*"; WebFetch only for
#       "" / "*" (a "domain:example.com" specifier is a real restriction); Edit
#       only for "" or a catch-all glob ("*", "**", "/**", "//**") — a real path
#       pattern like "docs/**" is a real restriction. Write and NotebookEdit are
#       ALWAYS unrestricted regardless of any pattern written in the grant,
#       because Claude Code accepts but never consults a path specifier on those
#       two tools (only an Edit rule is checked for file writes).
#
#   skill_model_invocable: true
#       Fires when the model can auto-invoke the skill (disable-model-invocation
#       is not set). Pair with skill_allows_unrestricted_tool to flag a
#       model-triggerable skill with a genuinely unrestricted side-effecting
#       grant. Bool predicate.
#
#   skill_body_has_dynamic_exec: true
#       Fires when the SKILL.md body uses dynamic-context shell execution (the
#       inline !`cmd` form or a ```! fenced block), which Claude Code runs during
#       preprocessing — before the model sees the skill. Bool predicate.
#
#   skill_dynamic_exec_touches_network_or_secrets: true
#       Fires when a dynamic-context command performs network egress (curl / wget
#       / nc / ...) or reads credentials/secrets (gh auth, $AWS_*, ~/.aws,
#       ~/.ssh, id_rsa, *_key, ...). The pre-model exfiltration primitive. Bool.
#
#   skill_references_external_url: true
#       Fires when the SKILL.md body references an external http(s) URL — an
#       indirect-injection vector and possible exfiltration endpoint. Bool.
#
#   skill_body_has_injection_marker: true
#       Fires when the body carries a prompt-injection marker (instruction-
#       override phrasing, zero-width characters, or a long base64 blob). Bool.
#
#   skill_bundled_script_network_egress: true
#       Fires when a script bundled in the skill's directory makes outbound
#       network calls (curl / wget / nc / ...). A skill can run its bundled
#       scripts, so this is the payload-in-aux-file egress that scanning
#       SKILL.md alone misses. Bool predicate.
#
#   skill_bundled_script_reads_secrets: true
#       Fires when a bundled script reads credentials/secrets (gh auth, $AWS_*,
#       ~/.aws, ~/.ssh, id_rsa, *_key, ...). Credential theft hidden outside the
#       SKILL.md body. Bool predicate.
#
#   skill_bundled_file_has_hardcoded_secret: true
#       Fires when any non-binary bundled file contains a hardcoded secret
#       literal — a distinctive provider token (AWS AKIA, GitHub ghp_/
#       github_pat_, Slack xox, Google AIza, OpenAI sk-) or a private-key header.
#       A credential committed INTO the skill, distinct from a script that reads
#       one at runtime. High-specificity (low FP). Bool predicate.
#
#   skill_description_tool_mismatch: true
#       Fires when the description explicitly claims to be read-only /
#       side-effect-free yet allowed-tools pre-approve a side-effecting tool
#       (Bash / Write / Edit / WebFetch / NotebookEdit, or unrestricted shell) —
#       a metadata-vs-capability mismatch. Heuristic, low confidence. Bool.
#
#   skill_has_description: true
#       Fires when SkillDef.Description is non-empty (after trimming
#       whitespace). Use skill_has_description: false to flag skills
#       with a missing or blank description. Bool predicate.
#
#   skill_is_agent_specific: true
#       Fires when the skill's frontmatter binds it to one specific agent
#       (context: fork / agent: <name>) rather than being agent-agnostic.
#       An agent-bound skill inherits that agent's trust and guardrail
#       assumptions and is harder to reuse or review independently of it.
#       Bool predicate.
#
#   skill_has_duplicate_tool_refs: true
#       Fires when SkillDef.AllowedTools contains duplicate entries
#       (case-insensitive, whitespace-trimmed) — the same tool referenced
#       more than once unnecessarily. Configuration-quality signal, not a
#       security bug on its own. Bool predicate.
#
#   skill_body_has_text: [substring, substring, ...]
#       Fires when the SKILL.md body (the raw markdown below the frontmatter)
#       contains any listed substring, matched case-insensitively. Mirrors the
#       tool-scope has_body_text — same DISCOURAGED-last-resort caveat: prefer
#       a structured predicate (skill_body_has_dynamic_exec,
#       skill_references_external_url, skill_body_has_injection_marker, ...)
#       when one fits; reserve this for a known phrase with no structural
#       signature.
#
#   skill_name_has_text: [substring, substring, ...]
#       Fires when SkillDef.Name contains any listed substring, matched
#       case-insensitively.
#
#   skill_description_has_text: [substring, substring, ...]
#       Fires when SkillDef.Description contains any listed substring,
#       matched case-insensitively.
#
#   skill_text_matches:
#     fields: [name, description, body]     # subset of these three
#     terms: [term, term, ...]
#     require_context: [term, term, ...]    # optional
#     exclude_context: [term, term, ...]    # optional
#       Sentence-scoped alternative to the three raw-substring predicates
#       above, added to fix confirmed false positives in CSKILL-080/081 that
#       a bare substring match can't distinguish (a term appearing inside an
#       unrelated word, or a data class merely being NAMED rather than
#       actually handled). Splits each named field into sentences (on
#       . ! ? / newline / markdown list-item or heading starts) and matches
#       terms at word boundaries, with the last word of a multi-word term
#       allowed one inflection (-s/-es/-ed/-ing; "sign" also matches
#       "signs"/"signed"/"signing" but not "design"/"assign"/"signal", and a
#       trailing "e" is dropped before -ed/-ing so "store" matches "storing").
#       For the name field "-"/"_" are word separators (a slug: "encrypt-
#       helper" matches "encrypt"); for description/body "-" is a word
#       character (prose: "case-sensitive" does NOT match "sensitive"). A
#       sentence fires when it matches a term in terms AND (require_context is
#       empty, or the sentence ALSO matches a require_context term) AND the
#       sentence matches no exclude_context term. The literal abbreviations
#       "e.g." and "i.e." survive the period-based sentence split (they're
#       normalized before splitting) so they can be used as exclude_context
#       phrases. This predicate does not change the three raw-substring
#       predicates above — CSKILL-082..087 keep using those unmodified.
#
#
# ━━━ REPO-SCOPE PREDICATES ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# (used only in scope: repo rules; match runs once per scan)
#
#   repo_has_sdk_in_code: [claude_agent_sdk, openai_agents, google_adk, mcp,
#                          langchain, crewai, pydantic_ai, vercel_ai, autogen,
#                          openshell]
#       Fires when RepoInventory.SDKsDetected contains the given SDK value.
#       Derived from actually-observed tool/agent kinds in code (not just deps).
#       Special case: "openshell" is NOT an SDK and never appears in
#       SDKsDetected — it routes to RepoInventory.HasShellInvocations (true
#       when a Python function calls subprocess.* / os.system / os.popen).
#
#   repo_component_present: [mcp_config, hook_script, claude_md, ...]
#       Fires when any Component in Manifest.Components has the given kind.
#       Allowed values match models.ComponentKind: mcp_config, claude_md,
#       agents_md, claude_settings, subagent, skill, slash_command,
#       plugin_manifest, hook_script, sandbox_policy, system_prompt,
#       dependency_manifest, claude_agent_definition.
#
#   repo_uses_default_tracing: true | false
#       Fires when the scanner's derived UsesDefaultTracing flag matches.
#       UsesDefaultTracing is false (tracing is NOT on the pure default path)
#       when any parsed Python file's AST contains one of four documented
#       disable mechanisms: an add_trace_processor / set_trace_processors call,
#       an OPENAI_AGENTS_DISABLE_TRACING string literal, a set_tracing_disabled
#       (True) call, or a RunConfig(tracing_disabled=True) construction
#       (matched anywhere in the file, so both the inline
#       Runner.run(agent, run_config=RunConfig(...)) form and an assigned-
#       variable form are covered without dataflow). The match is AST-scoped
#       (call-function names, call arguments, string literals) — a mention
#       inside a comment or an unrelated identifier does not count.
#   repo_has_observability: true | false
#       Fires when the repo has (or lacks) any observability signal in code —
#       an import, init, exporter, or content-capture switch. A declared
#       dependency alone does NOT satisfy it. Valid at repo scope AND at agent
#       scope, where it gates "this agent is the outlier" rules.
#   repo_observability_inspectable: true | false
#       Fires when the repo contains at least one language the observability
#       pass parses (python, typescript, javascript). Pair it with
#       repo_has_observability: false so an absence rule cannot fire on a
#       Go/C#/PHP/Rust repo where nothing was inspected.
#   repo_observability_initialized: true | false
#       Fires when instrumentation is actually switched on (an init call or a
#       per-agent instrument kwarg), not merely imported.
#   repo_observability_declared: true | false
#       Fires when an observability package is DECLARED in a hand-edited
#       dependency manifest (pyproject.toml, requirements.txt, Pipfile,
#       package.json) — reads RepoProfile.ObsDeps, the only predicate that
#       reads recon output instead of code signals. poetry.lock is excluded on
#       purpose: it lists the transitive closure, so a match there proves
#       nobody's intent. Pair it with repo_has_observability to separate
#       "shipped a tracing dep and never wired it" from "never tried".
#   repo_observability_vendor: [langfuse, otel, ...]
#       Fires when any signal names one of the listed vendors.
#   repo_observability_console_only: true | false
#       Fires when span exporters exist AND all of them write to the console.
#       False when there are no exporters at all.
#   repo_observability_captures_content: true | false
#       Fires when the repo switches on capture of full prompt/response text.
#   repo_otel_labels_installed: true | false
#       Fires when agent-reliability-otel-labels is (or is not) present:
#       declared in a root dependency manifest
#       (RepoProfile.OtelLabelsDeclaredIn — `agent-reliability-otel-labels` in a
#       Python manifest, `@trustabl/agent-reliability-otel-labels` in
#       package.json) OR imported in code. Either is enough. Python and
#       TypeScript/JavaScript only; the Go binding is not inspected. Pair it
#       with repo_observability_initialized: true — the library only labels
#       spans that already exist.
#       trustabl.* keys written by hand with set_attribute(s) count too.
#   repo_otel_labels_initialized: true | false
#       Fires when a run is (or is not) started: a `<run>.mark_start(...)` /
#       `<run>.markStart(...)` call appears, which stamps the run identity on
#       the root span. Constructing a Run without it does not count. The call
#       names count only when the library is imported somewhere in the repo.
#       trustabl.* keys written by hand with set_attribute(s) count too.
#   repo_otel_labels_implemented: true | false
#       Fires when the labels are (or are not) written: `mark_run_end` /
#       `markRunEnd` is called, AND — when the repo ships at least one tool the
#       model calls — `mark_tool_span` / `markToolSpan` is called. A tool-less
#       repo needs only the run end. Proves the calls exist, not that the
#       labels land: with no current span each call is a silent no-op.
#       trustabl.* keys written by hand with set_attribute(s) count too.
#   repo_otel_labels_run_shared: true | false
#       Fires when a Run of agent-reliability-otel-labels is (or is not) shared
#       between runs: built at module scope, in a class body, or as a Python
#       default argument, or given a literal run id. A Python construct under
#       `if __name__ == "__main__":` is a one-run script and does not count.
#       Run is matched through each file's import. Test files never count.
#   repo_otel_labels_tool_span_failure_unsafe: true | false
#       Fires when tool spans are (or are not) labelled only on success:
#       mark_tool_span / markToolSpan calls exist and none sits in a finally,
#       except or catch block, a named error callback, or a function passed to
#       .finally( / .catch(. Calls inside an OpenAI Agents RunHooks / AgentHooks
#       on_tool_end method are left out (unknown). One failure-safe call
#       credits the repo. Test files never count.
#   repo_otel_labels_attempt_constant: true | false
#       Fires when every tool-span label passes `attempt` as an integer
#       literal. One counted attempt credits the repo. Test files never count.
#   repo_otel_labels_run_end_success_only: true | false
#       Fires when run-end labels exist and none can record a failure. A call
#       credits the repo when it sits in an except / catch block, an error
#       callback or a .catch( handler, passes the literal "error", or passes a
#       variable reason. A fixed reason in finally does not credit it. Test
#       files never count.
#   repo_raw_anthropic_tool_output_in_system: true | false
#       Fires when a function drives the bare `anthropic` client in a manual
#       tool-use loop (.messages.create(..., tools=...)) and passes a runtime-
#       built system= prompt referencing a name tainted by the tool-call input
#       or its result (RepoInventory.RawAnthropicToolOutputInSystemPrompt).
#       Same-function name-level heuristic. Category raw_llm_sdk.
#   repo_raw_openai_tool_output_in_system: true | false
#       Same for the bare `openai` client: .chat.completions.create(...,
#       tools=...) plus a {"role": "system"|"developer", "content": <dynamic,
#       tainted>} dict (RepoInventory.RawOpenAIToolOutputInSystemMessage).
#   repo_project_mcp_autoenable: true | false
#       Pre-trust project config (category agent_config). True when a committed
#       .claude/settings.json sets enableAllProjectMcpServers: true or a
#       non-empty enabledMcpjsonServers (ProjectConfigFacts.MCPAutoEnable).
#       Used by AGCFG-004.
#   repo_project_hook_runs_untrusted_command: true | false
#       True when a Claude/Gemini project settings hook command runs a
#       repo-relative script, a curl/wget/nc/bash -c/python -c primitive, or
#       references .ssh/.aws/.env (ProjectConfigFacts.RiskyHooks). AGCFG-005.
#   repo_workspace_env_overrides_trust: true | false
#       True when .gemini/.env or .codex/config.toml (or, narrowly, a root .env)
#       carries a sandbox/proxy/endpoint/loader override key, or Codex sets
#       sandbox_mode = "danger-full-access" / approval_policy = "never". Env
#       files are read for KEY NAMES only; values are never stored.
#       (ProjectConfigFacts.TrustOverrideEnv). AGCFG-006.
#   repo_editor_agent_auto_approve: true | false
#       True when .vscode/settings.json or .cursor/*.json sets any *autoApprove*
#       or *yolo* key to boolean true (ProjectConfigFacts.EditorAutoApprove).
#       AGCFG-007.
#   repo_mcp_config_launches_local_command: true | false
#       True when a project MCP config (.mcp.json, .cursor/mcp.json,
#       .vscode/mcp.json, .gemini/settings.json, .codex/config.toml) starts a
#       server with an interpreter plus inline code or a repo-relative script,
#       or a command path inside the repo (ProjectConfigFacts.LocalMCPLaunch).
#       Published packages and remote URL servers are not flagged. MCPCFG-002.
#   repo_mcp_config_launches_unpinned_package: true | false
#       True when a project MCP config (.mcp.json, .cursor/mcp.json,
#       .vscode/mcp.json, claude_desktop_config.json, .gemini/settings.json,
#       .codex/config.toml) starts a server with npx, bunx, pnpm dlx, uvx,
#       uv tool run, pipx run or docker run on a package or image with no exact
#       version (npm: exact semver; uv and pipx: ==, or uv's name@version;
#       docker: an @sha256: digest) (ProjectConfigFacts.UnpinnedMCPLaunch).
#       Git, URL, local-path and $VAR specs are not judged; a command inside the
#       repo is left to repo_mcp_config_launches_local_command, so the two never
#       judge one entry. MCPCFG-003.
#   repo_mcp_config_unscoped_credential: true | false
#       True when a project MCP config (the files above) starts a server with a
#       credential and none of the scope options the server documents: the
#       github-mcp-server binary or ghcr.io/github/github-mcp-server image with
#       GITHUB_PERSONAL_ACCESS_TOKEN and no --read-only / GITHUB_READ_ONLY,
#       --toolsets / GITHUB_TOOLSETS or --tools / GITHUB_TOOLS; the deprecated
#       npm package @modelcontextprotocol/server-github with that token (it has
#       no such option); @supabase/mcp-server-supabase with neither --read-only
#       nor --project-ref; or any env key whose name contains SERVICE_ROLE
#       (ProjectConfigFacts.UnscopedMCPCredential). Env keys are read by name;
#       only the value of GITHUB_READ_ONLY and GITHUB_TOOLSETS is inspected, and
#       it is reduced to a state and never stored. A value with a $ reference
#       counts as a set option. A command inside the repo is left to
#       repo_mcp_config_launches_local_command. Remote URL servers are not
#       judged. MCPCFG-004.
#   repo_mcp_config_remote_plain_http: true | false
#       True when a project MCP config (the files above) gives a url or httpUrl
#       with the http scheme and a host that is not localhost or a loopback
#       address (ProjectConfigFacts.PlainHTTPMCPServer). A private address,
#       host.docker.internal or a .local name counts as not loopback. A value
#       with a $ reference is not judged. MCPCFG-005.
#   repo_codex_hook_runs_repo_command: true | false
#       True when a committed .codex/hooks.json command or commandWindows runs a
#       repo-relative script (including the documented
#       "$(git rev-parse --show-toplevel)/..." form), a curl/wget/nc/bash -c/
#       python -c primitive, or references .ssh/.aws/.env
#       (ProjectConfigFacts.CodexRiskyHooks). Kept apart from
#       repo_project_hook_runs_untrusted_command because Codex skips a project
#       hook until the user reviews and trusts it. AGCFG-008.
#   repo_agents_md_has_hidden_text: true | false
#       True when an AGENTS.md (any depth) contains invisible or
#       direction-overriding characters: zero-width characters, Unicode
#       Tags-block characters, or bidirectional overrides
#       (ProjectConfigFacts.HiddenAgentText). Exempts a leading byte order mark,
#       emoji and non-ASCII letter sequences joined by a zero-width (non-)joiner,
#       and subdivision-flag emoji. Text is never echoed. AGCFG-009.
#   repo_harness_guidance_has_hidden_text: true | false
#       The AGCFG-009 character test over the guidance files of a staged OpenCode
#       harness tree (systemprompt.md, guardrails.md, LongTermMEMORY.md,
#       tool_descriptions/*.md; ProjectConfigFacts.HiddenHarnessText). Same
#       exemptions, text never echoed. AGCFG-010. A separate predicate from
#       repo_agents_md_has_hidden_text, which keeps its AGENTS.md-only meaning.
#   repo_ci_agent_untrusted_trigger_ungated: true | false
#       CI workflows (category ci; applies_to github_actions). True when a coding
#       agent step runs on pull_request_target, issue_comment, issues, discussion,
#       discussion_comment or pull_request_review_comment with no actor gate
#       (CIWorkflowFacts.UntrustedUngated). A gate is an author_association
#       allow-list of OWNER/MEMBER/COLLABORATOR, a literal actor check, or (for
#       pull_request_target) a same-repo check, on the job, the step or a needs
#       ancestor; claude-code-action and codex-action count as gated through
#       their own write-access check unless a '*' bypass input is set. `if:`
#       text is matched, never evaluated. One hit per agent step. CI-001.
#   repo_ci_agent_untrusted_trigger_privileged: true | false
#       The CI-001 condition plus a write token (write-all, or contents,
#       pull-requests, actions or packages: write), a secret outside the agent's
#       model-key input, or `secrets: inherit`
#       (CIWorkflowFacts.UntrustedPrivileged). CI-002.
#   repo_ci_agent_checkout_persists_credentials: true | false
#       An agent job on an untrusted trigger has an actions/checkout step whose
#       persist-credentials is not the literal false
#       (CIWorkflowFacts.CheckoutPersists). Fires with or without an actor gate.
#       CI-003.
#   repo_ci_agent_unrestricted_shell: true | false
#       An agent step on an untrusted trigger grants Bash with no pattern or a
#       shell/interpreter/download-tool prefix, a bare run_shell_command, or
#       skips approvals or the sandbox (CIWorkflowFacts.UnrestrictedShell).
#       CI-004.
#   repo_ci_agent_no_egress_restriction: true | false
#       An agent step on an untrusted trigger has shell or fetch access and no
#       earlier step-security/harden-runner step with egress-policy: block in the
#       same job (CIWorkflowFacts.NoEgressRestriction). CI-005.
#   repo_settings_preapprove_user_content_fetch: true | false
#       A WebFetch rule in permissions.allow of .claude/settings.json or
#       settings.local.json covers a host serving user-published content
#       (github.com, gist.github.com, raw.githubusercontent.com, an arbitrary
#       *.github.io site, huggingface.co, bitbucket.org, pastebin.com, an
#       arbitrary *.readthedocs.io site), using Claude Code's domain: matching.
#       Bare WebFetch and domain:* count. A deny or ask rule in the same .claude/
#       folder covering the host cancels it (ProjectConfigFacts.UserContentFetchAllow).
#       The entry is named in the hit's Reason, never in the finding text. AGCFG-011.
#   repo_settings_allow_exec_capable_prefix: true | false
#       A Bash rule in permissions.allow of .claude/settings.json or
#       settings.local.json is a bare git, xargs or npx command followed by a
#       trailing wildcard ("git:*" or "git *"). A narrower prefix and an exact
#       command are not matched. A bare Bash, Bash(*) or same-prefix deny or ask
#       rule in the same .claude/ folder cancels it (ProjectConfigFacts.ExecCapableAllow).
#       The entry is named in the hit's Reason, never in the finding text. AGCFG-012.
#   repo_claude_default_mode_is: [bypassPermissions, acceptEdits, ...]
#       Fires when any discovered .claude/settings.json (or settings.local.json)
#       declares a defaultMode equal to one of the listed modes. Reads
#       RepoInventory.ClaudeSettings[].DefaultMode. Used by CSDK-201 to flag
#       defaultMode: bypassPermissions, which disables Claude Code approval
#       prompts repo-wide.
#   repo_claude_options_permission_mode_is: [bypassPermissions, acceptEdits, ...]
#       Fires when any discovered ClaudeAgentOptions(...) construction sets
#       permission_mode to one of the listed modes. Reads
#       RepoInventory.ClaudeAgentOptions[].Kwargs (permission_mode). The in-code,
#       session-level analogue of repo_claude_default_mode_is. Used by CSDK-202.
#   repo_claude_options_max_turns_missing: true | false
#       Fires when the repo has at least one non-opaque ClaudeAgentOptions(...)
#       construction and NONE of them set max_turns. Reads
#       RepoInventory.ClaudeAgentOptions[].Kwargs (max_turns) via the same
#       lookup as repo_claude_options_permission_mode_is. Constructions built
#       with ** unpacking (Opaque: true) are skipped — their kwarg set is
#       untrustworthy, so their silence isn't evidence of a missing cap. A repo
#       with zero ClaudeAgentOptions constructions never fires. Used by
#       CSDK-204.
#   repo_claude_options_disallowed_tools_missing: true | false
#       Fires when the repo has at least one non-opaque ClaudeAgentOptions(...)
#       construction and NONE of them set disallowed_tools. Reads
#       RepoInventory.ClaudeAgentOptions[].Kwargs (disallowed_tools) via the
#       same lookup and Opaque-skip rules as
#       repo_claude_options_max_turns_missing. A repo with zero
#       ClaudeAgentOptions constructions never fires. Note: a construction that
#       sets disallowed_tools=[] or disallowed_tools=None still counts as "set"
#       — the presence check only requires a non-nil Value, the same tri-state
#       gap max_turns=None already has. Used by CSDK-205.
#   repo_claude_options_mode_without_kwarg:
#     modes: [bypassPermissions, ...]
#     kwarg: disallowed_tools
#       Fires when a SINGLE discovered ClaudeAgentOptions(...) construction
#       both sets permission_mode to one of modes AND does not set kwarg at
#       that SAME site. This is the per-call-site correlation the two
#       predicates above lack: repo_claude_options_permission_mode_is and
#       repo_claude_options_disallowed_tools_missing each scan across every
#       ClaudeAgentOptions in the repo independently, so a repo with two
#       options objects — one bypassPermissions with no deny-list, one safe
#       with a deny-list — silences their combination even though the risky
#       site is real. Unlike repo_claude_options_disallowed_tools_missing,
#       Opaque (** unpacking) sites are NOT skipped here: a kwarg hidden
#       inside the unpacked dict simply reads as absent at that site, since an
#       unreadable deny-list is not a mitigation this engine can credit.
#       allowed_tools is deliberately NOT part of this predicate family — per
#       the Agent SDK's own reference docs, allowed_tools only auto-approves
#       and does NOT restrict which tools can run, so an empty/narrow
#       allowed_tools alongside bypassPermissions is the maximally dangerous
#       shape, not a mitigated one (see docs/decisions/tool-allowlist-scope.md).
#       Used by CSDK-202/CSDK-206.
